name: let names expressions once per step, a later entry reads an earlier one, and gates and explain read them
stepfile:
  stepgate: "1"
  id: citations
  inputs: { type: object, required: [sources], properties: { sources: { type: array, items: { type: string } } } }
  steps:
    - id: cite
      instructions: "Cite only these sources: {{inputs.sources}}"
      produces: { type: object, required: [cited], properties: { cited: { type: array, items: { type: string } } } }
      let:
        cited: { unique: { var: output.cited } }
        unknown: { difference: [{ var: let.cited }, { var: inputs.sources }] }
      gates:
        - id: known-sources
          message: "cite only the given sources; these are not among them:"
          predicate: { "==": [{ length: { var: let.unknown } }, 0] }
          explain: { var: let.unknown }
      retries: 1
inputs: { sources: [S-01, S-02] }
actions:
  - submit: { cited: [S-01, S-09, S-09] }
  - submit: { cited: [S-01, S-02] }
expect:
  replies:
    - { state: running, step: cite }
    - { state: running, failures: [known-sources], contain: 'these are not among them: ["S-09"]' }
    - { state: finished }
  ledger: [run_started, step_started, submit, gate, submit, gate, step_passed, run_finished]
