name: a failed and with no explain reports each failing part it can diagnose, and an explain replaces the automatic diagnosis
stepfile:
  stepgate: "1"
  id: citations
  inputs: { type: object, required: [sources], properties: { sources: { type: array, items: { type: string } } } }
  steps:
    - id: cite
      instructions: "Cite these sources: {{inputs.sources}}"
      produces: { type: object, required: [cited, count], properties: { cited: { type: array, items: { type: string } }, count: { type: integer } } }
      gates:
        - id: explained
          message: "cite only the given sources:"
          predicate: { subset: [{ var: output.cited }, { var: inputs.sources }] }
          explain: { cat: [unknown, " ", { length: { difference: [{ var: output.cited }, { var: inputs.sources }] } }] }
        - id: cited-and-counted
          message: cite only the given sources and count them
          predicate:
            and:
              - subset: [{ var: output.cited }, { var: inputs.sources }]
              - "==": [{ var: output.count }, { length: { var: output.cited } }]
inputs: { sources: [S-01, S-02] }
actions:
  - submit: { cited: [S-01, S-09], count: 1 }
expect:
  replies:
    - { state: running, step: cite }
    - { state: failed, error: GateFailed, contain: 'explained: cite only the given sources: unknown 1; cited-and-counted: cite only the given sources and count them ["S-09"] | expected 2, got 1' }
  ledger: [run_started, step_started, submit, gate, gate, run_failed]
