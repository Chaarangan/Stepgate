name: a mechanical call with each is made once per element, in order, and an empty array makes no request
api:
  routes:
    - method: GET
      path: /items?shelf=A
      answers: [{ status: 200, json: { items: [{ id: K-1 }, { id: K-2 }] } }]
    - method: GET
      path: /items?shelf=B
      answers: [{ status: 200, json: { items: [{ id: K-3 }] } }]
stepfile:
  stepgate: "1"
  id: shelves
  inputs: { type: object, required: [shelves, none], properties: { shelves: { type: array }, none: { type: array } } }
  tools:
    catalogue:
      openapi:
        server: "${api.origin}"
        document:
          openapi: 3.1.0
          info: { title: Catalogue, version: "1" }
          paths:
            /items:
              get:
                operationId: listItems
                parameters: [{ name: shelf, in: query, required: true, schema: { type: string } }]
      exposes: [listItems]
  steps:
    - id: fetch
      do:
        calls:
          - id: shelf
            operation: listItems
            each: { var: inputs.shelves }
            arguments: { shelf: { var: item } }
          - id: nothing
            operation: listItems
            each: { var: inputs.none }
            arguments: { shelf: { var: item } }
        output:
          counts: { map: [{ var: responses.shelf }, { length: { var: items } }] }
          skipped: { length: { var: responses.nothing } }
      produces: { type: object }
inputs: { shelves: [A, B], none: [] }
actions: []
expect:
  replies:
    - { state: finished, contain: '"skipped": 0' }
  ledger: [run_started, step_started, tool_call, tool_call, computed, step_passed, run_finished]
  requests:
    - { method: GET, path: /items?shelf=A }
    - { method: GET, path: /items?shelf=B }
