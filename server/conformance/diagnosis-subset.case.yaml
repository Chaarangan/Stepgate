name: a failed subset predicate with no explain lists the items that were not in the second array
stepfile:
  stepgate: "1"
  id: citations
  inputs: { type: object, required: [sources], properties: { sources: { type: array, items: { type: string } } } }
  steps:
    - id: cite
      instructions: "Cite only these sources: {{inputs.sources}}"
      produces: { type: object, required: [cited], properties: { cited: { type: array, items: { type: string } } } }
      gates:
        - id: known-sources
          message: cite only the given sources
          predicate: { subset: [{ var: output.cited }, { var: inputs.sources }] }
inputs: { sources: [S-01, S-02] }
actions:
  - submit: { cited: [S-01, S-07, S-09] }
expect:
  replies:
    - { state: running, step: cite }
    - { state: failed, error: GateFailed, contain: 'known-sources: cite only the given sources ["S-07","S-09"]' }
  ledger: [run_started, step_started, submit, gate, run_failed]
