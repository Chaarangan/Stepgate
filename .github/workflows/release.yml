name: Release

# Publishing a GitHub release tagged vX.Y.Z publishes that version to npm (so `npx -y stepgate` gets it),
# to GitHub Packages, and to the MCP Registry, and attaches the package tarball to the release.
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name }}
  # A release marked as a pre-release goes to the `next` dist-tag, so `npx -y stepgate` keeps the last stable one.
  DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}

jobs:
  check:
    name: check the release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Check the tag matches every version field
        run: node scripts/check-release-version.ts "$TAG"
      - run: npm ci
      - run: npm run check

  npm:
    name: publish to npm
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing: npm exchanges this OIDC token for a publish token and adds provenance
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Check npm supports trusted publishing (11.5.1 or later)
        run: node -e 'const v = process.argv[1].split(".").map(Number); if (v[0] * 1e6 + v[1] * 1e3 + v[2] < 11005001) { console.error("npm " + process.argv[1] + " is older than 11.5.1"); process.exit(1); }' "$(npm --version)"
      - run: npm ci
      - run: npm publish --tag "$DIST_TAG"

  github-packages:
    name: publish to GitHub Packages
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@chaarangan"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # GitHub Packages only takes packages scoped to the repository owner.
      - run: npm pkg set name=@chaarangan/stepgate
      - run: npm publish --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mcp-registry:
    name: publish to the MCP Registry
    needs: npm
    # The registry lists the latest version it is given, so pre-releases stay out of it.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the registry verifies the io.github.Chaarangan namespace from this OIDC token
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
      # npm takes minutes to serve a new version, and the registry refuses a package version it cannot find there.
      - name: Wait until npm serves this version
        run: |
          version="${TAG#v}"
          for attempt in $(seq 1 30); do
            npm view "stepgate@$version" version > /dev/null 2>&1 && exit 0
            echo "::warning::stepgate@$version is not on npm yet (attempt $attempt of 30); waiting 20s"
            sleep 20
          done
          echo "::error::stepgate@$version did not appear on npm within 10 minutes"
          exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  tarball:
    name: attach the package to the release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - run: gh release upload "$TAG" "$RUNNER_TEMP"/stepgate-*.tgz
        env:
          GH_TOKEN: ${{ github.token }}
