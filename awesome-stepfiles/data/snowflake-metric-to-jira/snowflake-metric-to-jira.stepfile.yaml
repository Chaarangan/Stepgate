# yaml-language-server: $schema=../../../server/schema/stepfile.schema.json
stepgate: "1"
id: snowflake-metric-to-jira
title: Check a Snowflake metric against a threshold and open a draft Jira issue on breach
description: >
  Runs one fixed, read-only SELECT you supply against Snowflake through the SQL API once a person
  approves it, checks the metric it returns against your threshold, and only when the threshold is
  breached, and a person approves the draft, creates a Jira issue labelled stepgate-draft that quotes
  the exact values returned and the exact SQL.

inputs:
  type: object
  required: [sql, metric_name, metric_column, threshold, breach_when, warehouse, role, jira_project, jira_issue_type]
  additionalProperties: false
  properties:
    # A single SELECT or WITH query: no semicolon except one at the very end.
    sql:
      type: string
      maxLength: 10000
      pattern: "^\\s*([Ss][Ee][Ll][Ee][Cc][Tt]|[Ww][Ii][Tt][Hh])\\s[^;]*;?\\s*$"
      description: "One read-only SELECT (or WITH ... SELECT) statement returning exactly one row"
    metric_name: { type: string, pattern: "^\\S(.{0,78}\\S)?$", description: "Human name of the metric, for example Checkout error rate" }
    metric_column: { type: string, pattern: "^[^\\s\"]{1,255}$", description: "Result column holding the metric, as Snowflake names it (unquoted identifiers are upper case), for example ERROR_RATE" }
    threshold: { type: number, description: "The limit the metric is compared with" }
    breach_when: { enum: [above, below], description: "above: breached when the metric is greater than threshold; below: when it is less" }
    warehouse: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_$]{0,254}$", description: "Warehouse to run the query in" }
    role: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_$]{0,254}$", description: "Role to run the query as; use one that can only read" }
    jira_project: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,9}$", description: "Jira project key for the issue, for example DATA" }
    jira_issue_type: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9 _-]{0,58}[A-Za-z0-9]$", description: "Issue type name, for example Task" }

settings:
  snowflake-account:
    description: >
      Your Snowflake account identifier as it appears in your account URL, in lower case, the
      "myorg-myaccount" in myorg-myaccount.snowflakecomputing.com.
    pattern: "^[a-z0-9]+([._-][a-z0-9]+)*$"
  jira-site:
    description: Your Atlassian site name, the "acme" in acme.atlassian.net.

credentials:
  snowflake:
    kind: bearer
    hosts: ["{snowflake-account}.snowflakecomputing.com"]
    description: >
      A Snowflake programmatic access token (the token secret) for a user whose role can only read the
      tables the query uses and use the warehouse. Runs the one SELECT given as input.
  jira:
    kind: basic
    hosts: ["{jira-site}.atlassian.net"]
    description: >
      An Atlassian account email and an API token created without scopes, as you@example.com:API_TOKEN.
      The account needs Browse projects and Create issues in the target project. Creates at most one
      issue, labelled stepgate-draft, and only when the threshold is breached.

tools:
  snowflake:
    openapi:
      server: https://{snowflake-account}.snowflakecomputing.com/api/v2
      document:
        openapi: 3.1.0
        info: { title: Snowflake SQL API v2 (trimmed), version: "2" }
        paths:
          /statements:
            post:
              operationId: executeStatement
              summary: >
                Run one SQL statement synchronously. On success returns code "090001", statementHandle,
                resultSetMetaData (numRows, rowType with each column's name and type) and data, an array
                of rows in which every value is a string or null.
              parameters:
                - name: X-Snowflake-Authorization-Token-Type
                  in: header
                  required: true
                  schema: { type: string, enum: [PROGRAMMATIC_ACCESS_TOKEN] }
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required: [statement, warehouse, role]
                      additionalProperties: false
                      properties:
                        statement: { type: string, minLength: 1, maxLength: 10000 }
                        warehouse: { type: string, minLength: 1 }
                        role: { type: string, minLength: 1 }
              responses:
                "200": { description: "A ResultSet" }
                "202": { description: "Still running; a QueryStatus with a statement handle" }
                "422": { description: "The statement failed; a QueryFailureStatus" }
    credential: snowflake
    exposes: [executeStatement]

  jira-cloud:
    openapi:
      server: https://{jira-site}.atlassian.net/rest/api/3
      document:
        openapi: 3.1.0
        info: { title: Jira Cloud platform REST API v3 (trimmed), version: "3" }
        paths:
          /issue:
            post:
              operationId: createJiraIssue
              summary: >
                Create one Jira issue. The description is Atlassian Document Format: one paragraph with
                one text node, then one code block with one text node. Returns id, key and self.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required: [fields]
                      additionalProperties: false
                      properties:
                        fields:
                          type: object
                          required: [project, issuetype, summary, labels, description]
                          additionalProperties: false
                          properties:
                            project:
                              type: object
                              required: [key]
                              additionalProperties: false
                              properties:
                                key: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,9}$" }
                            issuetype:
                              type: object
                              required: [name]
                              additionalProperties: false
                              properties:
                                name: { type: string, minLength: 1, maxLength: 60 }
                            summary: { type: string, minLength: 1, maxLength: 255 }
                            labels: { const: [stepgate-draft] }
                            description:
                              type: object
                              required: [type, version, content]
                              additionalProperties: false
                              properties:
                                type: { const: doc }
                                version: { const: 1 }
                                content:
                                  type: array
                                  minItems: 2
                                  maxItems: 2
                                  prefixItems:
                                    - type: object
                                      required: [type, content]
                                      additionalProperties: false
                                      properties:
                                        type: { const: paragraph }
                                        content:
                                          type: array
                                          minItems: 1
                                          maxItems: 1
                                          items:
                                            type: object
                                            required: [type, text]
                                            additionalProperties: false
                                            properties:
                                              type: { const: text }
                                              text: { type: string, minLength: 1, maxLength: 4000, pattern: "^[^\\n]*$" }
                                    - type: object
                                      required: [type, content]
                                      additionalProperties: false
                                      properties:
                                        type: { const: codeBlock }
                                        content:
                                          type: array
                                          minItems: 1
                                          maxItems: 1
                                          items:
                                            type: object
                                            required: [type, text]
                                            additionalProperties: false
                                            properties:
                                              type: { const: text }
                                              text: { type: string, minLength: 1, maxLength: 10000 }
              responses:
                "201": { description: "id, key and self of the created issue" }
    credential: jira
    exposes: [createJiraIssue]

# executeStatement runs whatever SQL it is given, so it counts as a write even for a SELECT, and a person
# approves the statement before Stepgate sends it.
steps:
  - id: confirm
    instructions: |
      Stepgate will run this SQL statement in Snowflake, in warehouse {{inputs.warehouse}} as role
      {{inputs.role}}, once a person approves it:

      ----- SQL START -----
      {{inputs.sql}}
      ----- SQL END -----

      Submit an empty object, {}. Stepgate fills in the statement, warehouse and role and asks a
      person to approve them.
    produces:
      type: object
      required: [statement, warehouse, role]
      additionalProperties: false
      properties:
        statement: { type: string }
        warehouse: { type: string }
        role: { type: string }
    derive:
      statement: { var: inputs.sql }
      warehouse: { var: inputs.warehouse }
      role: { var: inputs.role }
    gates:
      - id: person-approves-sql
        approve: { message: "Stepgate will run this SQL statement in Snowflake, in this warehouse and as this role, and read one row of its result. Run it?" }

  - id: query
    do:
      calls:
        - id: query
          operation: executeStatement
          arguments:
            body:
              statement: { var: steps.confirm.statement }
              warehouse: { var: steps.confirm.warehouse }
              role: { var: steps.confirm.role }
      output:
        code: { var: responses.query.code }
        statement_handle: { var: responses.query.statementHandle }
        num_rows: { var: responses.query.resultSetMetaData.numRows }
        columns: { map: [{ var: responses.query.resultSetMetaData.rowType }, { var: name }] }
        column_index: &column-index
          get:
            - get:
                - get:
                    - join:
                        - [{ object: [[name, { var: inputs.metric_column }]] }]
                        - reduce: [{ var: responses.query.resultSetMetaData.rowType }, { merge: [{ var: accumulator }, [{ object: [[i, { length: { var: accumulator } }], [name, { var: current.name }]] }]] }, []]
                        - name
                        - name
                    - 0
                - right
            - i
        row: { var: responses.query.data.0 }
        metric_raw: &metric-raw { get: [{ var: responses.query.data.0 }, *column-index] }
        # Snowflake returns every value as a string; only a plain decimal number is read as the metric.
        metric_value: &metric-value
          if:
            - "==": [{ length: { match_all: [*metric-raw, "^-?[0-9]+(\\.[0-9]+)?([eE][-+]?[0-9]+)?$"] } }, 1]
            - "+": [*metric-raw]
            - null
        breached:
          if:
            - "===": [*metric-value, null]
            - null
            - "==": [{ var: inputs.breach_when }, above]
            - ">": [*metric-value, { var: inputs.threshold }]
            - "<": [*metric-value, { var: inputs.threshold }]
    produces:
      type: object
      required: [code, statement_handle, num_rows, columns, column_index, row, metric_raw, metric_value, breached]
      properties:
        code: { type: [string, "null"] }
        statement_handle: { type: [string, "null"] }
        num_rows: { type: [integer, "null"] }
        columns: { type: array, items: { type: string } }
        column_index: { type: [integer, "null"] }
        row: { type: [array, "null"], items: { type: [string, "null"] } }
        metric_raw: { type: [string, "null"] }
        metric_value: { type: [number, "null"] }
        breached: { type: [boolean, "null"] }
    gates:
      - id: one-complete-row
        message: The statement must finish (code 090001) and return exactly one row, with distinct column names.
        predicate:
          and:
            - "===": [{ var: output.code }, "090001"]
            - "===": [{ var: output.num_rows }, 1]
            - "==": [{ length: { unique: { var: output.columns } } }, { length: { var: output.columns } }]
      - id: metric-is-number
        message: The result must have a column named exactly metric_column, holding a plain decimal number, not null or text.
        predicate: { "!==": [{ var: output.metric_value }, null] }

  - id: draft
    when: { var: steps.query.breached }
    instructions: |
      The metric "{{inputs.metric_name}}" (column {{inputs.metric_column}}) came back from Snowflake as
      {{steps.query.metric_raw}}, {{inputs.breach_when}} the threshold {{inputs.threshold}}, so
      Stepgate will open a Jira issue in {{inputs.jira_project}} with the summary
      "{{inputs.metric_name}} breached: {{steps.query.metric_raw}}" and the SQL in a code block.

      Write its description: one line of plain text with no line breaks. It starts with exactly
      "{{inputs.metric_name}} ({{inputs.metric_column}}) returned {{steps.query.metric_raw}}, {{inputs.breach_when}} the threshold {{inputs.threshold}}. "
      and goes on to name the Snowflake statement handle {{steps.query.statement_handle}} and every
      value of the returned row exactly as returned, labelled with its column name. Do not repeat the
      SQL. The columns and row are:

      {{steps.query.columns}}
      {{steps.query.row}}
    produces:
      type: object
      required: [project_key, issue_type, summary, description]
      additionalProperties: false
      properties:
        project_key: { type: string }
        issue_type: { type: string }
        summary: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, minLength: 1, maxLength: 4000, pattern: "^[^\\n]*$" }
    derive:
      project_key: { var: inputs.jira_project }
      issue_type: { var: inputs.jira_issue_type }
      summary: { cat: [{ var: inputs.metric_name }, " breached: ", { var: steps.query.metric_raw }] }
    let:
      opening: { cat: [{ var: inputs.metric_name }, " (", { var: inputs.metric_column }, ") returned ", { var: steps.query.metric_raw }, ", ", { var: inputs.breach_when }, " the threshold ", { var: inputs.threshold }, ". "] }
    gates:
      - id: description-opening
        message: The description must start with the opening sentence given in the instructions.
        predicate: { "===": [{ substr: [{ var: output.description }, 0, { length: { var: let.opening } }] }, { var: let.opening }] }
      - id: description-cites-handle
        message: The description must name the Snowflake statement handle.
        predicate: { in: [{ var: steps.query.statement_handle }, { var: output.description }] }
      # The accumulator stays the description while every non-null row value appears in it, and becomes "" at the first that does not.
      - id: description-quotes-row
        message: The description must quote every non-null value of the returned row exactly as returned.
        predicate:
          "===":
            - reduce:
                - var: steps.query.row
                - if:
                    - or: [{ "===": [{ var: current }, null] }, { in: [{ var: current }, { var: accumulator }] }]
                    - var: accumulator
                    - ""
                - var: output.description
            - var: output.description
      - id: person-approves-issue
        approve: { message: "Stepgate will create this Jira issue, labelled stepgate-draft, with the SQL in a code block after the description. Create it?" }
    retries: 2

  - id: create
    when: { var: steps.query.breached }
    do:
      calls:
        - id: create
          operation: createJiraIssue
          arguments:
            body:
              fields:
                project: { key: { var: steps.draft.project_key } }
                issuetype: { name: { var: steps.draft.issue_type } }
                summary: { var: steps.draft.summary }
                labels: [stepgate-draft]
                description:
                  type: doc
                  version: 1
                  content:
                    - { type: paragraph, content: [{ type: text, text: { var: steps.draft.description } }] }
                    - { type: codeBlock, content: [{ type: text, text: { var: steps.confirm.statement } }] }
      output:
        jira_key: { var: responses.create.key }
    produces:
      type: object
      required: [jira_key]
      properties:
        jira_key: { type: string, pattern: "^[A-Z][A-Z0-9_]+-[0-9]+$" }

  - id: report
    do:
      output:
        sql: { var: inputs.sql }
        metric_raw: { var: steps.query.metric_raw }
        threshold: { var: inputs.threshold }
        breached: { var: steps.query.breached }
        jira_key: { var: steps.create.jira_key }
        summary:
          cat:
            - "**"
            - { var: inputs.metric_name }
            - "** ("
            - { var: inputs.metric_column }
            - ") returned "
            - { var: steps.query.metric_raw }
            - "; the threshold is "
            - { var: inputs.threshold }
            - ", breached when the metric is "
            - { var: inputs.breach_when }
            - " it. "
            - if:
                - { var: steps.query.breached }
                - { cat: ["The threshold is breached, so Jira issue ", { var: steps.create.jira_key }, " was created, labelled stepgate-draft for review."] }
                - The threshold is not breached, so no Jira issue was created.
            - "\n\nSnowflake statement handle: "
            - { var: steps.query.statement_handle }
            - "\n\n```sql\n"
            - { var: inputs.sql }
            - "\n```\n"
    produces:
      type: object
      required: [sql, metric_raw, threshold, breached, jira_key, summary]
      properties:
        sql: { type: string }
        metric_raw: { type: string }
        threshold: { type: number }
        breached: { type: boolean }
        jira_key: { type: [string, "null"] }
        summary: { type: string }
