# yaml-language-server: $schema=../../../server/schema/stepfile.schema.json
stepgate: "1"
id: airtable-field-completeness
title: Audit an Airtable table for empty required fields
description: >
  Reads up to 100 records of one Airtable table and reports, record by record,
  which of the fields you name are empty. Read-only.

inputs:
  type: object
  required: [base_id, table, required_fields]
  properties:
    base_id:
      type: string
      description: The base's id, the app... part of its URL.
      pattern: "^app[A-Za-z0-9]{14}$"
    table:
      type: string
      description: The table's name or its tbl... id.
      minLength: 1
    required_fields:
      type: array
      description: The field names every record should fill in.
      minItems: 1
      maxItems: 10
      uniqueItems: true
      items: { type: string, minLength: 1 }

credentials:
  airtable:
    kind: bearer
    hosts: [api.airtable.com]
    description: >
      An Airtable personal access token with the data.records:read and
      schema.bases:read scopes on the base to audit. Nothing is written.

tools:
  airtable:
    openapi:
      server: https://api.airtable.com
      document:
        openapi: 3.1.0
        info: { title: Airtable Web API, reads only, version: "0" }
        paths:
          /v0/meta/bases/{baseId}/tables:
            get:
              operationId: getBaseSchema
              summary: >
                The base's tables, each with its id, name and fields (id, name
                and type).
              security: [{ token: [] }]
              parameters:
                - { name: baseId, in: path, required: true, schema: { type: string, pattern: "^app[A-Za-z0-9]{14}$" } }
              responses:
                "200":
                  description: The base schema.
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          tables:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: string }
                                name: { type: string }
                                fields:
                                  type: array
                                  items: { type: object, properties: { id: { type: string }, name: { type: string }, type: { type: string } } }
          /v0/{baseId}/{tableIdOrName}:
            get:
              operationId: listRecords
              summary: >
                Up to 100 records of a table, each with its id and the requested
                fields that are filled in. Airtable leaves empty fields out of a
                record. offset is present when the table has more records.
              security: [{ token: [] }]
              parameters:
                - { name: baseId, in: path, required: true, schema: { type: string, pattern: "^app[A-Za-z0-9]{14}$" } }
                - { name: tableIdOrName, in: path, required: true, schema: { type: string, minLength: 1 } }
                - name: "fields[]"
                  in: query
                  required: true
                  description: The field names to return.
                  schema: { type: array, minItems: 1, items: { type: string } }
                - { name: pageSize, in: query, required: true, schema: { type: integer, enum: [100] } }
              responses:
                "200":
                  description: One page of records.
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          records:
                            type: array
                            items: { type: object, properties: { id: { type: string }, createdTime: { type: string }, fields: { type: object } } }
                          offset: { type: string }
        components:
          securitySchemes:
            token: { type: http, scheme: bearer }
    credential: airtable
    exposes: [getBaseSchema, listRecords]

steps:
  - id: schema
    do:
      calls:
        - { id: schema, operation: getBaseSchema, arguments: { baseId: { var: inputs.base_id } } }
      output:
        # The table named by the input, matched first by name and then by id.
        table:
          if:
            - &by-name { get: [{ get: [{ join: [[{ object: [[key, { var: inputs.table }]] }], { var: responses.schema.tables }, key, name] }, 0] }, right] }
            - { object: [[id, { get: [*by-name, id] }], [name, { get: [*by-name, name] }], [fields, { map: [{ get: [*by-name, fields] }, { var: name }] }]] }
            - &by-id { get: [{ get: [{ join: [[{ object: [[key, { var: inputs.table }]] }], { var: responses.schema.tables }, key, id] }, 0] }, right] }
            - { object: [[id, { get: [*by-id, id] }], [name, { get: [*by-id, name] }], [fields, { map: [{ get: [*by-id, fields] }, { var: name }] }]] }
            - null
    produces:
      type: object
      required: [table]
      properties:
        table:
          oneOf:
            - type: "null"
            - type: object
              required: [id, name, fields]
              additionalProperties: false
              properties:
                id: { type: string, pattern: "^tbl[A-Za-z0-9]{14}$" }
                name: { type: string }
                fields: { type: array, items: { type: string } }
    gates:
      - id: table-exists
        message: The base has no table whose name or id is the table input.
        predicate: { "!=": [{ var: output.table }, null] }
      - id: some-field-exists
        message: The table has none of the requested fields, so there is nothing to audit.
        predicate: { ">": [{ length: { difference: [{ var: inputs.required_fields }, { difference: [{ var: inputs.required_fields }, { var: output.table.fields }] }] } }, 0] }

  - id: records
    do:
      calls:
        - id: records
          operation: listRecords
          arguments:
            baseId: { var: inputs.base_id }
            tableIdOrName: { var: steps.schema.table.id }
            "fields[]": &checked { difference: [{ var: inputs.required_fields }, { difference: [{ var: inputs.required_fields }, { var: steps.schema.table.fields }] }] }
      output:
        checked: *checked
        missing_fields: { difference: [{ var: inputs.required_fields }, { var: steps.schema.table.fields }] }
        # map cannot see checked, so the reduce carries it in its accumulator. Airtable leaves empty fields out.
        records:
          get:
            - reduce:
                - { var: responses.records.records }
                - object:
                    - [checked, { var: accumulator.checked }]
                    - - rows
                      - merge:
                          - { var: accumulator.rows }
                          - [{ object: [[id, { var: current.id }], [empty, { difference: [{ var: accumulator.checked }, { keys: { var: current.fields } }] }]] }]
                - { object: [[checked, *checked], [rows, []]] }
            - rows
        more_records: { "!!": { var: responses.records.offset } }
    produces:
      type: object
      required: [checked, missing_fields, records, more_records]
      properties:
        checked: { type: array, items: { type: string } }
        missing_fields: { type: array, items: { type: string } }
        records:
          type: array
          maxItems: 100
          items:
            type: object
            required: [id, empty]
            additionalProperties: false
            properties:
              id: { type: string, pattern: "^rec[A-Za-z0-9]{14}$" }
              empty: { type: array, items: { type: string } }
        more_records: { type: boolean }

  - id: report
    instructions: |
      The table {{steps.schema.table.name}} ({{steps.schema.table.id}}) was
      checked for these fields: {{steps.records.checked}}.

      Requested fields the table does not have: {{steps.records.missing_fields}}

      Records audited, with the checked fields each leaves empty:

      {{steps.records.records}}

      More records than the 100 audited: {{steps.records.more_records}}

      Submit summary, in Markdown with the sections "## Result" and "##
      Incomplete records". Under Result give the number of records audited
      and how many have an empty field, name any missing field, and say if
      only the first 100 records were audited. Under Incomplete records list
      every record with at least one empty field by its id with its empty
      fields, or say there are none. Mention no record id that was not
      audited.
    produces:
      type: object
      required: [audited, incomplete, summary]
      properties:
        audited: { type: integer, minimum: 0 }
        incomplete: { type: array, items: { type: string } }
        summary: { type: string, maxLength: 20000 }
    derive:
      audited: { length: { var: steps.records.records } }
      incomplete: { map: [{ filter: [{ var: steps.records.records }, { ">": [{ length: { var: empty } }, 0] }] }, { var: id }] }
    let:
      cited: { match_all: [{ var: output.summary }, "rec[A-Za-z0-9]{14}"] }
    gates:
      - id: sections-in-order
        schema:
          properties:
            summary: { pattern: "## Result[\\s\\S]*## Incomplete records" }
      - id: summary-names-incomplete
        message: "The summary must name every incomplete record by its id; these are missing:"
        predicate: { subset: [{ var: output.incomplete }, { var: let.cited }] }
      - id: summary-ids-are-audited
        message: "Every record id in the summary must be one that was audited; these were not:"
        predicate: { subset: [{ var: let.cited }, { map: [{ var: steps.records.records }, { var: id }] }] }
    retries: 2
