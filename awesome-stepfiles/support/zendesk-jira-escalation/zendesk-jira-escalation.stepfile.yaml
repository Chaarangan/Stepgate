# yaml-language-server: $schema=../../../server/schema/stepfile.schema.json
stepgate: "1"
id: zendesk-jira-escalation
title: Escalate Zendesk tickets to Jira as draft issues with internal notes
description: >
  Finds open Zendesk tickets matching an escalation rule (a priority and a tag), searches a Jira
  project for unresolved issues already tracking each problem, decides per ticket to link to one of
  them or create a Jira issue labelled stepgate-draft, and, once a person approves, creates those
  issues and adds an internal note naming the Jira key to every ticket. It never posts a public reply.

inputs:
  type: object
  required: [escalation_tag, priority, max_tickets, jira_project, jira_issue_type]
  additionalProperties: false
  properties:
    escalation_tag: { type: string, pattern: "^[a-z0-9][a-z0-9_:/.-]{0,79}$", description: "Zendesk tag that marks a ticket for escalation, for example escalate_eng" }
    priority: { enum: [urgent, high, normal, low], description: "Zendesk priority the tickets must have" }
    max_tickets: { type: integer, minimum: 1, maximum: 10, description: "Most tickets to handle in one run, oldest first" }
    jira_project: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,9}$", description: "Jira project key to search and create in, for example SUP" }
    jira_issue_type: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9 _-]{0,58}[A-Za-z0-9]$", description: "Issue type name for created issues, for example Bug or Task" }

settings:
  zendesk-subdomain:
    description: Your Zendesk subdomain, the "acme" in acme.zendesk.com.
  jira-site:
    description: Your Atlassian site name, the "acme" in acme.atlassian.net.

credentials:
  zendesk:
    kind: basic
    hosts: ["{zendesk-subdomain}.zendesk.com"]
    description: >
      A Zendesk agent's email and API token in Zendesk's token form, you@example.com/token:API_TOKEN
      (the email, the literal text /token, a colon, then the token). Searches tickets and adds internal
      notes to the tickets it escalates; it never posts a public comment.
  jira:
    kind: basic
    hosts: ["{jira-site}.atlassian.net"]
    description: >
      An Atlassian account email and an API token created without scopes, as you@example.com:API_TOKEN.
      The account needs Browse projects and Create issues in the target project. Searches issues and
      creates issues labelled stepgate-draft.

tools:
  zendesk:
    openapi:
      server: https://{zendesk-subdomain}.zendesk.com/api/v2
      document:
        openapi: 3.1.0
        info: { title: Zendesk Support API (trimmed), version: "2.0" }
        paths:
          /search:
            get:
              operationId: searchZendeskTickets
              summary: >
                Search Zendesk with the Support search syntax. Returns count (all matches) and results,
                oldest first; a ticket result has result_type "ticket", id, subject, status, priority
                and tags.
              parameters:
                - name: query
                  in: query
                  required: true
                  schema: { type: string, minLength: 1, maxLength: 300 }
                - name: sort_by
                  in: query
                  required: true
                  schema: { type: string, enum: [created_at] }
                - name: sort_order
                  in: query
                  required: true
                  schema: { type: string, enum: [asc] }
              responses:
                "200": { description: "count, next_page, previous_page and a results array" }
          /tickets/{ticket_id}:
            put:
              operationId: addZendeskInternalNote
              summary: >
                Add an internal note to one ticket: a comment with public false, which only agents see.
                Returns the updated ticket and the audit of the change.
              parameters:
                - name: ticket_id
                  in: path
                  required: true
                  schema: { type: integer, minimum: 1 }
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required: [ticket]
                      additionalProperties: false
                      properties:
                        ticket:
                          type: object
                          required: [comment]
                          additionalProperties: false
                          properties:
                            comment:
                              type: object
                              required: [body, public]
                              additionalProperties: false
                              properties:
                                body: { type: string, minLength: 1, maxLength: 500 }
                                public: { const: false }
              responses:
                "200": { description: "ticket and audit" }
    credential: zendesk
    exposes: [searchZendeskTickets, addZendeskInternalNote]

  jira-cloud:
    openapi:
      server: https://{jira-site}.atlassian.net/rest/api/3
      document:
        openapi: 3.1.0
        info: { title: Jira Cloud platform REST API v3 (trimmed), version: "3" }
        paths:
          /search/jql:
            post:
              operationId: searchJiraIssues
              summary: >
                Search Jira issues with JQL. Returns issues, each with id, key and fields.summary and
                fields.status.name, plus isLast and nextPageToken.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required: [jql, fields, maxResults]
                      additionalProperties: false
                      properties:
                        jql: { type: string, minLength: 1, maxLength: 500 }
                        fields: { const: [summary, status] }
                        maxResults: { type: integer, minimum: 1, maximum: 10 }
              responses:
                "200": { description: "isLast, nextPageToken and an issues array" }
          /issue:
            post:
              operationId: createJiraIssue
              summary: >
                Create one Jira issue. The description is Atlassian Document Format: one paragraph
                holding one text node. Returns id, key and self of the new issue.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required: [fields]
                      additionalProperties: false
                      properties:
                        fields:
                          type: object
                          required: [project, issuetype, summary, labels, description]
                          additionalProperties: false
                          properties:
                            project:
                              type: object
                              required: [key]
                              additionalProperties: false
                              properties:
                                key: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,9}$" }
                            issuetype:
                              type: object
                              required: [name]
                              additionalProperties: false
                              properties:
                                name: { type: string, minLength: 1, maxLength: 60 }
                            summary: { type: string, minLength: 1, maxLength: 255 }
                            labels: { const: [stepgate-draft] }
                            description:
                              type: object
                              required: [type, version, content]
                              additionalProperties: false
                              properties:
                                type: { const: doc }
                                version: { const: 1 }
                                content:
                                  type: array
                                  minItems: 1
                                  maxItems: 1
                                  items:
                                    type: object
                                    required: [type, content]
                                    additionalProperties: false
                                    properties:
                                      type: { const: paragraph }
                                      content:
                                        type: array
                                        minItems: 1
                                        maxItems: 1
                                        items:
                                          type: object
                                          required: [type, text]
                                          additionalProperties: false
                                          properties:
                                            type: { const: text }
                                            text: { type: string, minLength: 1, maxLength: 2000, pattern: "^[^\\n]*$" }
              responses:
                "201": { description: "id, key and self of the created issue" }
    credential: jira
    # Atlassian documents this POST as a JQL search, sent as POST so a long query fits in the body.
    exposes: [{ name: searchJiraIssues, effect: read }, createJiraIssue]


# An each call's responses come back in the order of its items, so steps pair them by position: the
# reduce numbers a list as { i, value } and join matches the numbers.

steps:
  # The reduce carries the rule and the number of tickets still to take, which a filter body cannot read.
  - id: tickets
    do:
      calls:
        - id: search
          operation: searchZendeskTickets
          arguments: { query: { cat: ["type:ticket status<pending priority:", { var: inputs.priority }, " tags:", { var: inputs.escalation_tag }] } }
      output:
        total_count: { var: responses.search.count }
        tickets:
          get:
            - reduce:
                - { var: responses.search.results }
                - if:
                    - and:
                        - ">": [{ var: accumulator.left }, 0]
                        - "==": [{ var: current.result_type }, ticket]
                        - in: [{ var: current.status }, [new, open]]
                        - "==": [{ var: current.priority }, { var: accumulator.priority }]
                        - in: [{ var: accumulator.tag }, { var: [current.tags, []] }]
                    - object:
                        - [priority, { var: accumulator.priority }]
                        - [tag, { var: accumulator.tag }]
                        - [left, { "-": [{ var: accumulator.left }, 1] }]
                        - - tickets
                          - merge:
                              - { var: accumulator.tickets }
                              - - object: [[id, { var: current.id }], [subject, { var: current.subject }], [status, { var: current.status }], [priority, { var: current.priority }], [tags, { var: current.tags }]]
                    - { var: accumulator }
                - object: [[priority, { var: inputs.priority }], [tag, { var: inputs.escalation_tag }], [left, { var: inputs.max_tickets }], [tickets, []]]
            - tickets
    produces:
      type: object
      required: [tickets, total_count]
      properties:
        tickets:
          type: array
          maxItems: 10
          items:
            type: object
            required: [id, subject, status, priority, tags]
            properties:
              id: { type: integer }
              subject: { type: string }
              status: { enum: [new, open] }
              priority: { type: string }
              tags: { type: array, items: { type: string } }
        total_count: { type: integer, minimum: 0 }

  - id: plan
    tools: [searchJiraIssues]
    instructions: |
      These Zendesk tickets are being escalated to Jira project {{inputs.jira_project}}:

      {{steps.tickets.tickets}}

      For each ticket, look for an unresolved Jira issue that already tracks the same problem, using
      searchJiraIssues with fields ["summary", "status"] and maxResults 10. Every jql must be exactly

      project = "{{inputs.jira_project}}" AND statusCategory != Done AND text ~ "WORDS"

      where WORDS is two to four distinctive words from the ticket subject, with no double quotes or
      backslashes. You may search more than once per ticket with different words.

      Then submit decisions, one per ticket. Choose link, with jira_key set to that issue's key, only
      when a returned issue's summary plainly describes the same problem as the ticket subject.
      Otherwise choose create with jira_key null. Set jql to the jql of the search whose results you
      decided on, and reason to one sentence. If there are no tickets, submit an empty list.

      Stepgate then lists the Jira issues to create and the internal notes to add, and asks a person
      to approve them before anything is written.
    produces:
      type: object
      required: [decisions, jira_project, jira_issue_type, creates, notes]
      properties:
        decisions:
          type: array
          maxItems: 10
          items:
            type: object
            required: [ticket_id, action, jira_key, jql, reason]
            additionalProperties: false
            properties:
              ticket_id: { type: integer }
              action: { enum: [link, create] }
              jira_key: { type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]+-[0-9]+$" }
              jql: { type: string }
              reason: { type: string, minLength: 10, maxLength: 400 }
        jira_project: { type: string }
        jira_issue_type: { type: string }
        creates:
          type: array
          items:
            type: object
            required: [ticket_id, summary, description]
            properties:
              ticket_id: { type: integer }
              summary: { type: string, minLength: 1, maxLength: 255 }
              description: { type: string, minLength: 1, maxLength: 2000, pattern: "^[^\\n]*$" }
        notes:
          type: array
          items:
            type: object
            required: [ticket_id, body]
            properties:
              ticket_id: { type: integer }
              body: { type: string, minLength: 1, maxLength: 500 }
    derive:
      jira_project: { var: inputs.jira_project }
      jira_issue_type: { var: inputs.jira_issue_type }
      creates:
        map:
          - join: [{ filter: [{ var: output.decisions }, { "==": [{ var: action }, create] }] }, { var: steps.tickets.tickets }, ticket_id, id]
          - object:
              - [ticket_id, { var: left.ticket_id }]
              - [summary, { substr: [{ cat: ["[Zendesk #", { var: left.ticket_id }, "] ", { var: right.subject }] }, 0, 255] }]
              - [description, { cat: ["Escalated from Zendesk ticket #", { var: left.ticket_id }, ": ", { var: right.subject }, " (priority ", { var: right.priority }, "). Created by Stepgate as a draft for review."] }]
      notes:
        map:
          - { var: output.decisions }
          - object:
              - [ticket_id, { var: ticket_id }]
              - [body, { if: [{ "==": [{ var: action }, link] }, { cat: ["Stepgate escalation: linked to existing Jira issue ", { var: jira_key }, "."] }, "Stepgate escalation: created draft Jira issue {KEY}."] }]
    let:
      decided: { map: [{ var: output.decisions }, { var: ticket_id }] }
      ticket-ids: { map: [{ var: steps.tickets.tickets }, { var: id }] }
    gates:
      - id: covers-tickets
        message: Submit exactly one decision per ticket from the previous step, each ticket once.
        predicate:
          and:
            - subset: [{ var: let.decided }, { var: let.ticket-ids }]
            - subset: [{ var: let.ticket-ids }, { var: let.decided }]
            - "==": [{ length: { var: let.decided } }, { length: { unique: { var: let.decided } } }]
      - id: jql-bounded
        message: >
          Every searchJiraIssues jql must be exactly
          project = "<jira_project>" AND statusCategory != Done AND text ~ "WORDS", with no quotes or
          backslashes inside WORDS and nothing after the closing quote.
        predicate:
          and:
            - "==":
                - length: &jqlProjects
                    flatten:
                      map:
                        - var: calls
                        - match_all: [{ var: arguments.body.jql }, '^project = "([A-Z][A-Z0-9_]*)" AND statusCategory != Done AND text ~ "[^"\\]+"$']
                - length: { var: calls }
            - subset: [*jqlProjects, [{ var: inputs.jira_project }]]
      - id: decision-jql-searched
        message: "Each decision's jql must be the jql of a successful searchJiraIssues call; these are not:"
        predicate:
          subset:
            - map: [{ var: output.decisions }, { var: jql }]
            - map: [{ filter: [{ var: calls }, { "!": { var: is_error } }] }, { var: arguments.body.jql }]
      # For each call the reduce yields [jql, "jql|KEY-1", "jql|KEY-2", ...], tying each key to the search that returned it.
      - id: link-from-results
        message: "A link's jira_key must be an issue returned by the very search named in that decision's jql; these are not:"
        predicate:
          subset:
            - map:
                - filter: [{ var: output.decisions }, { "==": [{ var: action }, link] }]
                - cat: [{ var: jql }, "|", { var: jira_key }]
            - flatten:
                map:
                  - filter: [{ var: calls }, { "!": { var: is_error } }]
                  - reduce:
                      - var: result.issues
                      - merge: [{ var: accumulator }, [{ cat: [{ var: "accumulator.0" }, "|", { var: current.key }] }]]
                      - [{ var: arguments.body.jql }]
      - id: key-iff-link
        message: jira_key must be set for a link decision and null for a create decision.
        predicate:
          none:
            - var: output.decisions
            - or:
                - and: [{ "==": [{ var: action }, link] }, { "==": [{ var: jira_key }, null] }]
                - and: [{ "==": [{ var: action }, create] }, { "!=": [{ var: jira_key }, null] }]
      - id: approved
        approve:
          message: >
            Write these to Jira and Zendesk? Each entry of creates becomes a Jira issue in jira_project,
            of type jira_issue_type, labelled stepgate-draft, with that summary and description. Each
            entry of notes becomes an internal note (not a public reply) on its Zendesk ticket, with
            {KEY} replaced by the key Jira gives the new issue. Nothing else is changed.
    retries: 2

  - id: create
    do:
      calls:
        - id: issues
          operation: createJiraIssue
          each: { var: steps.plan.creates }
          arguments:
            body:
              fields:
                project: { key: { var: steps.plan.jira_project } }
                issuetype: { name: { var: steps.plan.jira_issue_type } }
                summary: { var: item.summary }
                labels: [stepgate-draft]
                description:
                  type: doc
                  version: 1
                  content: [{ type: paragraph, content: [{ type: text, text: { var: item.description } }] }]
      output:
        created:
          map:
            - join:
                - reduce: [{ var: steps.plan.creates }, { merge: [{ var: accumulator }, [{ object: [[i, { length: { var: accumulator } }], [value, { var: current }]] }]] }, []]
                - reduce: [{ var: responses.issues }, { merge: [{ var: accumulator }, [{ object: [[i, { length: { var: accumulator } }], [value, { var: current }]] }]] }, []]
                - i
                - i
            - object: [[ticket_id, { var: left.value.ticket_id }], [jira_key, { var: right.value.key }]]
    produces:
      type: object
      required: [created]
      properties:
        created:
          type: array
          items:
            type: object
            required: [ticket_id, jira_key]
            properties: { jira_key: { type: string, pattern: "^[A-Z][A-Z0-9_]+-[0-9]+$" } }

  # A link's note is the approved text; a create's is the approved text with the key Jira returned.
  - id: note
    do:
      calls:
        - id: notes
          operation: addZendeskInternalNote
          each:
            map:
              - join: [{ var: steps.plan.notes }, { var: steps.create.created }, ticket_id, ticket_id]
              - object:
                  - [ticket_id, { var: left.ticket_id }]
                  - [body, { if: [{ var: right }, { cat: ["Stepgate escalation: created draft Jira issue ", { var: right.jira_key }, "."] }, { var: left.body }] }]
          arguments: { ticket_id: { var: item.ticket_id }, body: { ticket: { comment: { body: { var: item.body }, public: false } } } }
      output:
        outcomes:
          map:
            - join: [{ var: steps.plan.decisions }, { var: steps.create.created }, ticket_id, ticket_id]
            - object:
                - [ticket_id, { var: left.ticket_id }]
                - [action, { var: left.action }]
                - [jira_key, { if: [{ var: right }, { var: right.jira_key }, { var: left.jira_key }] }]
    produces:
      type: object
      required: [outcomes]
      properties:
        outcomes:
          type: array
          items:
            type: object
            required: [ticket_id, action, jira_key]
            properties:
              ticket_id: { type: integer }
              action: { enum: [link, create] }
              jira_key: { type: string, pattern: "^[A-Z][A-Z0-9_]+-[0-9]+$" }

  - id: report
    instructions: |
      Write the escalation report.

      The search matched {{steps.tickets.total_count}} tickets in all; this run handled these:
      {{steps.tickets.tickets}}

      What was done for each:
      {{steps.note.outcomes}}

      Submit summary: a short Markdown report for a support lead with a table (Zendesk ticket as #ID,
      subject, action, Jira key), a line saying created issues carry the label stepgate-draft and are
      unassigned drafts for review, and a line saying how many matching tickets were left for a later
      run. If no ticket was handled, say so. Write every ticket as #ID and mention no ticket number or
      {{inputs.jira_project}} issue key that is not in the data above.
    produces:
      type: object
      required: [rows, summary]
      properties:
        rows:
          type: array
          items:
            type: object
            required: [ticket_id, subject, action, jira_key]
            properties:
              ticket_id: { type: integer }
              subject: { type: string }
              action: { enum: [link, create] }
              jira_key: { type: string }
        summary: { type: string, minLength: 1, maxLength: 6000 }
    derive:
      rows:
        map:
          - join: [{ var: steps.note.outcomes }, { var: steps.tickets.tickets }, ticket_id, id]
          - object: [[ticket_id, { var: left.ticket_id }], [subject, { var: right.subject }], [action, { var: left.action }], [jira_key, { var: left.jira_key }]]
    let:
      tickets: { map: [{ var: steps.note.outcomes }, { cat: ["#", { var: ticket_id }] }] }
      mentioned: { match_all: [{ var: output.summary }, "#[0-9]+"] }
      keys: { map: [{ var: steps.note.outcomes }, { var: jira_key }] }
      cited-keys: { match_all: [{ var: output.summary }, { cat: ["\\b", { var: inputs.jira_project }, "-[0-9]+\\b"] }] }
    gates:
      - id: summary-mentions-all
        message: >
          The summary must mention every handled ticket as #ID and every Jira key, and no other ticket
          number or issue key in the project.
        predicate:
          and:
            - subset: [{ var: let.tickets }, { var: let.mentioned }]
            - subset: [{ var: let.mentioned }, { var: let.tickets }]
            - subset: [{ var: let.keys }, { var: let.cited-keys }]
            - subset: [{ var: let.cited-keys }, { var: let.keys }]
    retries: 2
