# yaml-language-server: $schema=../../../server/schema/stepfile.schema.json
stepgate: "1"
id: github-release-to-customers
title: Customer release notes from a GitHub release, drafted in Gmail for HubSpot contacts
description: >
  Collects the pull requests merged between two GitHub releases, writes customer-facing release notes
  that cite them by number, finds the HubSpot contacts matching a property filter, and creates a Gmail
  draft to the operator with the notes and the recipient list. Creates a draft; never sends.

inputs:
  type: object
  required: [owner, repo, tag, previous_tag, contact_property, contact_value, operator_email]
  additionalProperties: false
  properties:
    owner: { type: string, pattern: "^[A-Za-z0-9-]{1,39}$", description: GitHub user or organisation }
    repo: { type: string, pattern: "^[A-Za-z0-9._-]{1,100}$", description: Repository name without .git }
    tag: { type: string, minLength: 1, maxLength: 255, description: The release tag to announce, for example v2.100.0 }
    previous_tag: { type: string, minLength: 1, maxLength: 255, description: The tag of the release before it }
    contact_property:
      type: string
      pattern: "^[a-z0-9_]{1,100}$"
      description: Internal name of the HubSpot contact property to filter on, for example lifecyclestage
    contact_value: { type: string, minLength: 1, maxLength: 200, description: The value it must equal, for example customer }
    operator_email: { type: string, format: email, description: Who the prepared email is addressed to }

credentials:
  github:
    kind: bearer
    hosts: [api.github.com]
    description: >
      A GitHub fine-grained personal access token with read-only Contents and Pull requests access to
      the repository (or a classic token; public repositories need no scope). Never writes.
  hubspot:
    kind: bearer
    hosts: [api.hubapi.com]
    description: >
      A HubSpot private app access token with the crm.objects.contacts.read scope. Reads contact ids,
      emails and names. Never writes.
  gmail:
    kind: oauth2
    scopes: ["https://www.googleapis.com/auth/gmail.compose"]
    hosts: [gmail.googleapis.com]
    description: >
      A Google OAuth 2.0 access token with the gmail.compose scope. Creates one draft in the operator's
      mailbox; the stepfile exposes no send operation. Access tokens expire after about an hour.

tools:
  github:
    openapi:
      server: https://api.github.com
      document:
        openapi: 3.1.0
        info: { title: GitHub REST API (trimmed), version: "2026-03-10" }
        components:
          securitySchemes:
            bearerAuth: { type: http, scheme: bearer }
          parameters:
            accept:
              name: Accept
              in: header
              schema: { enum: [application/vnd.github+json] }
            apiVersion:
              name: X-GitHub-Api-Version
              in: header
              schema: { enum: ["2026-03-10"] }
        security: [{ bearerAuth: [] }]
        paths:
          /repos/{owner}/{repo}/releases/tags/{tag}:
            get:
              operationId: getReleaseByTag
              summary: >
                Get a published release by its tag. Returns tag_name, name, html_url and created_at, which
                is the date of the commit the release was made from (UTC, YYYY-MM-DDTHH:MM:SSZ), not when
                it was published. 404 means no published release has that tag.
              parameters:
                - $ref: "#/components/parameters/accept"
                - $ref: "#/components/parameters/apiVersion"
                - { name: owner, in: path, required: true, schema: { type: string } }
                - { name: repo, in: path, required: true, schema: { type: string } }
                - { name: tag, in: path, required: true, schema: { type: string } }
              responses:
                "200": { description: The release }
          /search/issues:
            get:
              operationId: searchPullRequests
              summary: >
                Search pull requests. total_count is the number of matches and items holds one page;
                GitHub returns at most 1,000 results a search.
              parameters:
                - $ref: "#/components/parameters/accept"
                - $ref: "#/components/parameters/apiVersion"
                - { name: q, in: query, required: true, schema: { type: string } }
                - { name: per_page, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 100 } }
                - { name: page, in: query, required: true, schema: { type: integer, minimum: 1 } }
              responses:
                "200": { description: "total_count, incomplete_results and items" }
    credential: github
    exposes: [getReleaseByTag, searchPullRequests]

  hubspot:
    openapi:
      server: https://api.hubapi.com
      document:
        openapi: 3.1.0
        info: { title: HubSpot CRM objects API, contacts search (trimmed), version: "2026-09" }
        components:
          securitySchemes:
            bearerAuth: { type: http, scheme: bearer }
        security: [{ bearerAuth: [] }]
        paths:
          /crm/objects/2026-09/{objectType}/search:
            post:
              operationId: searchContacts
              summary: >
                Search HubSpot contacts with one filter. Returns total (all matches), results (id and
                the requested properties per contact) and, when more pages exist, paging.next.after.
              parameters:
                - name: objectType
                  in: path
                  required: true
                  schema: { enum: [contacts] }
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required: [filterGroups, properties, limit]
                      additionalProperties: false
                      properties:
                        filterGroups:
                          type: array
                          minItems: 1
                          maxItems: 1
                          items:
                            type: object
                            required: [filters]
                            additionalProperties: false
                            properties:
                              filters:
                                type: array
                                minItems: 1
                                maxItems: 1
                                items:
                                  type: object
                                  required: [propertyName, operator, value]
                                  additionalProperties: false
                                  properties:
                                    propertyName: { type: string }
                                    operator: { enum: [EQ] }
                                    value: { type: string }
                        properties:
                          type: array
                          items: { enum: [email, firstname, lastname] }
                        limit: { type: integer, minimum: 1, maximum: 200 }
                        after: { type: string, description: paging.next.after from the previous page }
              responses:
                "200": { description: "total, results and paging" }
    credential: hubspot
    # HubSpot documents search as retrieving records only; it is a POST so filters fit in a body.
    exposes: [{ name: searchContacts, effect: read }]

  gmail:
    openapi:
      server: https://gmail.googleapis.com
      document:
        openapi: 3.1.0
        info: { title: Gmail API v1 (trimmed to the drafts.create media upload), version: v1 }
        components:
          securitySchemes:
            google:
              type: oauth2
              flows:
                authorizationCode:
                  authorizationUrl: https://accounts.google.com/o/oauth2/auth
                  tokenUrl: https://oauth2.googleapis.com/token
                  scopes: { "https://www.googleapis.com/auth/gmail.compose": Manage drafts and send emails }
        security: [{ google: ["https://www.googleapis.com/auth/gmail.compose"] }]
        paths:
          /upload/gmail/v1/users/me/drafts:
            post:
              operationId: createDraft
              summary: >
                Create a Gmail draft (never sent) from a raw RFC 2822 message, given as body in plain text
                with CRLF line endings. Returns the Draft: id (the draft id) and message.id.
              parameters:
                - { name: uploadType, in: query, required: true, schema: { enum: [media] } }
              requestBody:
                required: true
                content:
                  message/rfc822:
                    schema: { type: string }
              responses:
                "200": { description: "The Draft: id and message (id, threadId, labelIds)" }
    credential: gmail
    exposes: [createDraft]


steps:
  - id: releases
    do:
      calls:
        - id: release
          operation: getReleaseByTag
          arguments: { owner: { var: inputs.owner }, repo: { var: inputs.repo }, tag: { var: inputs.tag } }
        - id: previous
          operation: getReleaseByTag
          arguments: { owner: { var: inputs.owner }, repo: { var: inputs.repo }, tag: { var: inputs.previous_tag } }
      # GitHub records a merge about a second after its merge commit, so the window runs from the previous
      # release's created_at plus 2 seconds to this one's plus 1: this release's own pull request is in, the last one's out.
      output:
        name: { var: responses.release.name }
        html_url: { var: responses.release.html_url }
        created_at: { var: responses.release.created_at }
        previous_created_at: { var: responses.previous.created_at }
        window_start:
          time_add: [{ var: responses.previous.created_at }, 2]
        window_end:
          time_add: [{ var: responses.release.created_at }, 1]
    produces:
      type: object
      required: [name, html_url, created_at, previous_created_at, window_start, window_end]
      additionalProperties: false
      properties:
        name: { type: [string, "null"] }
        html_url: { type: string }
        created_at: { $ref: "#/$defs/utc" }
        previous_created_at: { $ref: "#/$defs/utc" }
        window_start: { $ref: "#/$defs/utc" }
        window_end: { $ref: "#/$defs/utc" }
    gates:
      - id: previous-is-older
        message: The previous release must have been made from an older commit than the announced one.
        predicate:
          ">": [{ time_diff: [{ var: output.created_at }, { var: output.previous_created_at }] }, 0]

  - id: pulls
    do:
      calls:
        - id: first
          operation: searchPullRequests
          arguments:
            q: &query { cat: ["repo:", { var: inputs.owner }, "/", { var: inputs.repo }, " is:pr is:merged merged:", { var: steps.releases.window_start }, "..", { var: steps.releases.window_end }] }
            per_page: 100
            page: 1
        # Pages 2 to 10 as total_count needs them; the reduce carries total_count beside the pages kept.
        - id: rest
          operation: searchPullRequests
          each:
            get:
              - reduce:
                  - [2, 3, 4, 5, 6, 7, 8, 9, 10]
                  - if:
                      - "<": [{ "*": [{ "-": [{ var: current }, 1] }, 100] }, { var: accumulator.0 }]
                      - [{ var: accumulator.0 }, { merge: [{ var: accumulator.1 }, [{ var: current }]] }]
                      - { var: accumulator }
                  - [{ var: responses.first.total_count }, []]
              - 1
          arguments: { q: *query, per_page: 100, page: { var: item } }
      output:
        pulls:
          map:
            - merge: [{ var: responses.first.items }, { flatten: { map: [{ var: responses.rest }, { var: items }] } }]
            - object: [[number, { var: number }], [title, { var: title }], [merged_at, { var: pull_request.merged_at }]]
    produces:
      type: object
      required: [pulls]
      additionalProperties: false
      properties:
        pulls:
          type: array
          items:
            type: object
            required: [number, title, merged_at]
            additionalProperties: false
            properties:
              number: { type: integer, minimum: 1 }
              title: { type: string }
              merged_at: { $ref: "#/$defs/utc" }
    gates:
      - id: pulls-complete
        message: >
          The search must return every pull request it matched: GitHub returns at most 1,000, and must not
          report incomplete_results.
        predicate:
          and:
            - "==": [{ length: { var: output.pulls } }, { var: calls.0.result.total_count }]
            - none: [{ var: calls }, { var: result.incomplete_results }]

  - id: notes
    instructions: |
      Release {{inputs.tag}} of {{inputs.owner}}/{{inputs.repo}} ({{steps.releases.html_url}}) contains
      these merged pull requests:

      {{steps.pulls.pulls}}

      Sort every pull request into exactly one list:
      - items: changes a customer would notice (features, fixes, behaviour changes), each with number
        and customer_text: one plain sentence for customers, without internal jargon;
      - excluded: internal work such as dependency bumps, CI, tests and refactoring, with number and a
        short reason.

      Then write notes_markdown: customer-facing release notes for {{inputs.tag}} in Markdown, one bullet
      per item that ends with its pull request as (#number). Mention the tag. Do not cite excluded pull
      requests or any number not in items.
    produces:
      type: object
      required: [items, excluded, notes_markdown]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required: [number, customer_text]
            additionalProperties: false
            properties:
              number: { type: integer }
              customer_text: { type: string, minLength: 1, maxLength: 400 }
        excluded:
          type: array
          items:
            type: object
            required: [number, reason]
            additionalProperties: false
            properties:
              number: { type: integer }
              reason: { type: string, maxLength: 200 }
        notes_markdown: { type: string, minLength: 1, maxLength: 12000 }
    let:
      sorted: { merge: [{ map: [{ var: output.items }, { var: number }] }, { map: [{ var: output.excluded }, { var: number }] }] }
      items: { map: [{ var: output.items }, { cat: [{ var: number }] }] }
      cited: { match_all: [{ var: output.notes_markdown }, "#([0-9]+)"] }
    gates:
      - id: every-pull-sorted-once
        message: Every pull request must appear exactly once, in items or in excluded, and no other number may.
        predicate:
          and:
            - "==": [{ length: { var: let.sorted } }, { length: { var: steps.pulls.pulls } }]
            - subset: [{ map: [{ var: steps.pulls.pulls }, { var: number }] }, { var: let.sorted }]
      - id: notes-name-the-tag
        message: notes_markdown must mention the tag.
        predicate: { in: [{ var: inputs.tag }, { var: output.notes_markdown }] }
      - id: notes-cite-items
        message: notes_markdown must cite every item as #number and no other pull request number.
        predicate:
          and:
            - subset: [{ var: let.items }, { var: let.cited }]
            - subset: [{ var: let.cited }, { var: let.items }]
    retries: 2

  - id: audience
    do:
      calls:
        - id: search
          operation: searchContacts
          arguments:
            body:
              filterGroups: [{ filters: [{ propertyName: { var: inputs.contact_property }, operator: EQ, value: { var: inputs.contact_value } }] }]
              properties: [email, firstname, lastname]
              limit: 200
      output:
        contacts:
          map:
            - filter: [{ var: responses.search.results }, { var: properties.email }]
            - object: [[id, { var: id }], [email, { var: properties.email }], [firstname, { var: [properties.firstname, null] }], [lastname, { var: [properties.lastname, null] }]]
        without_email: { map: [{ filter: [{ var: responses.search.results }, { "!": { var: properties.email } }] }, { var: id }] }
    produces:
      type: object
      required: [contacts, without_email]
      additionalProperties: false
      properties:
        contacts:
          type: array
          items:
            type: object
            required: [id, email, firstname, lastname]
            additionalProperties: false
            properties:
              id: { type: string }
              email: { type: string }
              firstname: { type: [string, "null"] }
              lastname: { type: [string, "null"] }
        without_email: { type: array, items: { type: string } }
    gates:
      - id: every-contact-fetched
        message: >
          The search must return every contact it matched; HubSpot returns at most 200 a page, so narrow the
          filter if more match.
        predicate:
          "==": [{ length: { var: calls.0.result.results } }, { var: calls.0.result.total }]

  - id: email
    instructions: |
      Write the announcement email for release {{inputs.tag}}. It will be saved as a Gmail draft addressed
      to the operator, {{inputs.operator_email}}, who reviews it and sends it to customers; nothing is sent.

      Customer-facing release notes:
      {{steps.notes.notes_markdown}}

      Contacts to reach:
      {{steps.audience.contacts}}

      Submit:
      - subject: a short subject on one line that names {{inputs.tag}};
      - body: plain text with a one-line note to the operator, the release notes (keep every (#number)
        citation), and then a "Recipients" section listing every contact's email address, one per line.
        Cite no pull request number that is not in the release notes.
    produces:
      type: object
      required: [to, subject, recipients, body, raw]
      additionalProperties: false
      properties:
        to: { type: string }
        subject: { type: string, minLength: 1, maxLength: 200, pattern: "^[^\\r\\n]+$" }
        recipients: { type: array, maxItems: 200, items: { type: string } }
        body: { type: string, minLength: 1, maxLength: 30000 }
        raw: { type: string }
    derive:
      to: { var: inputs.operator_email }
      recipients: { unique: { map: [{ var: steps.audience.contacts }, { lower: { var: email } }] } }
      # Five fixed headers, an empty line, then every body line ending in CRLF.
      raw:
        reduce:
          - match_all: [{ var: output.body }, "([^\\r\\n]*)\\r?\\n|[^\\r\\n]+$"]
          - cat: [{ var: accumulator }, { var: current }, "\r\n"]
          - cat:
              - "To: "
              - { var: inputs.operator_email }
              - "\r\nSubject: "
              - { var: output.subject }
              - "\r\nMIME-Version: 1.0\r\nContent-Type: text/plain; charset=UTF-8\r\nContent-Transfer-Encoding: 8bit\r\n\r\n"
    let:
      items: { map: [{ var: steps.notes.items }, { cat: [{ var: number }] }] }
      cited: { match_all: [{ var: output.body }, "#([0-9]+)"] }
      listed: { map: [{ match_all: [{ var: output.body }, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]*[A-Za-z0-9]"] }, { lower: { var: "" } }] }
    gates:
      - id: email-names-the-tag
        message: subject and body must both name the tag.
        predicate:
          and:
            - in: [{ var: inputs.tag }, { var: output.subject }]
            - in: [{ var: inputs.tag }, { var: output.body }]
      - id: body-cites-the-notes
        message: body must cite every release-note item as #number and no other pull request number.
        predicate:
          and:
            - subset: [{ var: let.items }, { var: let.cited }]
            - subset: [{ var: let.cited }, { var: let.items }]
      - id: body-lists-recipients
        message: "body must list every recipient's email address; these are missing:"
        predicate:
          subset: [{ var: output.recipients }, { var: let.listed }]
      - id: approved
        approve:
          message: >
            Create this Gmail draft in your mailbox? raw is the exact message: addressed to you only, with
            the subject and body shown, and the customer addresses listed in the body. Nothing is sent.

  - id: draft
    do:
      calls:
        - { id: draft, operation: createDraft, arguments: { body: { var: steps.email.raw } } }
      output:
        draft_id: { var: responses.draft.id }
        message_id: { var: responses.draft.message.id }
    produces:
      type: object
      required: [draft_id, message_id]
      additionalProperties: false
      properties:
        draft_id: { type: string, minLength: 1 }
        message_id: { type: string, minLength: 1 }

$defs:
  utc: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$" }
