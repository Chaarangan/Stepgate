# yaml-language-server: $schema=../../../server/schema/stepfile.schema.json
stepgate: "1"
id: drug-shortage-watch
title: Formulary check against the FDA drug shortage list
description: >
  Checks each generic drug on a formulary against the current openFDA drug
  shortage list and returns an action list in which every status and NDC comes
  from an FDA record.

inputs:
  type: object
  required: [formulary]
  properties:
    formulary:
      type: array
      minItems: 1
      maxItems: 20
      uniqueItems: true
      items: { type: string, pattern: "^[A-Za-z][A-Za-z0-9 .-]{1,79}$" }

tools:
  # One path, two uses, so two tools: a count parameter with one allowed value is sent on every call.
  openfda-counts:
    openapi:
      server: https://api.fda.gov
      document:
        openapi: 3.1.0
        info: { title: openFDA drug shortage counts (trimmed), version: "1" }
        paths:
          /drug/shortages.json:
            get:
              operationId: countShortagesByStatus
              summary: Count FDA drug shortage records per status. Returns 404 with error code NOT_FOUND when nothing matches.
              parameters:
                - { name: search, in: query, required: true, description: 'Lucene-style query, for example generic_name:"lidocaine"', schema: { type: string, minLength: 1, maxLength: 200 } }
                - { name: count, in: query, required: true, schema: { const: status } }
              responses:
                "200": { description: Record counts per shortage status }
                "404": { description: No matching records }
    exposes: [countShortagesByStatus]
  openfda:
    openapi:
      server: https://api.fda.gov
      document:
        openapi: 3.1.0
        info: { title: openFDA drug shortages (trimmed), version: "1" }
        paths:
          /drug/shortages.json:
            get:
              operationId: searchDrugShortages
              summary: Search FDA drug shortage records.
              parameters:
                - name: search
                  in: query
                  required: true
                  description: >
                    Lucene-style query, for example generic_name:"sodium
                    chloride" AND status:"Current". Join clauses with a
                    literal " AND " (spaces), never "+AND+".
                  schema: { type: string, minLength: 1, maxLength: 200 }
                - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 3 } }
              responses:
                "200": { description: Matching records }
    exposes: [searchDrugShortages]

# An each call's responses come back in the order of its items, so steps pair them by position: the
# reduce numbers a list as { i, value } and join matches the numbers.

steps:
  - id: status
    do:
      calls:
        # openFDA answers 404 NOT_FOUND when a drug has no shortage record.
        - id: status
          operation: countShortagesByStatus
          each: { var: inputs.formulary }
          arguments: { search: { cat: ["generic_name:\"", { var: item }, "\""] } }
          accept: [404]
      output:
        data_last_updated: { get: [{ filter: [{ map: [{ var: responses.status }, { var: meta.last_updated }] }, { var: "" }] }, 0] }
        items:
          map:
            - join:
                - reduce: [{ var: inputs.formulary }, { merge: [{ var: accumulator }, [{ object: [[i, { length: { var: accumulator } }], [value, { var: current }]] }]] }, []]
                - reduce: [{ var: responses.status }, { merge: [{ var: accumulator }, [{ object: [[i, { length: { var: accumulator } }], [value, { var: current }]] }]] }, []]
                - i
                - i
            - object:
                - [formulary_item, { var: left.value }]
                - [search, { cat: ["generic_name:\"", { var: left.value }, "\""] }]
                - [status_counts, { map: [{ var: right.value.results }, { object: [[term, { var: term }], [count, { var: count }]] }] }]
                - - worst_status
                  - if:
                      - some: [{ var: right.value.results }, { "==": [{ var: term }, Current] }]
                      - Current
                      - some: [{ var: right.value.results }, { "==": [{ var: term }, To Be Discontinued] }]
                      - To Be Discontinued
                      - ">": [{ length: { var: right.value.results } }, 0]
                      - Resolved
                      - null
    produces:
      type: object
      required: [items, data_last_updated]
      properties:
        data_last_updated: { type: [string, "null"] }
        items:
          type: array
          items:
            type: object
            required: [formulary_item, search, status_counts, worst_status]
            properties:
              formulary_item: { type: string }
              search: { type: string }
              status_counts:
                type: array
                items:
                  type: object
                  required: [term, count]
                  properties:
                    term: { type: string }
                    count: { type: integer }
              worst_status: { enum: [Current, To Be Discontinued, Resolved, null] }

  - id: records
    do:
      calls:
        - id: records
          operation: searchDrugShortages
          each: { filter: [{ var: steps.status.items }, { var: worst_status }] }
          arguments: { search: { cat: [{ var: item.search }, " AND status:\"", { var: item.worst_status }, "\""] }, limit: 3 }
      output:
        items:
          map:
            - join:
                - reduce: [{ filter: [{ var: steps.status.items }, { var: worst_status }] }, { merge: [{ var: accumulator }, [{ object: [[i, { length: { var: accumulator } }], [value, { var: current }]] }]] }, []]
                - reduce: [{ var: responses.records }, { merge: [{ var: accumulator }, [{ object: [[i, { length: { var: accumulator } }], [value, { var: current }]] }]] }, []]
                - i
                - i
            - object:
                - [formulary_item, { var: left.value.formulary_item }]
                - [worst_status, { var: left.value.worst_status }]
                - [total, { var: right.value.meta.results.total }]
                - - records
                  - map:
                      - { var: right.value.results }
                      - object:
                          - [package_ndc, { var: [package_ndc, null] }]
                          - [generic_name, { var: [generic_name, null] }]
                          - [company_name, { var: [company_name, null] }]
                          - [status, { var: [status, null] }]
                          - [update_date, { var: [update_date, null] }]
    produces:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [formulary_item, worst_status, total, records]
            properties:
              formulary_item: { type: string }
              worst_status: { enum: [Current, To Be Discontinued, Resolved] }
              total: { type: integer, minimum: 1 }
              records:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [package_ndc, generic_name, company_name, status, update_date]
                  properties:
                    package_ndc: { type: [string, "null"] }
                    generic_name: { type: [string, "null"] }
                    company_name: { type: [string, "null"] }
                    status: { type: [string, "null"] }
                    update_date: { type: [string, "null"] }
    gates:
      - id: records-have-worst-status
        message: Every record openFDA returned for an item must have that item's worst status.
        predicate:
          all:
            - { var: output.items }
            - subset: [{ map: [{ var: records }, { var: status }] }, [{ var: worst_status }]]

  - id: report
    instructions: |
      Formulary: {{inputs.formulary}}

      Shortage status per item (openFDA data last updated {{steps.status.data_last_updated}}):
      {{steps.status.items}}

      Shortage records per affected item:
      {{steps.records.items}}

      Each item's status is its worst_status, or "Not listed" where that is null.

      Write summary_markdown for a pharmacy buyer: one line per item whose
      status is Current or To Be Discontinued, starting "- **<item>**" with the
      item exactly as given, then the status, the affected NDCs and the
      recommended action (find an alternative for Current, plan a replacement
      for To Be Discontinued). Then one line listing the Resolved and Not listed
      items without bold. Bold nothing else. Cite only NDCs from the records.
    produces:
      type: object
      required: [actions, summary_markdown]
      properties:
        actions:
          type: array
          items:
            type: object
            required: [formulary_item, status, package_ndcs]
            properties:
              formulary_item: { type: string }
              status: { enum: [Current, To Be Discontinued, Resolved, Not listed] }
              package_ndcs: { type: array, items: { type: [string, "null"] } }
        summary_markdown: { type: string, minLength: 1, maxLength: 6000 }
    derive:
      actions:
        map:
          - join: [{ var: steps.status.items }, { var: steps.records.items }, formulary_item, formulary_item]
          - object:
              - [formulary_item, { var: left.formulary_item }]
              - [status, { if: [{ var: right }, { var: right.worst_status }, Not listed] }]
              - [package_ndcs, { if: [{ var: right }, { map: [{ var: right.records }, { var: package_ndc }] }, []] }]
    let:
      bolded: { match_all: [{ var: output.summary_markdown }, "\\*\\*([^*]+)\\*\\*"] }
      flagged:
        map:
          - filter: [{ var: steps.records.items }, { in: [{ var: worst_status }, [Current, To Be Discontinued]] }]
          - { var: formulary_item }
    gates:
      - id: flagged-items-in-summary
        message: The summary must bold exactly the items with status Current or To Be Discontinued, and nothing else.
        predicate:
          and:
            - subset: [{ var: let.bolded }, { var: let.flagged }]
            - subset: [{ var: let.flagged }, { var: let.bolded }]
      - id: summary-ndcs-from-records
        message: "Every NDC in the summary must be a package_ndc from the records step; these are not:"
        predicate:
          subset:
            - { match_all: [{ var: output.summary_markdown }, "\\b(\\d{4,5}-\\d{3,4}-\\d{1,2})\\b"] }
            - flatten:
                map:
                  - { var: steps.records.items }
                  - { map: [{ var: records }, { var: package_ndc }] }
    retries: 2
