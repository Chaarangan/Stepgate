# yaml-language-server: $schema=../../../server/schema/stepfile.schema.json
stepgate: "1"
id: hubspot-deal-to-monday
title: Draft a monday.com kickoff group from a closed-won HubSpot deal
description: >
  Reads a HubSpot deal, refuses it unless its stage is closed won, reads its
  line items, contacts and companies, plans one monday.com item per line item,
  and, once a person approves the plan, creates them as drafts in a new
  "Stepgate draft" group on a given board, each with an update carrying the
  deal, company and contact details.

inputs:
  type: object
  required: [deal_id, board_id]
  properties:
    deal_id: { type: string, pattern: "^[0-9]{1,20}$", description: "HubSpot deal record id, for example 21678228008" }
    board_id: { type: string, pattern: "^[0-9]{1,20}$", description: "monday.com board id to create the draft group in, from the board URL" }

credentials:
  hubspot:
    kind: bearer
    hosts: [api.hubapi.com]
    description: >
      A HubSpot private app access token with the read scopes
      crm.objects.deals.read, crm.objects.line_items.read,
      crm.objects.contacts.read and crm.objects.companies.read. Reads only.
  monday:
    kind: api_key
    hosts: [api.monday.com]
    description: >
      A monday.com personal API token of a user who can edit the target board.
      Sent as the Authorization header without a Bearer prefix. Used only for
      create_group, create_item and create_update.

tools:
  hubspot:
    openapi:
      server: https://api.hubapi.com
      document:
        openapi: 3.1.0
        info: { title: HubSpot CRM API (trimmed to deal reads), version: "1" }
        components:
          securitySchemes:
            privateApp: { type: http, scheme: bearer }
          schemas:
            BatchInputs:
              type: array
              minItems: 1
              maxItems: 100
              items:
                type: object
                required: [id]
                additionalProperties: false
                properties: { id: { type: string, pattern: "^[0-9]{1,20}$" } }
        security: [{ privateApp: [] }]
        paths:
          /crm/v3/objects/deals/{dealId}:
            get:
              operationId: getDeal
              summary: >
                Read one deal by record id. Returns id and properties (dealname,
                dealstage, pipeline, amount, closedate, deal_currency_code), all as
                strings or null.
              parameters:
                - { name: dealId, in: path, required: true, schema: { type: string, pattern: "^[0-9]{1,20}$" } }
                - { name: properties, in: query, schema: { type: string, enum: ["dealname,dealstage,pipeline,amount,closedate,deal_currency_code"] } }
          /crm/v3/pipelines/deals/{pipelineId}/stages/{stageId}:
            get:
              operationId: getDealStage
              summary: >
                Read one deal pipeline stage. Returns id, label and metadata, whose
                probability ("1.0" is closed won, "0.0" closed lost) and isClosed
                are strings.
              parameters:
                - { name: pipelineId, in: path, required: true, schema: { type: string, minLength: 1 } }
                - { name: stageId, in: path, required: true, schema: { type: string, minLength: 1 } }
          /crm/v4/objects/deals/{dealId}/associations/{toObjectType}:
            get:
              operationId: listDealAssociations
              summary: >
                List the records of one type associated with a deal, up to 500.
                Each entry of results has toObjectId (the associated record id) and
                associationTypes.
              parameters:
                - { name: dealId, in: path, required: true, schema: { type: string, pattern: "^[0-9]{1,20}$" } }
                - { name: toObjectType, in: path, required: true, schema: { type: string, enum: [line_items, contacts, companies] } }
          /crm/v3/objects/line_items/batch/read:
            post:
              operationId: readLineItems
              summary: Read up to 100 line items by id. Returns results, each with id and properties.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required: [inputs, properties, propertiesWithHistory]
                      additionalProperties: false
                      properties:
                        inputs: { $ref: "#/components/schemas/BatchInputs" }
                        properties: { const: [name, quantity, price, amount, hs_sku] }
                        propertiesWithHistory: { type: array, maxItems: 0 }
          /crm/v3/objects/contacts/batch/read:
            post:
              operationId: readContacts
              summary: Read up to 100 contacts by id. Returns results, each with id and properties.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required: [inputs, properties, propertiesWithHistory]
                      additionalProperties: false
                      properties:
                        inputs: { $ref: "#/components/schemas/BatchInputs" }
                        properties: { const: [firstname, lastname, email, phone, jobtitle] }
                        propertiesWithHistory: { type: array, maxItems: 0 }
          /crm/v3/objects/companies/batch/read:
            post:
              operationId: readCompanies
              summary: Read up to 100 companies by id. Returns results, each with id and properties.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required: [inputs, properties, propertiesWithHistory]
                      additionalProperties: false
                      properties:
                        inputs: { $ref: "#/components/schemas/BatchInputs" }
                        properties: { const: [name, domain] }
                        propertiesWithHistory: { type: array, maxItems: 0 }
    credential: hubspot
    # HubSpot documents the batch reads, sent as POST, as retrieving records by id.
    exposes:
      - getDeal
      - getDealStage
      - listDealAssociations
      - { name: readLineItems, effect: read }
      - { name: readContacts, effect: read }
      - { name: readCompanies, effect: read }

  monday-graphql:
    openapi:
      server: https://api.monday.com
      document:
        openapi: 3.1.0
        info: { title: monday.com GraphQL API (trimmed to three draft mutations), version: "1" }
        components:
          securitySchemes:
            personalToken: { type: apiKey, in: header, name: Authorization }
        security: [{ personalToken: [] }]
        paths:
          /v2:
            post:
              operationId: mondayGraphql
              summary: >
                Run one of three fixed monday.com mutations with variables.
                create_group takes board and name and returns data.create_group.id.
                create_item takes board, group and name and returns data.create_item.id.
                create_update takes item and body and returns data.create_update.id.
                Application errors come back with HTTP 200 and an errors array.
              parameters:
                - { name: API-Version, in: header, required: true, schema: { type: string, enum: ["2026-07"] } }
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required: [query, variables]
                      additionalProperties: false
                      properties:
                        query:
                          enum:
                            - &create-group "mutation CreateDraftGroup($board: ID!, $name: String!) { create_group(board_id: $board, group_name: $name) { id title } }"
                            - &create-item "mutation CreateDraftItem($board: ID!, $group: String!, $name: String!) { create_item(board_id: $board, group_id: $group, item_name: $name) { id name } }"
                            - &create-update "mutation CreateItemUpdate($item: ID!, $body: String!) { create_update(item_id: $item, body: $body) { id } }"
                        variables:
                          type: object
                          additionalProperties: false
                          properties:
                            board: { type: string, pattern: "^[0-9]{1,20}$" }
                            group: { type: string, minLength: 1 }
                            item: { type: string, pattern: "^[0-9]{1,20}$" }
                            name: { type: string, minLength: 1, maxLength: 255 }
                            body: { type: string, minLength: 1 }
    credential: monday
    exposes: [mondayGraphql]

# An each call's responses come back in the order of its items, so steps pair them by position: the
# reduce numbers a list as { i, value } and join matches the numbers.

steps:
  - id: deal
    do:
      calls:
        - { id: deal, operation: getDeal, arguments: { dealId: { var: inputs.deal_id } } }
        - id: stage
          operation: getDealStage
          arguments: { pipelineId: { var: responses.deal.properties.pipeline }, stageId: { var: responses.deal.properties.dealstage } }
      output:
        deal_id: { var: responses.deal.id }
        dealname: { var: responses.deal.properties.dealname }
        amount: { var: responses.deal.properties.amount }
        closedate: { var: responses.deal.properties.closedate }
        currency: { var: responses.deal.properties.deal_currency_code }
        stage_label: { var: responses.stage.label }
        stage_probability: { var: responses.stage.metadata.probability }
        stage_is_closed: { var: responses.stage.metadata.isClosed }
    produces:
      type: object
      required: [deal_id, dealname, amount, closedate, currency, stage_label, stage_probability, stage_is_closed]
      properties:
        deal_id: { type: string }
        dealname: { type: [string, "null"] }
        amount: { type: [string, "null"] }
        closedate: { type: [string, "null"] }
        currency: { type: [string, "null"] }
        stage_label: { type: string }
        stage_probability: { type: [string, "null"] }
        stage_is_closed: { type: [string, "null"] }
    gates:
      - id: deal-is-closed-won
        message: >
          Refused: this deal's stage is not closed won (its probability is not
          1.0, or HubSpot marks it not closed). Nothing was read or written after it.
        predicate:
          and:
            - in: [{ var: output.stage_probability }, ["1.0", "1"]]
            - "!=": [{ var: output.stage_is_closed }, "false"]

  # A record the batch read did not return has no id, which breaks produces and stops the run.
  - id: records
    do:
      calls:
        - { id: line-item-ids, operation: listDealAssociations, arguments: { dealId: { var: inputs.deal_id }, toObjectType: line_items } }
        - { id: contact-ids, operation: listDealAssociations, arguments: { dealId: { var: inputs.deal_id }, toObjectType: contacts } }
        - { id: company-ids, operation: listDealAssociations, arguments: { dealId: { var: inputs.deal_id }, toObjectType: companies } }
        # Each read runs once, or not at all when nothing is associated, since a batch read needs one id.
        - id: line-items
          operation: readLineItems
          each: { if: [{ var: responses.line-item-ids.results.0 }, [{ map: [{ var: responses.line-item-ids.results }, { object: [[id, { cat: ["", { var: toObjectId }] }]] }] }], []] }
          arguments: { body: { inputs: { var: item }, properties: [name, quantity, price, amount, hs_sku], propertiesWithHistory: [] } }
        - id: contacts
          operation: readContacts
          each: { if: [{ var: responses.contact-ids.results.0 }, [{ map: [{ var: responses.contact-ids.results }, { object: [[id, { cat: ["", { var: toObjectId }] }]] }] }], []] }
          arguments: { body: { inputs: { var: item }, properties: [firstname, lastname, email, phone, jobtitle], propertiesWithHistory: [] } }
        - id: companies
          operation: readCompanies
          each: { if: [{ var: responses.company-ids.results.0 }, [{ map: [{ var: responses.company-ids.results }, { object: [[id, { cat: ["", { var: toObjectId }] }]] }] }], []] }
          arguments: { body: { inputs: { var: item }, properties: [name, domain], propertiesWithHistory: [] } }
      output:
        line_items:
          map:
            - join: [{ map: [{ var: responses.line-item-ids.results }, { object: [[id, { cat: ["", { var: toObjectId }] }]] }] }, { flatten: { map: [{ var: responses.line-items }, { var: results }] } }, id, id]
            - object:
                - [id, { var: right.id }]
                - [name, { var: [right.properties.name, null] }]
                - [quantity, { var: [right.properties.quantity, null] }]
                - [price, { var: [right.properties.price, null] }]
                - [amount, { var: [right.properties.amount, null] }]
                - [sku, { var: [right.properties.hs_sku, null] }]
        contacts:
          map:
            - join: [{ map: [{ var: responses.contact-ids.results }, { object: [[id, { cat: ["", { var: toObjectId }] }]] }] }, { flatten: { map: [{ var: responses.contacts }, { var: results }] } }, id, id]
            - object:
                - [id, { var: right.id }]
                - [firstname, { var: [right.properties.firstname, null] }]
                - [lastname, { var: [right.properties.lastname, null] }]
                - [email, { var: [right.properties.email, null] }]
                - [phone, { var: [right.properties.phone, null] }]
                - [jobtitle, { var: [right.properties.jobtitle, null] }]
        companies:
          map:
            - join: [{ map: [{ var: responses.company-ids.results }, { object: [[id, { cat: ["", { var: toObjectId }] }]] }] }, { flatten: { map: [{ var: responses.companies }, { var: results }] } }, id, id]
            - object:
                - [id, { var: right.id }]
                - [name, { var: [right.properties.name, null] }]
                - [domain, { var: [right.properties.domain, null] }]
    produces:
      type: object
      required: [line_items, contacts, companies]
      properties:
        line_items:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, name, quantity, price, amount, sku]
            properties:
              id: { type: string }
              name: { type: [string, "null"] }
              quantity: { type: [string, "null"] }
              price: { type: [string, "null"] }
              amount: { type: [string, "null"] }
              sku: { type: [string, "null"] }
        contacts:
          type: array
          items: { type: object, required: [id], properties: { id: { type: string } } }
        companies:
          type: array
          items: { type: object, required: [id], properties: { id: { type: string } } }

  - id: plan
    instructions: |
      Stepgate has planned monday.com drafts for closed-won deal
      "{{steps.deal.dealname}}" (HubSpot deal {{steps.deal.deal_id}}, stage
      {{steps.deal.stage_label}}, amount {{steps.deal.amount}}
      {{steps.deal.currency}}, closing {{steps.deal.closedate}}) on board
      {{inputs.board_id}}: one group, and in it one item per line item, each
      with an update carrying the deal, line item, company and contact details.
      A person will be asked to approve the plan before anything is written.

      Line items: {{steps.records.line_items}}
      Companies: {{steps.records.companies}}
      Contacts: {{steps.records.contacts}}

      Submit summary: short Markdown for that person with the sections
      "## Deal", "## Drafts to create" and "## Next steps", in that order.
      - Deal: the deal name, "HubSpot deal <deal_id>", the stage label, the
        amount with its currency and the close date, as given.
      - Drafts to create: one bullet per line item naming it and "HubSpot line
        item <id>", and the companies and contacts its update will name. Cite
        no other line item id.
      - Next steps: the drafts land in a "Stepgate draft" group, to be
        reviewed, assigned and moved out of the group by a person.
    produces:
      type: object
      required: [summary, board_id, group_name, items]
      properties:
        summary: { type: string, minLength: 1, maxLength: 12000 }
        board_id: { type: string }
        group_name: { type: string, minLength: 1, maxLength: 255 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [line_item_id, item_name, update_body]
            additionalProperties: false
            properties:
              line_item_id: { type: string }
              item_name: { type: string, minLength: 1, maxLength: 255 }
              update_body: { type: string, minLength: 1 }
    # The reduce carries the update's deal line and its company and contact lines, which a map body cannot read.
    derive:
      board_id: { var: inputs.board_id }
      group_name: { substr: [{ cat: ["Stepgate draft: ", { var: steps.deal.dealname }, " (HubSpot deal ", { var: steps.deal.deal_id }, ")"] }, 0, 255] }
      items:
        get:
          - reduce:
              - { var: steps.records.line_items }
              - object:
                  - [head, { var: accumulator.head }]
                  - [tail, { var: accumulator.tail }]
                  - - items
                    - merge:
                        - { var: accumulator.items }
                        - - object:
                              - [line_item_id, { var: current.id }]
                              - [item_name, { substr: [{ cat: ["[Draft] ", { var: current.name }, " (HubSpot line item ", { var: current.id }, ")"] }, 0, 255] }]
                              - - update_body
                                - cat:
                                    - { var: accumulator.head }
                                    - "Line item: "
                                    - { var: current.name }
                                    - "\nQuantity: "
                                    - { var: current.quantity }
                                    - "\nUnit price: "
                                    - { var: current.price }
                                    - "\nAmount: "
                                    - { var: current.amount }
                                    - "\nSKU: "
                                    - { var: current.sku }
                                    - "\n"
                                    - { var: accumulator.tail }
              - object:
                  - [head, { cat: ["Deal: ", { var: steps.deal.dealname }, " (HubSpot deal ", { var: steps.deal.deal_id }, ")\n"] }]
                  - - tail
                    - cat:
                        - reduce: [{ var: steps.records.companies }, { cat: [{ var: accumulator }, "Company: ", { var: current.name }, "\n"] }, ""]
                        - reduce: [{ var: steps.records.contacts }, { cat: [{ var: accumulator }, "Contact: ", { var: current.firstname }, " ", { var: current.lastname }, " <", { var: current.email }, ">, ", { var: current.jobtitle }, ", ", { var: current.phone }, "\n"] }, ""]
                        - "Draft created by Stepgate from HubSpot. Review before use."
                  - [items, []]
          - items
    let:
      cited: { match_all: [{ var: output.summary }, "HubSpot line item (\\d+)"] }
      line-item-ids: { map: [{ var: steps.records.line_items }, { var: id }] }
    gates:
      - id: sections-in-order
        schema:
          properties:
            summary:
              pattern: "## Deal[\\s\\S]*## Drafts to create[\\s\\S]*## Next steps"
      - id: deal-facts-quoted
        message: The summary must name the deal as "HubSpot deal <deal_id>" and quote its name and stage label as recorded.
        predicate:
          and:
            - in: [{ cat: ["HubSpot deal ", { var: steps.deal.deal_id }] }, { var: output.summary }]
            - in: [{ cat: ["", { var: steps.deal.dealname }] }, { var: output.summary }]
            - in: [{ var: steps.deal.stage_label }, { var: output.summary }]
      - id: line-items-cited
        message: 'The summary must cite every line item as "HubSpot line item <id>", and no other line item id; these are missing or unknown:'
        predicate:
          and:
            - subset: [{ var: let.line-item-ids }, { var: let.cited }]
            - subset: [{ var: let.cited }, { var: let.line-item-ids }]
      - id: approved
        approve:
          message: >
            Create these drafts on monday.com? On board board_id: one new group
            named group_name, and in it one item per entry of items, named
            item_name, each with one update whose text is update_body. Nothing
            that already exists is changed.
    retries: 2

  - id: group
    do:
      calls:
        - id: group
          operation: mondayGraphql
          arguments: { body: { query: *create-group, variables: { board: { var: steps.plan.board_id }, name: { var: steps.plan.group_name } } } }
      output:
        group_id: { var: responses.group.data.create_group.id }
    produces: { type: object, required: [group_id] }
    gates:
      - &monday-answered
        id: monday-answered
        message: "monday.com answered a write with errors, so the run stopped there; check the board for what was made:"
        predicate: { none: [{ var: calls }, { or: [{ var: result.errors }, { "!": { var: result.data } }] }] }
        explain: { map: [{ var: calls }, { var: result.errors }] }

  - id: items
    do:
      calls:
        - id: items
          operation: mondayGraphql
          each: { var: steps.plan.items }
          arguments: { body: { query: *create-item, variables: { board: { var: steps.plan.board_id }, group: { var: steps.group.group_id }, name: { var: item.item_name } } } }
      output:
        items:
          map:
            - join:
                - reduce: [{ var: steps.plan.items }, { merge: [{ var: accumulator }, [{ object: [[i, { length: { var: accumulator } }], [value, { var: current }]] }]] }, []]
                - reduce: [{ var: responses.items }, { merge: [{ var: accumulator }, [{ object: [[i, { length: { var: accumulator } }], [value, { var: current }]] }]] }, []]
                - i
                - i
            - object:
                - [line_item_id, { var: left.value.line_item_id }]
                - [item_name, { var: left.value.item_name }]
                - [update_body, { var: left.value.update_body }]
                - [item_id, { var: right.value.data.create_item.id }]
    produces:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [line_item_id, item_name, update_body, item_id]
    gates: [*monday-answered]

  - id: updates
    do:
      calls:
        - id: updates
          operation: mondayGraphql
          each: { var: steps.items.items }
          arguments: { body: { query: *create-update, variables: { item: { var: item.item_id }, body: { var: item.update_body } } } }
      output:
        group_id: { var: steps.group.group_id }
        items:
          map:
            - join:
                - reduce: [{ var: steps.items.items }, { merge: [{ var: accumulator }, [{ object: [[i, { length: { var: accumulator } }], [value, { var: current }]] }]] }, []]
                - reduce: [{ var: responses.updates }, { merge: [{ var: accumulator }, [{ object: [[i, { length: { var: accumulator } }], [value, { var: current }]] }]] }, []]
                - i
                - i
            - object:
                - [line_item_id, { var: left.value.line_item_id }]
                - [item_name, { var: left.value.item_name }]
                - [item_id, { var: left.value.item_id }]
                - [update_id, { var: right.value.data.create_update.id }]
    produces:
      type: object
      required: [group_id, items]
      properties:
        group_id: { type: string }
        items:
          type: array
          items:
            type: object
            required: [line_item_id, item_name, item_id, update_id]
    gates: [*monday-answered]
