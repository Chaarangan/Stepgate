# yaml-language-server: $schema=../../../server/schema/stepfile.schema.json
stepgate: "1"
id: auto-claim-vin-validation
title: Auto claim vehicle check against the VIN and NHTSA recalls
description: >
  Decodes an auto claim's VIN with NHTSA vPIC, compares the claimed make, model
  and year against the decode, lists the vehicle's NHTSA recalls, and returns a
  consistent-or-refer verdict whose every value comes from those APIs.

inputs:
  type: object
  required: [vin, claimed_make, claimed_model, claimed_year]
  properties:
    vin: { type: string, pattern: "^[A-HJ-NPR-Z0-9]{17}$" }
    claimed_make: { type: string, pattern: "^\\S(.{0,58}\\S)?$" }
    claimed_model: { type: string, pattern: "^\\S(.{0,58}\\S)?$" }
    claimed_year: { type: integer, minimum: 1981, maximum: 2100 }

tools:
  vpic:
    openapi:
      server: https://vpic.nhtsa.dot.gov/api/vehicles
      document:
        openapi: 3.1.0
        info: { title: NHTSA vPIC VIN decoding (trimmed), version: "1" }
        paths:
          /DecodeVinValues/{vin}:
            get:
              operationId: decodeVin
              summary: Decode one 17-character VIN into flat make, model, model year and other fields.
              parameters:
                - name: vin
                  in: path
                  required: true
                  schema: { type: string, pattern: "^[A-HJ-NPR-Z0-9]{17}$" }
                - name: format
                  in: query
                  required: true
                  description: Always json; the API answers XML otherwise.
                  schema: { type: string, enum: [json] }
              responses:
                "200": { description: "An object whose Results array holds one decoded record" }
    exposes: [decodeVin]
  nhtsa:
    openapi:
      server: https://api.nhtsa.gov
      document:
        openapi: 3.1.0
        info: { title: NHTSA recalls (trimmed), version: "1" }
        paths:
          /recalls/recallsByVehicle:
            get:
              operationId: getRecallsByVehicle
              summary: >
                List NHTSA safety recalls for one make, model and model year.
                Answers HTTP 400 with a body of Count 0 when there are none.
              parameters:
                - name: make
                  in: query
                  required: true
                  schema: { type: string, minLength: 1 }
                - name: model
                  in: query
                  required: true
                  schema: { type: string, minLength: 1 }
                - name: modelYear
                  in: query
                  required: true
                  schema: { type: string, pattern: "^[0-9]{4}$" }
              responses:
                "200": { description: "Count and a results array of recall campaigns" }
                "400": { description: No recalls for that vehicle }
    exposes: [getRecallsByVehicle]

steps:
  - id: decode
    do:
      calls:
        - { id: decode, operation: decodeVin, arguments: { vin: { var: inputs.vin } } }
      output:
        vin: { var: inputs.vin }
        make: { var: responses.decode.Results.0.Make }
        model: { var: responses.decode.Results.0.Model }
        model_year: { var: responses.decode.Results.0.ModelYear }
        body_class: { var: responses.decode.Results.0.BodyClass }
        error_code: { var: responses.decode.Results.0.ErrorCode }
        error_text: { var: responses.decode.Results.0.ErrorText }
    produces:
      type: object
      required: [vin, make, model, model_year, body_class, error_code, error_text]
      properties:
        vin: { type: string }
        make: { type: string }
        model: { type: string }
        model_year: { type: string }
        body_class: { type: string }
        error_code: { type: string }
        error_text: { type: string }
    gates:
      - id: vehicle-decoded
        schema:
          properties:
            make: { minLength: 1 }
            model: { minLength: 1 }
            model_year: { pattern: "^[0-9]{4}$" }

  - id: compare
    do:
      output:
        make:
          claimed: { var: inputs.claimed_make }
          decoded: { var: steps.decode.make }
          match: { "==": [{ lower: { var: inputs.claimed_make } }, { lower: { var: steps.decode.make } }] }
        model:
          claimed: { var: inputs.claimed_model }
          decoded: { var: steps.decode.model }
          match: { "==": [{ lower: { var: inputs.claimed_model } }, { lower: { var: steps.decode.model } }] }
        model_year:
          claimed: { var: inputs.claimed_year }
          decoded: { var: steps.decode.model_year }
          match: { "==": [{ var: inputs.claimed_year }, { var: steps.decode.model_year }] }
        any_mismatch:
          or:
            - "!=": [{ lower: { var: inputs.claimed_make } }, { lower: { var: steps.decode.make } }]
            - "!=": [{ lower: { var: inputs.claimed_model } }, { lower: { var: steps.decode.model } }]
            - "!=": [{ var: inputs.claimed_year }, { var: steps.decode.model_year }]
    produces:
      type: object
      required: [make, model, model_year, any_mismatch]
      properties:
        make: { $ref: "#/$defs/textComparison" }
        model: { $ref: "#/$defs/textComparison" }
        model_year:
          type: object
          required: [claimed, decoded, match]
          properties:
            claimed: { type: integer }
            decoded: { type: string }
            match: { type: boolean }
        any_mismatch: { type: boolean }

  - id: recalls
    do:
      calls:
        # NHTSA answers 400 with Count 0 when the vehicle has no recalls.
        - id: recalls
          operation: getRecallsByVehicle
          arguments: { make: { var: steps.decode.make }, model: { var: steps.decode.model }, modelYear: { var: steps.decode.model_year } }
          accept: [400]
      output:
        recall_count: { var: responses.recalls.Count }
        recalls:
          map:
            - { var: responses.recalls.results }
            - object: [[campaign_number, { var: NHTSACampaignNumber }], [component, { var: Component }], [report_received_date, { var: ReportReceivedDate }]]
    produces:
      type: object
      required: [recall_count, recalls]
      properties:
        recall_count: { type: integer, minimum: 0 }
        recalls:
          type: array
          items:
            type: object
            required: [campaign_number, component, report_received_date]
            properties:
              campaign_number: { type: string }
              component: { type: string }
              report_received_date: { type: string }

  - id: verdict
    do:
      output:
        reasons:
          merge:
            - if: [{ "!==": [{ var: steps.decode.error_code }, "0"] }, [vin_decode_error], []]
            - if: [{ var: steps.compare.make.match }, [], [make_mismatch]]
            - if: [{ var: steps.compare.model.match }, [], [model_mismatch]]
            - if: [{ var: steps.compare.model_year.match }, [], [model_year_mismatch]]
        verdict:
          if:
            - and:
                - "===": [{ var: steps.decode.error_code }, "0"]
                - "!": { var: steps.compare.any_mismatch }
            - consistent
            - refer
        recall_count: { var: steps.recalls.recall_count }
    produces:
      type: object
      required: [verdict, reasons, recall_count]
      properties:
        verdict: { enum: [consistent, refer] }
        reasons:
          type: array
          items: { enum: [vin_decode_error, make_mismatch, model_mismatch, model_year_mismatch] }
        recall_count: { type: integer }

  - id: report
    instructions: |
      Write a summary in Markdown for a claims handler.

      Claim VIN: {{inputs.vin}}
      Decode: {{steps.decode}}
      Comparison with the claim: {{steps.compare}}
      Verdict: {{steps.verdict.verdict}}, for these reasons: {{steps.verdict.reasons}}
      NHTSA recalls ({{steps.recalls.recall_count}} in total): {{steps.recalls.recalls}}

      State the VIN, the decoded make, model and model year exactly as
      decoded, the verdict and each reason in plain words, then the recall
      count and the recalls by campaign number and component. Cite no
      campaign number that is not listed above.
    produces:
      type: object
      required: [summary_markdown]
      properties:
        summary_markdown: { type: string, minLength: 1, maxLength: 5000 }
    gates:
      - id: summary-names-vehicle-and-verdict
        message: The summary must state the VIN, the decoded make, model and model year exactly as decoded, and the verdict.
        predicate:
          and:
            - in: [{ var: inputs.vin }, { var: output.summary_markdown }]
            - in: [{ var: steps.decode.make }, { var: output.summary_markdown }]
            - in: [{ var: steps.decode.model }, { var: output.summary_markdown }]
            - in: [{ var: steps.decode.model_year }, { var: output.summary_markdown }]
            - in: [{ var: steps.verdict.verdict }, { var: output.summary_markdown }]
      - id: summary-cites-listed-recalls
        message: "Every campaign number in the summary must be a recall the recalls step listed; these are not:"
        predicate:
          subset:
            - { match_all: [{ var: output.summary_markdown }, "\\b([0-9]{2}[A-Z][0-9]{6})\\b"] }
            - { map: [{ var: steps.recalls.recalls }, { var: campaign_number }] }
    retries: 2

$defs:
  textComparison:
    type: object
    required: [claimed, decoded, match]
    properties:
      claimed: { type: string }
      decoded: { type: string }
      match: { type: boolean }
