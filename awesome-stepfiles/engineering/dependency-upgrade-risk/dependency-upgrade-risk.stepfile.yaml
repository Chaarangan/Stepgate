# yaml-language-server: $schema=../../../server/schema/stepfile.schema.json
stepgate: "1"
id: dependency-upgrade-risk
title: Upgrade risk for npm dependencies
description: >
  Checks each npm package and pinned version against the npm registry and OSV.dev, and recommends an
  upgrade only where the registry's latest release is published and OSV lists no advisory against it.

inputs:
  type: object
  required: [packages]
  properties:
    packages:
      type: array
      minItems: 1
      maxItems: 10
      uniqueItems: true
      items:
        type: object
        required: [name, version]
        additionalProperties: false
        properties:
          name: { type: string, minLength: 1, maxLength: 214 }
          version:
            type: string
            pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$"

tools:
  npm:
    openapi:
      server: https://registry.npmjs.org
      document:
        openapi: 3.1.0
        info: { title: npm public registry (trimmed), version: "1" }
        paths:
          /{package}/{version}:
            get:
              operationId: getPackageVersion
              summary: >
                Fetch the registry manifest of one published version of an npm package. Pass version
                "latest" to get the release the latest dist-tag points at. Returns HTTP 404 when the
                package or the version does not exist.
              parameters:
                - name: package
                  in: path
                  required: true
                  schema: { type: string, description: "Package name, for example lodash or @types/node" }
                - name: version
                  in: path
                  required: true
                  schema: { type: string, description: "An exact version such as 4.17.20, or latest" }
              responses:
                "200": { description: The version manifest, with name and version fields }
                "404": { description: Package or version not found }
    exposes: [getPackageVersion]

  osv:
    openapi:
      server: https://api.osv.dev/v1
      document:
        openapi: 3.1.0
        info: { title: OSV.dev API (trimmed), version: "1" }
        paths:
          /query:
            post:
              operationId: queryVulns
              summary: >
                List the OSV advisories affecting one npm package version, each with id, summary and
                database_specific.severity. An empty object means no known advisory.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required: [package, version]
                      additionalProperties: false
                      properties:
                        package:
                          type: object
                          required: [name, ecosystem]
                          additionalProperties: false
                          properties:
                            name: { type: string }
                            ecosystem: { type: string, enum: [npm] }
                        version: { type: string }
              responses:
                "200": { description: "vulns lists the advisories in OSV format" }
    exposes: [{ name: queryVulns, effect: read }]

# An each call's responses come back in the order of its items, so steps pair them by position: the
# reduce numbers a list as { i, value } and join matches the numbers.
steps:
  - id: resolve
    do:
      calls:
        - { id: current, operation: getPackageVersion, each: { var: inputs.packages }, arguments: { package: { var: item.name }, version: { var: item.version } }, accept: [404] }
        - { id: latest, operation: getPackageVersion, each: { var: inputs.packages }, arguments: { package: { var: item.name }, version: latest }, accept: [404] }
      output:
        packages:
          map:
            - join:
                - join:
                    - reduce: [{ var: inputs.packages }, { merge: [{ var: accumulator }, [{ object: [[i, { length: { var: accumulator } }], [value, { var: current }]] }]] }, []]
                    - reduce: [{ var: responses.current }, { merge: [{ var: accumulator }, [{ object: [[i, { length: { var: accumulator } }], [value, { var: current }]] }]] }, []]
                    - i
                    - i
                - reduce: [{ var: responses.latest }, { merge: [{ var: accumulator }, [{ object: [[i, { length: { var: accumulator } }], [value, { var: current }]] }]] }, []]
                - left.i
                - i
            - object:
                - [name, { var: left.left.value.name }]
                - [current_version, { var: left.left.value.version }]
                - ["current_exists", { "!!": [{ var: left.right.value.version }] }]
                - [latest_version, { var: [right.value.version, null] }]
    produces:
      type: object
      required: [packages]
      properties:
        packages:
          type: array
          items:
            type: object
            required: [name, current_version, current_exists, latest_version]
            additionalProperties: false
            properties:
              name: { type: string }
              current_version: { type: string }
              current_exists: { type: boolean }
              latest_version: { type: [string, "null"] }

  - id: vulns
    do:
      calls:
        - id: current
          operation: queryVulns
          each: { filter: [{ var: steps.resolve.packages }, { var: current_exists }] }
          arguments: { body: { package: { name: { var: item.name }, ecosystem: npm }, version: { var: item.current_version } } }
        - id: latest
          operation: queryVulns
          each: { filter: [{ var: steps.resolve.packages }, { var: current_exists }] }
          arguments: { body: { package: { name: { var: item.name }, ecosystem: npm }, version: { var: item.latest_version } } }
      output:
        packages:
          map:
            - join:
                - join:
                    - reduce: [{ filter: [{ var: steps.resolve.packages }, { var: current_exists }] }, { merge: [{ var: accumulator }, [{ object: [[i, { length: { var: accumulator } }], [value, { var: current }]] }]] }, []]
                    - reduce: [{ var: responses.current }, { merge: [{ var: accumulator }, [{ object: [[i, { length: { var: accumulator } }], [value, { var: current }]] }]] }, []]
                    - i
                    - i
                - reduce: [{ var: responses.latest }, { merge: [{ var: accumulator }, [{ object: [[i, { length: { var: accumulator } }], [value, { var: current }]] }]] }, []]
                - left.i
                - i
            - object:
                - [name, { var: left.left.value.name }]
                - [current_version, { var: left.left.value.current_version }]
                - [latest_version, { var: left.left.value.latest_version }]
                - - current_vulns
                  - map:
                      - { var: left.right.value.vulns }
                      - object: [[id, { var: id }], [severity, { var: [database_specific.severity, UNKNOWN] }], [summary, { var: [summary, ""] }]]
                - [latest_vulns, { map: [{ var: right.value.vulns }, { var: id }] }]
    produces:
      type: object
      required: [packages]
      properties:
        packages:
          type: array
          items:
            type: object
            required: [name, current_version, latest_version, current_vulns, latest_vulns]
            additionalProperties: false
            properties:
              name: { type: string }
              current_version: { type: string }
              latest_version: { type: string }
              current_vulns:
                type: array
                items:
                  type: object
                  required: [id, severity, summary]
                  additionalProperties: false
                  properties:
                    id: { type: string }
                    severity: { enum: [CRITICAL, HIGH, MODERATE, LOW, UNKNOWN] }
                    summary: { type: string }
              latest_vulns: { type: array, items: { type: string } }

  - id: recommend
    do:
      output:
        packages:
          merge:
            - map:
                - filter: [{ var: steps.resolve.packages }, { "!": { var: current_exists } }]
                - object:
                    - [name, { var: name }]
                    - [current_version, { var: current_version }]
                    - [latest_version, { var: latest_version }]
                    - [action, not-found]
                    - [highest_severity, NONE]
                    - [advisory_count, 0]
            - map:
                - var: steps.vulns.packages
                - object:
                    - [name, { var: name }]
                    - [current_version, { var: current_version }]
                    - [latest_version, { var: latest_version }]
                    - - action
                      - if:
                          - ">": [{ length: { var: current_vulns } }, 0]
                          - if: [{ "==": [{ length: { var: latest_vulns } }, 0] }, upgrade, review]
                          - if: [{ "!=": [{ var: latest_version }, { var: current_version }] }, optional, keep]
                    - - highest_severity
                      - if:
                          - in: [CRITICAL, { map: [{ var: current_vulns }, { var: severity }] }]
                          - CRITICAL
                          - in: [HIGH, { map: [{ var: current_vulns }, { var: severity }] }]
                          - HIGH
                          - in: [MODERATE, { map: [{ var: current_vulns }, { var: severity }] }]
                          - MODERATE
                          - in: [LOW, { map: [{ var: current_vulns }, { var: severity }] }]
                          - LOW
                          - ">": [{ length: { var: current_vulns } }, 0]
                          - UNKNOWN
                          - NONE
                    - [advisory_count, { length: { var: current_vulns } }]
    produces:
      type: object
      required: [packages]
      properties:
        packages:
          type: array
          items:
            type: object
            required: [name, current_version, latest_version, action, highest_severity, advisory_count]
            additionalProperties: false
            properties:
              name: { type: string }
              current_version: { type: string }
              latest_version: { type: [string, "null"] }
              action: { enum: [upgrade, review, optional, keep, not-found] }
              highest_severity: { enum: [CRITICAL, HIGH, MODERATE, LOW, UNKNOWN, NONE] }
              advisory_count: { type: integer, minimum: 0 }

  - id: report
    instructions: |
      Recommendations:
      {{steps.recommend.packages}}

      Advisories against the pinned versions:
      {{steps.vulns.packages}}

      Write summary: a short Markdown report with one line per package naming the package, both
      versions, the action and the ids of the pinned version's advisories with their severities,
      followed by a sentence on what to upgrade first. Use only the data above.
    produces:
      type: object
      required: [summary]
      properties:
        summary: { type: string, minLength: 1, maxLength: 8000 }
    let:
      cited: { match_all: [{ var: output.summary }, "\\b(GHSA(?:-[0-9a-z]{4}){3}|MAL-[0-9]{4}-[0-9]+)\\b"] }
      pinned: { flatten: { map: [{ var: steps.vulns.packages }, { map: [{ var: current_vulns }, { var: id }] }] } }
    gates:
      # The reduce keeps the summary as its accumulator while every name is found, and empties it otherwise.
      - id: summary-names-every-package
        message: The summary must mention every package by name.
        predicate:
          "!=":
            - reduce:
                - var: steps.recommend.packages
                - if: [{ in: [{ var: current.name }, { var: accumulator }] }, { var: accumulator }, ""]
                - var: output.summary
            - ""
      - id: summary-lists-pinned-advisories
        message: "The summary must name every advisory against a pinned version; these are missing:"
        predicate: { subset: [{ var: let.pinned }, { var: let.cited }] }
      - id: summary-cites-known-advisories
        message: "Every advisory id in the summary must be one OSV returned; these are not:"
        predicate:
          subset:
            - var: let.cited
            - merge: [{ var: let.pinned }, { flatten: { map: [{ var: steps.vulns.packages }, { var: latest_vulns }] } }]
    retries: 2
