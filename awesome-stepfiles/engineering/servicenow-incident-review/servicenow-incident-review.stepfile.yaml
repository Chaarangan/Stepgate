# yaml-language-server: $schema=../../../server/schema/stepfile.schema.json
stepgate: "1"
id: servicenow-incident-review
title: Incident review from ServiceNow and GitHub
description: >
  Reads a ServiceNow incident, lists the GitHub commits and merged pull requests on one branch in the
  hours before it opened, builds a timeline and a list of suspect changes that cite real commit SHAs
  and pull request numbers, and adds the review to the incident as an internal work note once a person
  approves it.

settings:
  servicenow-instance:
    description: Your ServiceNow instance name, the "acme" in acme.service-now.com.

inputs:
  type: object
  required: [incident_number, owner, repo, branch, lookback_hours]
  additionalProperties: false
  properties:
    incident_number:
      type: string
      pattern: "^[A-Z]{2,10}[0-9]{4,12}$"
      description: The incident number as ServiceNow shows it, for example INC0010001
    owner: { type: string, pattern: "^[A-Za-z0-9-]{1,39}$", description: GitHub user or organisation }
    repo: { type: string, pattern: "^[A-Za-z0-9._-]{1,100}$", description: Repository name without .git }
    branch: { type: string, pattern: "^[^\\s]{1,255}$", description: The deployed branch, for example main }
    lookback_hours:
      type: integer
      minimum: 1
      maximum: 72
      description: How many hours before the incident opened to search for changes

credentials:
  servicenow:
    kind: basic
    hosts: ["{servicenow-instance}.service-now.com"]
    description: >
      A ServiceNow user name and password, as user:password, for a user that can read incidents and
      write their work notes (usually the itil role). Reads one incident and adds one work note.
  github:
    kind: bearer
    hosts: [api.github.com]
    description: >
      A GitHub fine-grained personal access token with read-only Contents and Pull requests access to
      the repository (or a classic token; public repositories need no scope). Never writes.

tools:
  servicenow:
    openapi:
      server: https://{servicenow-instance}.service-now.com/api/now/table
      document:
        openapi: 3.1.0
        info: { title: ServiceNow Table API, incident table (trimmed), version: "1" }
        components:
          securitySchemes:
            basicAuth: { type: http, scheme: basic }
        security: [{ basicAuth: [] }]
        paths:
          /incident:
            get:
              operationId: findIncident
              summary: >
                Find one incident with an encoded query such as number=INC0010001. result is an array of
                at most one record with sys_id, number, short_description, state, priority, opened_at and
                resolved_at. Date-times are UTC as "YYYY-MM-DD HH:MM:SS"; resolved_at is "" while open.
              parameters:
                - name: sysparm_query
                  in: query
                  required: true
                  schema: { type: string, description: "Encoded query, exactly number=<incident number>" }
                - name: sysparm_fields
                  in: query
                  schema: { enum: ["sys_id,number,short_description,state,priority,opened_at,resolved_at"] }
                - name: sysparm_limit
                  in: query
                  schema: { enum: ["1"] }
                - name: sysparm_display_value
                  in: query
                  schema: { enum: ["false"] }
                - name: sysparm_exclude_reference_link
                  in: query
                  schema: { enum: ["true"] }
              responses:
                "200": { description: "{ result: [record] }" }
          /incident/{sys_id}:
            get:
              operationId: getIncidentNotes
              summary: >
                Read an incident's assignment group name and work notes as display text. result.work_notes
                holds every work note, newest first, each headed by its time and author; it is "" when
                there are none.
              parameters:
                - name: sys_id
                  in: path
                  required: true
                  schema: { type: string, pattern: "^[0-9a-f]{32}$" }
                - name: sysparm_fields
                  in: query
                  schema: { enum: ["sys_id,number,assignment_group,work_notes"] }
                - name: sysparm_display_value
                  in: query
                  schema: { enum: ["true"] }
                - name: sysparm_exclude_reference_link
                  in: query
                  schema: { enum: ["true"] }
              responses:
                "200": { description: "{ result: record }" }
            patch:
              operationId: addWorkNote
              summary: >
                Add one internal work note to the incident. Work notes are visible to fulfillers only,
                never to the caller. Returns result with sys_id, number and sys_updated_on.
              parameters:
                - name: sys_id
                  in: path
                  required: true
                  schema: { type: string, pattern: "^[0-9a-f]{32}$" }
                - name: sysparm_fields
                  in: query
                  schema: { enum: ["sys_id,number,sys_updated_on"] }
                - name: sysparm_display_value
                  in: query
                  schema: { enum: ["false"] }
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required: [work_notes]
                      additionalProperties: false
                      properties:
                        work_notes: { type: string, minLength: 1, maxLength: 4000 }
              responses:
                "200": { description: "{ result: record }" }
    credential: servicenow
    exposes: [findIncident, getIncidentNotes, addWorkNote]

  github:
    openapi:
      server: https://api.github.com
      document:
        openapi: 3.1.0
        info: { title: GitHub REST API (trimmed), version: "2026-03-10" }
        components:
          securitySchemes:
            bearerAuth: { type: http, scheme: bearer }
          parameters:
            accept:
              name: Accept
              in: header
              schema: { enum: [application/vnd.github+json] }
            apiVersion:
              name: X-GitHub-Api-Version
              in: header
              schema: { enum: ["2026-03-10"] }
            owner:
              name: owner
              in: path
              required: true
              schema: { type: string }
            repo:
              name: repo
              in: path
              required: true
              schema: { type: string }
        security: [{ bearerAuth: [] }]
        paths:
          /repos/{owner}/{repo}/commits:
            get:
              operationId: listCommits
              summary: >
                List the commits on a branch committed between since and until, newest first, up to 100.
                Each item has sha, commit.message and commit.committer.date (UTC, YYYY-MM-DDTHH:MM:SSZ).
              parameters:
                - $ref: "#/components/parameters/accept"
                - $ref: "#/components/parameters/apiVersion"
                - $ref: "#/components/parameters/owner"
                - $ref: "#/components/parameters/repo"
                - name: sha
                  in: query
                  required: true
                  schema: { type: string, description: Branch name }
                - name: since
                  in: query
                  required: true
                  schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$" }
                - name: until
                  in: query
                  required: true
                  schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$" }
                - name: per_page
                  in: query
                  schema: { enum: [100] }
              responses:
                "200": { description: An array of commits }
          /search/issues:
            get:
              operationId: searchPullRequests
              summary: >
                Search pull requests, up to 100. total_count is the number of matches and items the
                first 100, each with number, title and pull_request.merged_at.
              parameters:
                - $ref: "#/components/parameters/accept"
                - $ref: "#/components/parameters/apiVersion"
                - name: q
                  in: query
                  required: true
                  schema: { type: string }
                - name: per_page
                  in: query
                  schema: { enum: [100] }
              responses:
                "200": { description: "total_count, incomplete_results and items" }
    credential: github
    exposes: [listCommits, searchPullRequests]

steps:
  - id: incident
    do:
      calls:
        - { id: find, operation: findIncident, arguments: { sysparm_query: { cat: [number=, { var: inputs.incident_number }] } } }
        - { id: notes, operation: getIncidentNotes, arguments: { sys_id: { var: responses.find.result.0.sys_id } } }
      output:
        sys_id: { var: responses.find.result.0.sys_id }
        short_description: { var: responses.find.result.0.short_description }
        state: { var: responses.find.result.0.state }
        priority: { var: responses.find.result.0.priority }
        # ServiceNow's "YYYY-MM-DD HH:MM:SS" is already UTC.
        opened_at: &opened { cat: [{ substr: [&raw { var: responses.find.result.0.opened_at }, 0, 10] }, T, { substr: [*raw, 11, 8] }, Z] }
        resolved_at:
          if:
            - { var: responses.find.result.0.resolved_at }
            - cat: [{ substr: [{ var: responses.find.result.0.resolved_at }, 0, 10] }, T, { substr: [{ var: responses.find.result.0.resolved_at }, 11, 8] }, Z]
            - null
        assignment_group:
          if:
            - "!=": [{ var: responses.notes.result.assignment_group.display_value }, null]
            - { var: responses.notes.result.assignment_group.display_value }
            - { var: responses.notes.result.assignment_group }
        work_notes: { substr: [{ var: responses.notes.result.work_notes }, 0, 4000] }
        window_end: *opened
        window_start:
          time_add:
            - *opened
            - "*": [{ var: inputs.lookback_hours }, -3600]
    produces:
      type: object
      required: [sys_id, short_description, state, priority, opened_at, resolved_at, assignment_group, work_notes, window_start, window_end]
      properties:
        sys_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        short_description: { type: string }
        state: { type: string }
        priority: { type: string }
        opened_at: { $ref: "#/$defs/utc" }
        resolved_at: { anyOf: [{ $ref: "#/$defs/utc" }, { type: "null" }] }
        assignment_group: { type: string }
        work_notes: { type: string }
        window_start: { $ref: "#/$defs/utc" }
        window_end: { $ref: "#/$defs/utc" }

  - id: changes
    do:
      calls:
        - id: commits
          operation: listCommits
          arguments:
            owner: { var: inputs.owner }
            repo: { var: inputs.repo }
            sha: { var: inputs.branch }
            since: { var: steps.incident.window_start }
            until: { var: steps.incident.window_end }
        - id: pulls
          operation: searchPullRequests
          arguments:
            q: { cat: ["repo:", { var: inputs.owner }, "/", { var: inputs.repo }, " is:pr is:merged base:", { var: inputs.branch }, " merged:", { var: steps.incident.window_start }, "..", { var: steps.incident.window_end }] }
      output:
        events:
          merge:
            - - object: [[kind, incident-opened], [ref, incident-opened], [at, { var: steps.incident.opened_at }], [title, { var: steps.incident.short_description }]]
            - if:
                - { var: steps.incident.resolved_at }
                - - object: [[kind, incident-resolved], [ref, incident-resolved], [at, { var: steps.incident.resolved_at }], [title, { var: steps.incident.short_description }]]
                - []
            - map:
                - { var: responses.commits }
                - object: [[kind, commit], [ref, { var: sha }], [at, { var: commit.committer.date }], [title, { get: [{ match_all: [{ var: commit.message }, "^[^\\r\\n]*"] }, 0] }]]
            - map:
                - { var: responses.pulls.items }
                - object: [[kind, pull], [ref, { cat: ["#", { var: number }] }], [at, { var: pull_request.merged_at }], [title, { var: title }]]
        commits_listed: { length: { var: responses.commits } }
        pulls_listed: { length: { var: responses.pulls.items } }
        pulls_matched: { var: responses.pulls.total_count }
        pulls_incomplete: { var: responses.pulls.incomplete_results }
    produces:
      type: object
      required: [events, commits_listed, pulls_listed, pulls_matched, pulls_incomplete]
      properties:
        events:
          type: array
          items:
            type: object
            required: [kind, ref, at, title]
            additionalProperties: false
            properties:
              kind: { enum: [incident-opened, incident-resolved, commit, pull] }
              ref: { type: string }
              at: { $ref: "#/$defs/utc" }
              title: { type: string }
        commits_listed: { type: integer }
        pulls_listed: { type: integer }
        pulls_matched: { type: integer }
        pulls_incomplete: { type: boolean }
    gates:
      - id: every-change-listed
        message: The window holds more changes than one page of 100 commits or pull requests; shorten lookback_hours.
        predicate:
          and:
            - "<": [{ var: output.commits_listed }, 100]
            - "==": [{ var: output.pulls_listed }, { var: output.pulls_matched }]
            - "==": [{ var: output.pulls_incomplete }, false]

  - id: analyse
    instructions: |
      Incident {{inputs.incident_number}}: "{{steps.incident.short_description}}", assignment group
      "{{steps.incident.assignment_group}}", opened {{steps.incident.opened_at}}, resolved
      {{steps.incident.resolved_at}} (null means still open). Its work notes, newest first:

      {{steps.incident.work_notes}}

      The incident's events and the changes to {{inputs.owner}}/{{inputs.repo}} ({{inputs.branch}})
      from {{steps.incident.window_start}} to {{steps.incident.window_end}}, in no particular order:

      {{steps.changes.events}}

      Submit:
      - entries: every event above once, sorted by at, oldest first, as { ref, summary } with ref
        exactly as above and a one-line summary;
      - suspects: the commits or pull requests most likely to have caused the incident, judged from
        their titles and timing against the short description and work notes, as { ref, reason } with
        a one-sentence reason; none if nothing plausibly relates;
      - summary: a short plain-text review that names the incident and every suspect by ref, and why.
        Cite commits by full sha and pull requests as #number, and cite only changes listed above.

      Stepgate adds the review to the incident as a work note, after the suspects, once a person
      approves it.
    produces:
      type: object
      required: [entries, suspects, summary, timeline, work_note]
      additionalProperties: false
      properties:
        entries:
          type: array
          items:
            type: object
            required: [ref, summary]
            additionalProperties: false
            properties:
              ref: { type: string }
              summary: { type: string, maxLength: 300 }
        suspects:
          type: array
          maxItems: 10
          items:
            type: object
            required: [ref, reason]
            additionalProperties: false
            properties:
              ref: { type: string }
              reason: { type: string, maxLength: 300 }
        summary: { type: string, minLength: 1, maxLength: 3000 }
        timeline:
          type: array
          items:
            type: object
            required: [at, kind, ref, summary]
            properties:
              at: { type: [string, "null"] }
              kind: { type: [string, "null"] }
              ref: { type: string }
              summary: { type: string }
        work_note: { type: string, minLength: 1, maxLength: 4000 }
    derive:
      timeline:
        map:
          - join: [{ var: output.entries }, { var: steps.changes.events }, ref, ref]
          - object: [[at, { var: right.at }], [kind, { var: right.kind }], [ref, { var: left.ref }], [summary, { var: left.summary }]]
      work_note:
        cat:
          - Incident review for
          - " "
          - { var: inputs.incident_number }
          - "\nWindow: "
          - { var: steps.incident.window_start }
          - " to "
          - { var: steps.incident.window_end }
          - "\nRepository: "
          - { var: inputs.owner }
          - /
          - { var: inputs.repo }
          - " ("
          - { var: inputs.branch }
          - ")\n\nSuspect changes:\n"
          - if:
              - { var: output.suspects }
              - reduce: [{ var: output.suspects }, { cat: [{ var: accumulator }, "- ", { var: current.ref }, ": ", { var: current.reason }, "\n"] }, ""]
              - "None.\n"
          - "\n"
          - { var: output.summary }
    let:
      events: { map: [{ var: steps.changes.events }, { var: ref }] }
      changes: { map: [{ filter: [{ var: steps.changes.events }, { in: [{ var: kind }, [commit, pull]] }] }, { var: ref }] }
      entries: { map: [{ var: output.entries }, { var: ref }] }
      suspects: { map: [{ var: output.suspects }, { var: ref }] }
      cited:
        merge:
          - { match_all: [{ var: output.summary }, "\\b[0-9a-f]{40}\\b"] }
          - { map: [{ match_all: [{ var: output.summary }, "#([0-9]+)"] }, { cat: ["#", { var: "" }] }] }
    gates:
      - id: timeline-is-the-evidence
        message: "entries must list every event exactly once, and nothing else:"
        predicate:
          and:
            - subset: [{ var: let.entries }, { var: let.events }]
            - subset: [{ var: let.events }, { var: let.entries }]
            - "==": [{ length: { var: let.entries } }, { length: { unique: { var: let.entries } } }]
      # The reduce carries the previous time and turns into "~" at the first entry out of order.
      - id: timeline-sorted
        message: Sort entries by the events' at, oldest first.
        predicate:
          "!=":
            - reduce:
                - var: output.timeline
                - if:
                    - and: [{ "!=": [{ var: accumulator }, "~"] }, { "<=": [{ var: accumulator }, { var: current.at }] }]
                    - var: current.at
                    - "~"
                - ""
            - "~"
      - id: suspects-are-changes
        message: "Every suspect must be a listed commit (full sha) or pull request (#number), listed once:"
        predicate:
          and:
            - subset: [{ var: let.suspects }, { var: let.changes }]
            - "==": [{ length: { var: let.suspects } }, { length: { unique: { var: let.suspects } } }]
      - id: summary-names-incident
        message: The summary must name the incident number.
        predicate: { in: [{ var: inputs.incident_number }, { var: output.summary }] }
      - id: summary-names-suspects
        message: "The summary must cite every suspect by ref; it does not cite:"
        predicate: { subset: [{ var: let.suspects }, { var: let.cited }] }
      - id: summary-cites-changes
        message: "The summary may cite only listed commits (full sha) and pull requests (#number); these are not listed:"
        predicate: { subset: [{ var: let.cited }, { var: let.changes }] }
      - id: person-approves-note
        approve: { message: "Stepgate will add work_note below to this incident as an internal work note, which only fulfillers see, and change nothing else. Add it?" }
    retries: 2

  - id: note
    do:
      calls:
        - id: note
          operation: addWorkNote
          arguments:
            sys_id: { var: steps.incident.sys_id }
            body: { work_notes: { var: steps.analyse.work_note } }
      output:
        sys_id: { var: responses.note.result.sys_id }
        number: { var: responses.note.result.number }
        sys_updated_on: { var: responses.note.result.sys_updated_on }
    produces:
      type: object
      required: [sys_id, number, sys_updated_on]
      properties:
        sys_id: { type: string }
        number: { type: string }
        sys_updated_on: { type: string, minLength: 1 }
    gates:
      - id: servicenow-confirmed
        message: ServiceNow must answer for the incident that was addressed.
        predicate: { "==": [{ var: output.sys_id }, { var: steps.incident.sys_id }] }

  - id: report
    do:
      output:
        summary:
          cat:
            - "# Incident review for "
            - { var: inputs.incident_number }
            - "\n\n## Timeline\n\n"
            - reduce: [{ var: steps.analyse.timeline }, { cat: [{ var: accumulator }, "- ", { var: current.at }, " ", { var: current.ref }, ": ", { var: current.summary }, "\n"] }, ""]
            - "\n## Review\n\n"
            - { var: steps.analyse.summary }
            - "\n\nWork note added to "
            - { var: steps.note.number }
            - " at "
            - { var: steps.note.sys_updated_on }
            - " UTC.\n"
    produces:
      type: object
      required: [summary]
      properties:
        summary: { type: string }

$defs:
  utc: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$" }
