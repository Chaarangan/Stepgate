# yaml-language-server: $schema=../../../server/schema/stepfile.schema.json
stepgate: "1"
id: regulatory-change-monitor
title: Federal Register rules and proposed rules for a topic or agency
description: >
  Finds the final and proposed rules the Federal Register published for a topic
  or agency in a date range, and briefs which ones matter, citing document
  numbers and effective or comment-close dates taken from the API.

inputs:
  type: object
  required: [start_date, end_date]
  anyOf:
    - required: [topic]
    - required: [agency]
  properties:
    topic: { type: string, minLength: 1, description: "Full-text search term, for example drone" }
    agency:
      type: string
      pattern: "^[a-z0-9-]+$"
      description: "Federal Register agency slug, for example federal-aviation-administration"
    start_date: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "First publication date, YYYY-MM-DD" }
    end_date: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "Last publication date, YYYY-MM-DD" }

tools:
  federal-register:
    openapi:
      server: https://www.federalregister.gov/api/v1
      document:
        openapi: 3.1.0
        info: { title: Federal Register API (trimmed), version: "1" }
        paths:
          /documents.json:
            get:
              operationId: searchDocuments
              summary: >
                Search Federal Register documents. Returns count and up to per_page
                results, each with document_number, title, type, abstract,
                publication_date and agencies.
              parameters:
                - { name: per_page, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 20 } }
                - { name: order, in: query, schema: { enum: [newest, oldest, relevance] } }
                - name: "conditions[type][]"
                  in: query
                  required: true
                  description: RULE for final rules, PRORULE for proposed rules
                  schema: { enum: [RULE, PRORULE] }
                - { name: "conditions[term]", in: query, description: Full-text search term, schema: { type: string } }
                - { name: "conditions[agencies][]", in: query, description: Agency slug, schema: { type: string } }
                - name: "conditions[publication_date][gte]"
                  in: query
                  required: true
                  schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
                - name: "conditions[publication_date][lte]"
                  in: query
                  required: true
                  schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
          /documents/{document_number}.json:
            get:
              operationId: getDocuments
              summary: >
                Full detail for one document, including action, citation,
                effective_on and comments_close_on.
              parameters:
                - name: document_number
                  in: path
                  required: true
                  schema: { type: string, pattern: "^[0-9A-Za-z-]+$" }
    exposes: [searchDocuments, getDocuments]

steps:
  - id: search
    do:
      calls:
        # A null argument breaks the operation's schema, so each combination of topic and agency is spelled out.
        - id: found
          operation: searchDocuments
          each: [RULE, PRORULE]
          arguments:
            if:
              - { and: [{ var: inputs.topic }, { var: inputs.agency }] }
              - object:
                  - [per_page, 20]
                  - [order, newest]
                  - ["conditions[type][]", { var: item }]
                  - ["conditions[publication_date][gte]", { var: inputs.start_date }]
                  - ["conditions[publication_date][lte]", { var: inputs.end_date }]
                  - ["conditions[term]", { var: inputs.topic }]
                  - ["conditions[agencies][]", { var: inputs.agency }]
              - { var: inputs.topic }
              - object:
                  - [per_page, 20]
                  - [order, newest]
                  - ["conditions[type][]", { var: item }]
                  - ["conditions[publication_date][gte]", { var: inputs.start_date }]
                  - ["conditions[publication_date][lte]", { var: inputs.end_date }]
                  - ["conditions[term]", { var: inputs.topic }]
              - object:
                  - [per_page, 20]
                  - [order, newest]
                  - ["conditions[type][]", { var: item }]
                  - ["conditions[publication_date][gte]", { var: inputs.start_date }]
                  - ["conditions[publication_date][lte]", { var: inputs.end_date }]
                  - ["conditions[agencies][]", { var: inputs.agency }]
      output:
        candidates:
          flatten:
            map:
              - { var: responses.found }
              - map:
                  - { var: results }
                  - object:
                      - [document_number, { var: document_number }]
                      - [title, { var: title }]
                      - [type, { var: type }]
                      - [publication_date, { var: publication_date }]
                      - [agencies, { map: [{ var: agencies }, { var: name }] }]
        rule_count: { var: responses.found.0.count }
        proposed_rule_count: { var: responses.found.1.count }
    produces:
      type: object
      required: [candidates, rule_count, proposed_rule_count]
      properties:
        candidates:
          type: array
          items:
            type: object
            required: [document_number, title, type, publication_date, agencies]
            properties:
              document_number: { type: string }
              title: { type: string }
              type: { enum: [Rule, Proposed Rule] }
              publication_date: { type: string }
              agencies: { type: array, items: { type: [string, "null"] } }
        rule_count: { type: integer, minimum: 0 }
        proposed_rule_count: { type: integer, minimum: 0 }

  - id: triage
    instructions: |
      Run inputs:
      {{inputs}}

      Candidates found by the search:
      {{steps.search.candidates}}

      Decide for every candidate whether it matters to someone tracking the
      topic or agency in the inputs, and say why in at least 20 characters. A
      document matters when it creates, changes or proposes obligations in that
      area; routine or unrelated documents do not. Every candidate appears in
      decisions exactly once.
    produces:
      type: object
      required: [decisions]
      properties:
        decisions:
          type: array
          items:
            type: object
            required: [document_number, matters, reason]
            properties:
              document_number: { type: string }
              matters: { type: boolean }
              reason: { type: string, minLength: 20 }
    let:
      candidates: { map: [{ var: steps.search.candidates }, { var: document_number }] }
      decided: { map: [{ var: output.decisions }, { var: document_number }] }
    gates:
      - id: every-candidate-once
        message: Decide on every candidate document number exactly once, and invent none.
        predicate:
          and:
            - subset: [{ var: let.candidates }, { var: let.decided }]
            - subset: [{ var: let.decided }, { var: let.candidates }]
            - "==": [{ length: { unique: { var: let.decided } } }, { length: { var: let.decided } }]
      - id: something-matters
        message: When there are candidates, at least one must be judged to matter.
        predicate:
          or:
            - "==": [{ length: { var: let.candidates } }, 0]
            - ">": [{ length: { filter: [{ var: output.decisions }, { var: matters }] } }, 0]
    retries: 2

  - id: details
    do:
      calls:
        - id: documents
          operation: getDocuments
          each: { map: [{ filter: [{ var: steps.triage.decisions }, { var: matters }] }, { var: document_number }] }
          arguments: { document_number: { var: item } }
      output:
        details:
          map:
            - { var: responses.documents }
            - object:
                - [document_number, { var: document_number }]
                - [title, { var: title }]
                - [type, { var: type }]
                - [publication_date, { var: publication_date }]
                - [action, { var: action }]
                - [citation, { var: citation }]
                - [effective_on, { var: effective_on }]
                - [comments_close_on, { var: comments_close_on }]
    produces:
      type: object
      required: [details]
      properties:
        details:
          type: array
          items:
            type: object
            required: [document_number, title, type, publication_date, action, citation, effective_on, comments_close_on]
            properties:
              document_number: { type: string }
              title: { type: string }
              type: { enum: [Rule, Proposed Rule] }
              publication_date: { type: string }
              action: { type: [string, "null"] }
              citation: { type: [string, "null"] }
              effective_on: { type: [string, "null"] }
              comments_close_on: { type: [string, "null"] }

  - id: brief
    instructions: |
      Run inputs:
      {{inputs}}

      Documents judged to matter, with their details:
      {{steps.details.details}}

      The searches found {{steps.search.rule_count}} rules and
      {{steps.search.proposed_rule_count}} proposed rules in the window.

      Submit one assessment for every document in the details list, and no
      others, with its document_number, a priority (high, medium or low) and a
      one or two sentence why_it_matters.

      Then write summary, a Markdown brief with the sections "## Summary",
      "## Final rules", "## Proposed rules" and "## Key dates", in that order.
      Cite every document by its number (for example 2026-16628). Write every
      date as YYYY-MM-DD, and use only the run's start and end dates and the
      documents' publication, effective and comment-close dates. Write "None"
      in a section with nothing to list.
    produces:
      type: object
      required: [assessments, items, summary]
      properties:
        assessments:
          type: array
          items:
            type: object
            required: [document_number, priority, why_it_matters]
            properties:
              document_number: { type: string }
              priority: { enum: [high, medium, low] }
              why_it_matters: { type: string, minLength: 20, maxLength: 600 }
        items:
          type: array
          items:
            type: object
            required: [document_number, title, type, publication_date, effective_on, comments_close_on, priority, why_it_matters]
            properties:
              document_number: { type: string }
              title: { type: string }
              type: { enum: [Rule, Proposed Rule] }
              publication_date: { type: string }
              effective_on: { type: [string, "null"] }
              comments_close_on: { type: [string, "null"] }
              priority: { enum: [high, medium, low] }
              why_it_matters: { type: string }
        summary: { type: string, maxLength: 12000 }
    derive:
      items:
        map:
          - join: [{ var: output.assessments }, { var: steps.details.details }, document_number, document_number]
          - object:
              - [document_number, { var: left.document_number }]
              - [title, { var: right.title }]
              - [type, { var: right.type }]
              - [publication_date, { var: right.publication_date }]
              - [effective_on, { var: right.effective_on }]
              - [comments_close_on, { var: right.comments_close_on }]
              - [priority, { var: left.priority }]
              - [why_it_matters, { var: left.why_it_matters }]
    let:
      kept: { map: [{ var: steps.details.details }, { var: document_number }] }
      assessed: { map: [{ var: output.assessments }, { var: document_number }] }
      cited: { match_all: [{ var: output.summary }, "(?<![0-9-])([0-9]{4}-[0-9]{5})(?:[^0-9]|$)"] }
    gates:
      - id: sections-in-order
        schema:
          properties:
            summary:
              pattern: "## Summary[\\s\\S]*## Final rules[\\s\\S]*## Proposed rules[\\s\\S]*## Key dates"
      - id: assessments-are-the-kept-documents
        message: Submit one assessment for every document in the details, once each, and no others.
        predicate:
          and:
            - subset: [{ var: let.kept }, { var: let.assessed }]
            - subset: [{ var: let.assessed }, { var: let.kept }]
            - "==": [{ length: { unique: { var: let.assessed } } }, { length: { var: let.assessed } }]
      - id: citations-resolve
        message: The summary must cite every kept document by number, and cite no other document number.
        predicate:
          and:
            - subset: [{ var: let.cited }, { var: let.kept }]
            - subset: [{ var: let.kept }, { var: let.cited }]
      - id: dates-from-evidence
        message: Every YYYY-MM-DD date in the summary must be the run's start or end date or a kept document's publication, effective or comment-close date.
        predicate:
          subset:
            - { match_all: [{ var: output.summary }, "(?<![0-9-])([0-9]{4}-[0-9]{2}-[0-9]{2})(?:[^0-9-]|$)"] }
            - merge:
                - { var: inputs.start_date }
                - { var: inputs.end_date }
                - { map: [{ var: steps.details.details }, { var: publication_date }] }
                - { map: [{ var: steps.details.details }, { var: effective_on }] }
                - { map: [{ var: steps.details.details }, { var: comments_close_on }] }
    retries: 2
