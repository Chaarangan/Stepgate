# yaml-language-server: $schema=../../../server/schema/stepfile.schema.json
stepgate: "1"
id: sec-10k-ratio-extraction
title: Financial ratios from a company's latest 10-K
description: >
  Resolves a US-listed ticker to its SEC CIK, pulls revenue, net income, total
  assets, total liabilities, equity and operating cash flow from the XBRL facts
  of its latest annual 10-K, and computes ratios that gates recompute from the
  SEC figures.

inputs:
  type: object
  required: [ticker]
  properties:
    ticker:
      type: string
      pattern: "^[A-Z][A-Z0-9.-]{0,9}$"
      description: "Ticker in upper case as the SEC lists it, for example AAPL or BRK-B"

tools:
  # Two hosts, so two tools: full-text and company search, and the JSON data APIs.
  edgar-search:
    openapi:
      server: https://efts.sec.gov/LATEST
      document:
        openapi: 3.1.0
        info: { title: EDGAR full-text search (trimmed), version: "1" }
        paths:
          /search-index:
            get:
              operationId: searchEdgar
              summary: >
                EDGAR search. With keysTyped, finds companies by ticker or name: each
                hit's _id is the CIK and _source.tickers lists its tickers. With forms
                and ciks, lists that filer's filings of the form, newest first: each
                hit's _source has adsh (accession number), form, period_ending and
                file_date.
              parameters:
                - { name: keysTyped, in: query, description: Ticker or company name, schema: { type: string } }
                - { name: forms, in: query, schema: { enum: [10-K] } }
                - { name: ciks, in: query, description: 10-digit CIK with leading zeros, schema: { type: string, pattern: "^[0-9]{10}$" } }
    exposes: [searchEdgar]
  edgar-data:
    openapi:
      server: https://data.sec.gov
      document:
        openapi: 3.1.0
        info: { title: SEC EDGAR data APIs (trimmed), version: "1" }
        paths:
          /submissions/CIK{cik}.json:
            get:
              operationId: getSubmissions
              summary: Company record for a CIK, with cik, name, tickers, fiscalYearEnd and recent filings.
              parameters:
                - { name: cik, in: path, required: true, description: 10-digit CIK with leading zeros, schema: { type: string, pattern: "^[0-9]{10}$" } }
          /api/xbrl/companyconcept/CIK{cik}/us-gaap/{concept}.json:
            get:
              operationId: getConcept
              summary: >
                Every reported value of one us-gaap concept for a company, oldest
                first, under units.USD. Each entry has val, accn, fy, fp, form, end,
                and start for amounts over a period. Returns 404 when the company
                never reported the concept.
              parameters:
                - { name: cik, in: path, required: true, description: 10-digit CIK with leading zeros, schema: { type: string, pattern: "^[0-9]{10}$" } }
                - name: concept
                  in: path
                  required: true
                  schema:
                    enum:
                      - Assets
                      - Liabilities
                      - StockholdersEquity
                      - StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest
                      - Revenues
                      - RevenueFromContractWithCustomerExcludingAssessedTax
                      - RevenueFromContractWithCustomerIncludingAssessedTax
                      - NetIncomeLoss
                      - NetCashProvidedByUsedInOperatingActivities
              responses:
                "200": { description: The concept's values under units }
                "404": { description: The company never reported the concept }
    exposes: [getSubmissions, getConcept]

# A fact is picked from the concept's units.USD by a key of accession and period end (and, for amounts
# over a period, whether it spans 11 to 12 months), which join matches against the latest 10-K's.
steps:
  - id: resolve
    do:
      calls:
        - { id: company, operation: searchEdgar, arguments: { keysTyped: { var: inputs.ticker } } }
        - { id: submissions, operation: getSubmissions, arguments: { cik: { substr: [{ cat: ["0000000000", { var: responses.company.hits.hits.0._id }] }, -10] } } }
        - { id: filings, operation: searchEdgar, arguments: { ciks: { substr: [{ cat: ["0000000000", { var: responses.company.hits.hits.0._id }] }, -10] } } }
      output:
        cik: { substr: [{ cat: ["0000000000", { var: responses.company.hits.hits.0._id }] }, -10] }
        entity_name: { var: responses.submissions.name }
        sec_tickers: { var: responses.submissions.tickers }
        fiscal_year_end: { var: responses.submissions.fiscalYearEnd }
        # sort.0 is the filing date in epoch milliseconds, so the largest one is the newest 10-K.
        latest_10k:
          get:
            - map:
                - filter:
                    - join:
                        - filter: [{ var: responses.filings.hits.hits }, { "==": [{ var: _source.form }, 10-K] }]
                        - - object:
                              - - sort
                                - reduce:
                                    - map: [{ filter: [{ var: responses.filings.hits.hits }, { "==": [{ var: _source.form }, 10-K] }] }, { var: sort.0 }]
                                    - max: [{ var: accumulator }, { var: current }]
                                    - 0
                        - sort.0
                        - sort
                    - var: right
                - object: [[accn, { var: left._source.adsh }], [period_ending, { var: left._source.period_ending }], [filed, { var: left._source.file_date }]]
            - 0
    produces:
      type: object
      required: [cik, entity_name, sec_tickers, fiscal_year_end, latest_10k]
      properties:
        cik: { type: string, pattern: "^[0-9]{10}$" }
        entity_name: { type: string }
        sec_tickers: { type: array, items: { type: string } }
        fiscal_year_end: { type: [string, "null"] }
        latest_10k:
          type: object
          required: [accn, period_ending, filed]
          properties:
            accn: { type: string, pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$" }
            period_ending: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
            filed: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
    gates:
      # Stepgate takes the first company hit, so the run stops if the SEC does not list the ticker for it.
      - id: ticker-belongs-to-filer
        message: The first EDGAR company hit must be a filer the SEC lists the input ticker for.
        predicate:
          in: [{ var: inputs.ticker }, { var: output.sec_tickers }]

  - id: balance-sheet
    do:
      calls:
        - { id: assets, operation: getConcept, arguments: { cik: { var: steps.resolve.cik }, concept: Assets } }
        - { id: liabilities, operation: getConcept, arguments: { cik: { var: steps.resolve.cik }, concept: Liabilities }, accept: [404] }
        - { id: equity, operation: getConcept, arguments: { cik: { var: steps.resolve.cik }, concept: StockholdersEquity }, accept: [404] }
        - { id: equity-nci, operation: getConcept, arguments: { cik: { var: steps.resolve.cik }, concept: StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest }, accept: [404] }
      output:
        total_assets:
          get:
            - map:
                - filter:
                    - join:
                        - map: [{ var: responses.assets.units.USD }, { object: [[key, { cat: [{ var: accn }, " ", { var: end }] }], [entry, { var: "" }]] }]
                        - [{ object: [[key, { cat: [{ var: steps.resolve.latest_10k.accn }, " ", { var: steps.resolve.latest_10k.period_ending }] }]] }]
                        - key
                        - key
                    - var: right
                - object: [[concept, Assets], [value, { var: left.entry.val }], [accn, { var: left.entry.accn }], [end, { var: left.entry.end }], [fy, { var: left.entry.fy }], [fp, { var: left.entry.fp }], [form, { var: left.entry.form }]]
            - 0
        total_equity:
          or:
            - get:
                - map:
                    - filter:
                        - join:
                            - map: [{ var: responses.equity.units.USD }, { object: [[key, { cat: [{ var: accn }, " ", { var: end }] }], [entry, { var: "" }]] }]
                            - [{ object: [[key, { cat: [{ var: steps.resolve.latest_10k.accn }, " ", { var: steps.resolve.latest_10k.period_ending }] }]] }]
                            - key
                            - key
                        - var: right
                    - object: [[concept, StockholdersEquity], [value, { var: left.entry.val }], [accn, { var: left.entry.accn }], [end, { var: left.entry.end }], [fy, { var: left.entry.fy }], [fp, { var: left.entry.fp }], [form, { var: left.entry.form }]]
                - 0
            - get:
                - map:
                    - filter:
                        - join:
                            - map: [{ var: responses.equity-nci.units.USD }, { object: [[key, { cat: [{ var: accn }, " ", { var: end }] }], [entry, { var: "" }]] }]
                            - [{ object: [[key, { cat: [{ var: steps.resolve.latest_10k.accn }, " ", { var: steps.resolve.latest_10k.period_ending }] }]] }]
                            - key
                            - key
                        - var: right
                    - object: [[concept, StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest], [value, { var: left.entry.val }], [accn, { var: left.entry.accn }], [end, { var: left.entry.end }], [fy, { var: left.entry.fy }], [fp, { var: left.entry.fp }], [form, { var: left.entry.form }]]
                - 0
        liabilities_filed: { "!!": [{ var: responses.liabilities.units }] }
        reported_liabilities:
          get:
            - map:
                - filter:
                    - join:
                        - map: [{ var: responses.liabilities.units.USD }, { object: [[key, { cat: [{ var: accn }, " ", { var: end }] }], [entry, { var: "" }]] }]
                        - [{ object: [[key, { cat: [{ var: steps.resolve.latest_10k.accn }, " ", { var: steps.resolve.latest_10k.period_ending }] }]] }]
                        - key
                        - key
                    - var: right
                - object: [[concept, Liabilities], [value, { var: left.entry.val }], [accn, { var: left.entry.accn }], [end, { var: left.entry.end }], [fy, { var: left.entry.fy }], [fp, { var: left.entry.fp }], [form, { var: left.entry.form }]]
            - 0
    produces:
      type: object
      required: [total_assets, total_equity, liabilities_filed, reported_liabilities]
      properties:
        total_assets:
          allOf: [{ $ref: "#/$defs/instant_fact" }, { properties: { concept: { const: Assets } } }]
        total_equity:
          allOf:
            - $ref: "#/$defs/instant_fact"
            - properties:
                concept: { enum: [StockholdersEquity, StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest] }
        liabilities_filed: { type: boolean }
        reported_liabilities:
          anyOf:
            - { type: "null" }
            - allOf: [{ $ref: "#/$defs/instant_fact" }, { properties: { concept: { const: Liabilities } } }]
    gates:
      # Total liabilities is derived only when the SEC has no Liabilities concept for the company.
      - id: liabilities-in-filing
        message: The company reports Liabilities, but not for the latest 10-K at its period end.
        predicate:
          or: [{ "!": { var: output.liabilities_filed } }, { "!!": [{ var: output.reported_liabilities }] }]

  - id: performance
    do:
      calls:
        - { id: revenue-excl, operation: getConcept, arguments: { cik: { var: steps.resolve.cik }, concept: RevenueFromContractWithCustomerExcludingAssessedTax }, accept: [404] }
        - { id: revenues, operation: getConcept, arguments: { cik: { var: steps.resolve.cik }, concept: Revenues }, accept: [404] }
        - { id: revenue-incl, operation: getConcept, arguments: { cik: { var: steps.resolve.cik }, concept: RevenueFromContractWithCustomerIncludingAssessedTax }, accept: [404] }
        - { id: net-income, operation: getConcept, arguments: { cik: { var: steps.resolve.cik }, concept: NetIncomeLoss } }
        - { id: cash-flow, operation: getConcept, arguments: { cik: { var: steps.resolve.cik }, concept: NetCashProvidedByUsedInOperatingActivities } }
      output:
        revenue:
          or:
            - get:
                - map:
                    - filter:
                        - join:
                            - map: [{ var: responses.revenue-excl.units.USD }, { object: [[key, { cat: [{ var: accn }, " ", { var: end }, " ", { "<=": [11, { "+": [{ "*": [{ "-": [{ substr: [{ var: end }, 0, 4] }, { substr: [{ var: start }, 0, 4] }] }, 12] }, { "-": [{ substr: [{ var: end }, 5, 2] }, { substr: [{ var: start }, 5, 2] }] }] }, 12] }] }], [entry, { var: "" }]] }]
                            - [{ object: [[key, { cat: [{ var: steps.resolve.latest_10k.accn }, " ", { var: steps.resolve.latest_10k.period_ending }, " true"] }]] }]
                            - key
                            - key
                        - var: right
                    - object: [[concept, RevenueFromContractWithCustomerExcludingAssessedTax], [value, { var: left.entry.val }], [accn, { var: left.entry.accn }], [start, { var: left.entry.start }], [end, { var: left.entry.end }], [fy, { var: left.entry.fy }], [fp, { var: left.entry.fp }], [form, { var: left.entry.form }]]
                - 0
            - get:
                - map:
                    - filter:
                        - join:
                            - map: [{ var: responses.revenues.units.USD }, { object: [[key, { cat: [{ var: accn }, " ", { var: end }, " ", { "<=": [11, { "+": [{ "*": [{ "-": [{ substr: [{ var: end }, 0, 4] }, { substr: [{ var: start }, 0, 4] }] }, 12] }, { "-": [{ substr: [{ var: end }, 5, 2] }, { substr: [{ var: start }, 5, 2] }] }] }, 12] }] }], [entry, { var: "" }]] }]
                            - [{ object: [[key, { cat: [{ var: steps.resolve.latest_10k.accn }, " ", { var: steps.resolve.latest_10k.period_ending }, " true"] }]] }]
                            - key
                            - key
                        - var: right
                    - object: [[concept, Revenues], [value, { var: left.entry.val }], [accn, { var: left.entry.accn }], [start, { var: left.entry.start }], [end, { var: left.entry.end }], [fy, { var: left.entry.fy }], [fp, { var: left.entry.fp }], [form, { var: left.entry.form }]]
                - 0
            - get:
                - map:
                    - filter:
                        - join:
                            - map: [{ var: responses.revenue-incl.units.USD }, { object: [[key, { cat: [{ var: accn }, " ", { var: end }, " ", { "<=": [11, { "+": [{ "*": [{ "-": [{ substr: [{ var: end }, 0, 4] }, { substr: [{ var: start }, 0, 4] }] }, 12] }, { "-": [{ substr: [{ var: end }, 5, 2] }, { substr: [{ var: start }, 5, 2] }] }] }, 12] }] }], [entry, { var: "" }]] }]
                            - [{ object: [[key, { cat: [{ var: steps.resolve.latest_10k.accn }, " ", { var: steps.resolve.latest_10k.period_ending }, " true"] }]] }]
                            - key
                            - key
                        - var: right
                    - object: [[concept, RevenueFromContractWithCustomerIncludingAssessedTax], [value, { var: left.entry.val }], [accn, { var: left.entry.accn }], [start, { var: left.entry.start }], [end, { var: left.entry.end }], [fy, { var: left.entry.fy }], [fp, { var: left.entry.fp }], [form, { var: left.entry.form }]]
                - 0
        net_income:
          get:
            - map:
                - filter:
                    - join:
                        - map: [{ var: responses.net-income.units.USD }, { object: [[key, { cat: [{ var: accn }, " ", { var: end }, " ", { "<=": [11, { "+": [{ "*": [{ "-": [{ substr: [{ var: end }, 0, 4] }, { substr: [{ var: start }, 0, 4] }] }, 12] }, { "-": [{ substr: [{ var: end }, 5, 2] }, { substr: [{ var: start }, 5, 2] }] }] }, 12] }] }], [entry, { var: "" }]] }]
                        - [{ object: [[key, { cat: [{ var: steps.resolve.latest_10k.accn }, " ", { var: steps.resolve.latest_10k.period_ending }, " true"] }]] }]
                        - key
                        - key
                    - var: right
                - object: [[concept, NetIncomeLoss], [value, { var: left.entry.val }], [accn, { var: left.entry.accn }], [start, { var: left.entry.start }], [end, { var: left.entry.end }], [fy, { var: left.entry.fy }], [fp, { var: left.entry.fp }], [form, { var: left.entry.form }]]
            - 0
        operating_cash_flow:
          get:
            - map:
                - filter:
                    - join:
                        - map: [{ var: responses.cash-flow.units.USD }, { object: [[key, { cat: [{ var: accn }, " ", { var: end }, " ", { "<=": [11, { "+": [{ "*": [{ "-": [{ substr: [{ var: end }, 0, 4] }, { substr: [{ var: start }, 0, 4] }] }, 12] }, { "-": [{ substr: [{ var: end }, 5, 2] }, { substr: [{ var: start }, 5, 2] }] }] }, 12] }] }], [entry, { var: "" }]] }]
                        - [{ object: [[key, { cat: [{ var: steps.resolve.latest_10k.accn }, " ", { var: steps.resolve.latest_10k.period_ending }, " true"] }]] }]
                        - key
                        - key
                    - var: right
                - object: [[concept, NetCashProvidedByUsedInOperatingActivities], [value, { var: left.entry.val }], [accn, { var: left.entry.accn }], [start, { var: left.entry.start }], [end, { var: left.entry.end }], [fy, { var: left.entry.fy }], [fp, { var: left.entry.fp }], [form, { var: left.entry.form }]]
            - 0
    produces:
      type: object
      required: [revenue, net_income, operating_cash_flow]
      properties:
        revenue:
          allOf:
            - $ref: "#/$defs/duration_fact"
            - properties:
                concept: { enum: [RevenueFromContractWithCustomerExcludingAssessedTax, Revenues, RevenueFromContractWithCustomerIncludingAssessedTax] }
        net_income:
          allOf: [{ $ref: "#/$defs/duration_fact" }, { properties: { concept: { const: NetIncomeLoss } } }]
        operating_cash_flow:
          allOf: [{ $ref: "#/$defs/duration_fact" }, { properties: { concept: { const: NetCashProvidedByUsedInOperatingActivities } } }]

  - id: ratios
    do:
      output:
        total_liabilities:
          if:
            - var: steps.balance-sheet.reported_liabilities
            - object: [[method, reported], [value, { var: steps.balance-sheet.reported_liabilities.value }]]
            - object: [[method, derived], [value, { "-": [{ var: steps.balance-sheet.total_assets.value }, { var: steps.balance-sheet.total_equity.value }] }]]
        fiscal_year: { var: steps.balance-sheet.total_assets.fy }
        ratios:
          net_margin: { "/": [{ var: steps.performance.net_income.value }, { var: steps.performance.revenue.value }] }
          return_on_assets: { "/": [{ var: steps.performance.net_income.value }, { var: steps.balance-sheet.total_assets.value }] }
          liabilities_to_assets:
            "/":
              - if: [{ var: steps.balance-sheet.reported_liabilities }, { var: steps.balance-sheet.reported_liabilities.value }, { "-": [{ var: steps.balance-sheet.total_assets.value }, { var: steps.balance-sheet.total_equity.value }] }]
              - var: steps.balance-sheet.total_assets.value
          liabilities_to_equity:
            "/":
              - if: [{ var: steps.balance-sheet.reported_liabilities }, { var: steps.balance-sheet.reported_liabilities.value }, { "-": [{ var: steps.balance-sheet.total_assets.value }, { var: steps.balance-sheet.total_equity.value }] }]
              - var: steps.balance-sheet.total_equity.value
          operating_cash_flow_to_net_income: { "/": [{ var: steps.performance.operating_cash_flow.value }, { var: steps.performance.net_income.value }] }
    produces:
      type: object
      required: [total_liabilities, fiscal_year, ratios]
      properties:
        total_liabilities:
          type: object
          required: [method, value]
          properties:
            method: { enum: [reported, derived] }
            value: { type: number }
        fiscal_year: { type: integer }
        ratios:
          type: object
          required: [net_margin, return_on_assets, liabilities_to_assets, liabilities_to_equity, operating_cash_flow_to_net_income]
          properties:
            net_margin: { type: number }
            return_on_assets: { type: number }
            liabilities_to_assets: { type: number }
            liabilities_to_equity: { type: number }
            operating_cash_flow_to_net_income: { type: number }

  - id: report
    instructions: |
      Company: {{steps.resolve.entity_name}} ({{inputs.ticker}}), CIK {{steps.resolve.cik}}.
      Latest 10-K: accession {{steps.resolve.latest_10k.accn}}, period ending
      {{steps.resolve.latest_10k.period_ending}}, filed {{steps.resolve.latest_10k.filed}}.

      Balance sheet facts:
      {{steps.balance-sheet}}

      Income and cash flow facts:
      {{steps.performance}}

      Total liabilities, fiscal year and ratios:
      {{steps.ratios}}

      Write summary, a Markdown report with the sections "## Company",
      "## Figures", "## Ratios" and "## Source", in that order. Figures lists
      total assets, total liabilities, total equity, revenue, net income and
      operating cash flow in US dollars as plain integers without commas (for
      example 359241000000). Ratios gives the ratios above as decimals. Source
      cites the accession number. Write dates as YYYY-MM-DD and use only the
      period ending, the filing date and the fiscal year's start date. Give no
      other figures and no forecast.
    produces:
      type: object
      required: [summary]
      properties:
        summary: { type: string, maxLength: 8000 }
    let:
      # Plain integers of seven or more digits, so an invented or altered dollar figure cannot hide behind formatting.
      stated: { match_all: [{ var: output.summary }, "(?<![0-9.-])(-?[0-9]{7,})(?:[^0-9-]|$)"] }
      figures:
        map:
          - - { var: steps.balance-sheet.total_assets.value }
            - { var: steps.ratios.total_liabilities.value }
            - { var: steps.balance-sheet.total_equity.value }
            - { var: steps.performance.revenue.value }
            - { var: steps.performance.net_income.value }
            - { var: steps.performance.operating_cash_flow.value }
          - cat: [{ var: "" }]
    gates:
      - id: sections-in-order
        schema:
          properties:
            summary:
              pattern: "## Company[\\s\\S]*## Figures[\\s\\S]*## Ratios[\\s\\S]*## Source"
      - id: summary-cites-filing
        message: The summary must name the company and cite the 10-K accession number, and no other accession number.
        predicate:
          and:
            - in: [{ var: steps.resolve.entity_name }, { var: output.summary }]
            - in: [{ var: steps.resolve.latest_10k.accn }, { var: output.summary }]
            - subset:
                - { match_all: [{ var: output.summary }, "[0-9]{10}-[0-9]{2}-[0-9]{6}"] }
                - [{ var: steps.resolve.latest_10k.accn }]
      - id: figures-from-sec
        message: The summary must state all six figures as plain integers, and every integer of seven or more digits in it must be one of those figures or the CIK.
        predicate:
          and:
            - subset: [{ var: let.figures }, { var: let.stated }]
            - subset: [{ var: let.stated }, { merge: [{ var: let.figures }, [{ var: steps.resolve.cik }]] }]
      - id: dates-from-sec
        message: Every YYYY-MM-DD date in the summary must be the period end, the filing date or the fiscal year's start date.
        predicate:
          subset:
            - { match_all: [{ var: output.summary }, "(?<![0-9-])([0-9]{4}-[0-9]{2}-[0-9]{2})(?:[^0-9-]|$)"] }
            - - { var: steps.resolve.latest_10k.period_ending }
              - { var: steps.resolve.latest_10k.filed }
              - { var: steps.performance.revenue.start }
    retries: 2

$defs:
  instant_fact:
    type: object
    required: [concept, value, accn, end, fy, fp, form]
    properties:
      concept: { type: string }
      value: { type: number }
      accn: { type: string }
      end: { type: string }
      fy: { type: integer }
      fp: { const: FY }
      form: { const: 10-K }
  duration_fact:
    type: object
    required: [concept, value, accn, start, end, fy, fp, form]
    properties:
      concept: { type: string }
      value: { type: number }
      accn: { type: string }
      start: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
      end: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
      fy: { type: integer }
      fp: { const: FY }
      form: { const: 10-K }
