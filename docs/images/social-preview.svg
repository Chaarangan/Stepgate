<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Stepgate</title>
  <desc id="desc">Agents can't skip steps. Four steps in a row, each followed by a gate that passes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="186" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-2">Stepgate</text>
    <rect x="570" y="212" width="140" height="7" rx="3.5" fill="url(#accent)"/>
    <text x="640" y="280" font-size="38" font-weight="600" fill="#e6edf3">Agents can't skip steps.</text>
    <text x="640" y="324" font-size="24" fill="#8b949e">Gated YAML stepfiles for any MCP client.</text>
  </g>

  <g transform="translate(-836 210) scale(1.5)">
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600">
    <line x1="768" y1="160" x2="1200" y2="160" stroke="#30363d" stroke-width="3"/>
    <line x1="768" y1="160" x2="1200" y2="160" stroke="url(#accent)" stroke-width="3" stroke-dasharray="6 8"/>

    <g transform="translate(768 160)">
      <rect x="-38" y="-38" width="76" height="76" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text y="6" text-anchor="middle" fill="#58a6ff">01</text>
      <text y="68" text-anchor="middle" fill="#8b949e" font-weight="400">search</text>
    </g>
    <g transform="translate(840 160)">
      <circle r="16" fill="#0b1020" stroke="#3fb950" stroke-width="2"/>
      <path d="M-7 0l5 5 9-10" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(912 160)">
      <rect x="-38" y="-38" width="76" height="76" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text y="6" text-anchor="middle" fill="#58a6ff">02</text>
      <text y="68" text-anchor="middle" fill="#8b949e" font-weight="400">filter</text>
    </g>
    <g transform="translate(984 160)">
      <circle r="16" fill="#0b1020" stroke="#3fb950" stroke-width="2"/>
      <path d="M-7 0l5 5 9-10" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(1056 160)">
      <rect x="-38" y="-38" width="76" height="76" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text y="6" text-anchor="middle" fill="#58a6ff">03</text>
      <text y="68" text-anchor="middle" fill="#8b949e" font-weight="400">analyse</text>
    </g>
    <g transform="translate(1128 160)">
      <circle r="16" fill="#0b1020" stroke="#3fb950" stroke-width="2"/>
      <path d="M-7 0l5 5 9-10" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(1200 160)">
      <rect x="-38" y="-38" width="76" height="76" rx="14" fill="#161b22"/>
      <rect x="-38" y="-38" width="76" height="76" rx="14" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-width="2"/>
      <text y="6" text-anchor="middle" fill="#3fb950">04</text>
      <text y="68" text-anchor="middle" fill="#8b949e" font-weight="400">report</text>
    </g>
  </g>
  </g>
</svg>
