# yaml-language-server: $schema=../../../server/schema/stepfile.schema.json
stepgate: "1"
id: snowflake-metric-to-jira
title: Check a Snowflake metric against a threshold and open a draft Jira issue on breach
description: >
  Runs one fixed, read-only SELECT you supply against Snowflake through the SQL API, checks the metric
  it returns against your threshold, and only when the threshold is breached creates a Jira issue
  labelled stepgate-draft that quotes the exact values returned and the exact SQL.

inputs:
  type: object
  required: [sql, metric_name, metric_column, threshold, breach_when, warehouse, role, jira_project, jira_issue_type]
  additionalProperties: false
  properties:
    # A single SELECT or WITH query: no semicolon except one at the very end.
    sql:
      type: string
      maxLength: 10000
      pattern: "^\\s*([Ss][Ee][Ll][Ee][Cc][Tt]|[Ww][Ii][Tt][Hh])\\s[^;]*;?\\s*$"
      description: "One read-only SELECT (or WITH ... SELECT) statement returning exactly one row"
    metric_name: { type: string, pattern: "^\\S(.{0,78}\\S)?$", description: "Human name of the metric, for example Checkout error rate" }
    metric_column: { type: string, pattern: "^[^\\s\"]{1,255}$", description: "Result column holding the metric, as Snowflake names it (unquoted identifiers are upper case), for example ERROR_RATE" }
    threshold: { type: number, description: "The limit the metric is compared with" }
    breach_when: { enum: [above, below], description: "above: breached when the metric is greater than threshold; below: when it is less" }
    warehouse: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_$]{0,254}$", description: "Warehouse to run the query in" }
    role: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_$]{0,254}$", description: "Role to run the query as; use one that can only read" }
    jira_project: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,9}$", description: "Jira project key for the issue, for example DATA" }
    jira_issue_type: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9 _-]{0,58}[A-Za-z0-9]$", description: "Issue type name, for example Task" }

settings:
  snowflake-account:
    description: >
      Your Snowflake account identifier as it appears in your account URL, in lower case, the
      "myorg-myaccount" in myorg-myaccount.snowflakecomputing.com.
    pattern: "^[a-z0-9]+([._-][a-z0-9]+)*$"
  jira-site:
    description: Your Atlassian site name, the "acme" in acme.atlassian.net.

credentials:
  snowflake:
    kind: bearer
    hosts: ["{snowflake-account}.snowflakecomputing.com"]
    description: >
      A Snowflake programmatic access token (the token secret) for a user whose role can only read the
      tables the query uses and use the warehouse. Runs the one SELECT given as input.
  jira:
    kind: basic
    hosts: ["{jira-site}.atlassian.net"]
    description: >
      An Atlassian account email and an API token created without scopes, as you@example.com:API_TOKEN.
      The account needs Browse projects and Create issues in the target project. Creates at most one
      issue, labelled stepgate-draft, and only when the threshold is breached.

tools:
  snowflake:
    openapi:
      server: https://{snowflake-account}.snowflakecomputing.com/api/v2
      document:
        openapi: 3.1.0
        info: { title: Snowflake SQL API v2 (trimmed), version: "2" }
        paths:
          /statements:
            post:
              operationId: executeStatement
              summary: >
                Run one SQL statement synchronously. On success returns code "090001", statementHandle,
                resultSetMetaData (numRows, rowType with each column's name and type) and data, an array
                of rows in which every value is a string or null.
              parameters:
                - name: X-Snowflake-Authorization-Token-Type
                  in: header
                  required: true
                  schema: { type: string, enum: [PROGRAMMATIC_ACCESS_TOKEN] }
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required: [statement, warehouse, role]
                      additionalProperties: false
                      properties:
                        statement: { type: string, minLength: 1, maxLength: 10000 }
                        warehouse: { type: string, minLength: 1 }
                        role: { type: string, minLength: 1 }
              responses:
                "200": { description: "A ResultSet" }
                "202": { description: "Still running; a QueryStatus with a statement handle" }
                "422": { description: "The statement failed; a QueryFailureStatus" }
    credential: snowflake
    exposes: [executeStatement]

  jira-cloud:
    openapi:
      server: https://{jira-site}.atlassian.net/rest/api/3
      document:
        openapi: 3.1.0
        info: { title: Jira Cloud platform REST API v3 (trimmed), version: "3" }
        paths:
          /issue:
            post:
              operationId: createJiraIssue
              summary: >
                Create one Jira issue. The description is Atlassian Document Format: one paragraph with
                one text node, then one code block with one text node. Returns id, key and self.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required: [fields]
                      additionalProperties: false
                      properties:
                        fields:
                          type: object
                          required: [project, issuetype, summary, labels, description]
                          additionalProperties: false
                          properties:
                            project:
                              type: object
                              required: [key]
                              additionalProperties: false
                              properties:
                                key: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,9}$" }
                            issuetype:
                              type: object
                              required: [name]
                              additionalProperties: false
                              properties:
                                name: { type: string, minLength: 1, maxLength: 60 }
                            summary: { type: string, minLength: 1, maxLength: 255 }
                            labels: { const: [stepgate-draft] }
                            description:
                              type: object
                              required: [type, version, content]
                              additionalProperties: false
                              properties:
                                type: { const: doc }
                                version: { const: 1 }
                                content:
                                  type: array
                                  minItems: 2
                                  maxItems: 2
                                  prefixItems:
                                    - type: object
                                      required: [type, content]
                                      additionalProperties: false
                                      properties:
                                        type: { const: paragraph }
                                        content:
                                          type: array
                                          minItems: 1
                                          maxItems: 1
                                          items:
                                            type: object
                                            required: [type, text]
                                            additionalProperties: false
                                            properties:
                                              type: { const: text }
                                              text: { type: string, minLength: 1, maxLength: 4000, pattern: "^[^\\n]*$" }
                                    - type: object
                                      required: [type, content]
                                      additionalProperties: false
                                      properties:
                                        type: { const: codeBlock }
                                        content:
                                          type: array
                                          minItems: 1
                                          maxItems: 1
                                          items:
                                            type: object
                                            required: [type, text]
                                            additionalProperties: false
                                            properties:
                                              type: { const: text }
                                              text: { type: string, minLength: 1, maxLength: 10000 }
              responses:
                "201": { description: "id, key and self of the created issue" }
    credential: jira
    exposes: [createJiraIssue]

steps:
  - id: query
    tools: [executeStatement]
    instructions: |
      Run this SQL statement in Snowflake by calling executeStatement exactly once, with body
      {"statement": SQL, "warehouse": "{{inputs.warehouse}}", "role": "{{inputs.role}}"}, where SQL is
      the text between the markers below copied character for character, including any whitespace and
      trailing semicolon. Do not edit, reformat or complete it, and do not run any other statement.

      ----- SQL START -----
      {{inputs.sql}}
      ----- SQL END -----

      From the response submit:
      - statement_handle: statementHandle;
      - num_rows: resultSetMetaData.numRows;
      - columns: the name of every entry in resultSetMetaData.rowType, in order;
      - column_index: the 0-based position in rowType of the column named exactly "{{inputs.metric_column}}";
      - row: the first row of data, every value exactly as returned (strings, or null);
      - metric_raw: the value at column_index in that row, exactly as returned;
      - metric_value: metric_raw as a number.

      Do not call the tool a second time, even if a gate rejects your submission.
    produces:
      type: object
      required: [statement_handle, num_rows, columns, column_index, row, metric_raw, metric_value]
      additionalProperties: false
      properties:
        statement_handle: { type: string, minLength: 1 }
        num_rows: { type: integer }
        columns: { type: array, items: { type: string } }
        column_index: { type: integer, minimum: 0 }
        row: { type: array, items: { type: [string, "null"] } }
        metric_raw: { type: string, minLength: 1 }
        metric_value: { type: number }
    gates:
      - id: sql-is-single-select
        message: >
          The input sql must be one SELECT or WITH statement, with no semicolon except one optional
          semicolon at the very end.
        predicate:
          and:
            - "==": [{ length: { match_all: [{ lower: { var: inputs.sql } }, "^\\s*(select|with)\\s"] } }, 1]
            - or:
                - "==": [{ length: { match_all: [{ var: inputs.sql }, ";"] } }, 0]
                - and:
                    - "==": [{ length: { match_all: [{ var: inputs.sql }, ";"] } }, 1]
                    - "==": [{ length: { match_all: [{ var: inputs.sql }, ";\\s*$"] } }, 1]
      - id: executed-input-sql
        message: >
          Make exactly one successful executeStatement call whose statement is the input sql character
          for character, with the input warehouse and role.
        predicate:
          and:
            - "==": [{ length: { var: calls } }, 1]
            - "!": { var: calls.0.is_error }
            - "===": [{ var: calls.0.arguments.body.statement }, { var: inputs.sql }]
            - "===": [{ var: calls.0.arguments.body.warehouse }, { var: inputs.warehouse }]
            - "===": [{ var: calls.0.arguments.body.role }, { var: inputs.role }]
      - id: one-complete-row
        message: >
          The statement must have finished (code 090001) and returned exactly one row with distinct
          column names; statement_handle, num_rows and columns must be copied from the response.
        predicate:
          and:
            - "===": [{ var: calls.0.result.code }, "090001"]
            - "===": [{ var: calls.0.result.resultSetMetaData.numRows }, 1]
            - "==": [{ length: { var: calls.0.result.data } }, 1]
            - "===": [{ var: output.statement_handle }, { var: calls.0.result.statementHandle }]
            - "===": [{ var: output.num_rows }, { var: calls.0.result.resultSetMetaData.numRows }]
            - "==": [{ length: { var: output.columns } }, { length: { var: calls.0.result.resultSetMetaData.rowType } }]
            - "===":
                - reduce: [{ var: output.columns }, { cat: [{ var: accumulator }, "\u001f", { var: current }] }, ""]
                - reduce: [{ var: calls.0.result.resultSetMetaData.rowType }, { cat: [{ var: accumulator }, "\u001f", { var: current.name }] }, ""]
            - "==": [{ length: { unique: { var: output.columns } } }, { length: { var: output.columns } }]
      # "\u001f" (unit separator) joins the values so a value cannot pose as two; the null check keeps SQL NULL apart from the text "null".
      - id: row-copied
        message: row must be the first data row exactly as returned, with null where the response has null.
        predicate:
          and:
            - "==": [{ length: { var: output.row } }, { length: { var: calls.0.result.data.0 } }]
            - "===":
                - reduce: [{ var: output.row }, { cat: [{ var: accumulator }, "\u001f", { if: [{ "===": [{ var: current }, null] }, "\u001eNULL", { var: current }] }] }, ""]
                - reduce: [{ var: calls.0.result.data.0 }, { cat: [{ var: accumulator }, "\u001f", { if: [{ "===": [{ var: current }, null] }, "\u001eNULL", { var: current }] }] }, ""]
      - id: metric-from-result
        message: >
          column_index must point at the column named exactly metric_column; metric_raw must be that
          value in the returned row, a plain decimal number (not null or text), and metric_value must
          equal it as a number.
        predicate:
          and:
            - "===": [{ var: [{ cat: ["calls.0.result.resultSetMetaData.rowType.", { var: output.column_index }, ".name"] }] }, { var: inputs.metric_column }]
            - "==": [{ length: { match_all: [{ var: output.metric_raw }, "^-?[0-9]+(\\.[0-9]+)?([eE][-+]?[0-9]+)?$"] } }, 1]
            - "===": [{ var: [{ cat: ["calls.0.result.data.0.", { var: output.column_index }] }] }, { var: output.metric_raw }]
            - "===": [{ "+": [{ var: output.metric_raw }] }, { var: output.metric_value }]
    retries: 2

  - id: plan
    instructions: |
      The metric "{{inputs.metric_name}}" (column {{inputs.metric_column}}) came back from Snowflake as
      {{steps.query.metric_raw}}. The threshold is {{inputs.threshold}} and the metric is breached when
      it is {{inputs.breach_when}} the threshold (strictly greater for above, strictly less for below).

      Set breached to true or false by that rule.

      If breached, plan exactly one Jira issue in create: project_key "{{inputs.jira_project}}",
      issue_type "{{inputs.jira_issue_type}}", summary "{{inputs.metric_name}} breached: {{steps.query.metric_raw}}"
      and description, one line of plain text with no line breaks. It starts with exactly
      "{{inputs.metric_name}} ({{inputs.metric_column}}) returned {{steps.query.metric_raw}}, {{inputs.breach_when}} the threshold {{inputs.threshold}}. "
      and goes on to name the Snowflake statement handle {{steps.query.statement_handle}} and every
      value of the returned row exactly as returned, labelled with its column name. The columns and
      row are:

      {{steps.query.columns}}
      {{steps.query.row}}

      The SQL itself is attached to the issue as a code block by the next step, so do not repeat it in
      the description. If not breached, set create to null.
    produces:
      type: object
      required: [breached, create]
      additionalProperties: false
      properties:
        breached: { type: boolean }
        create:
          oneOf:
            - type: "null"
            - type: object
              required: [project_key, issue_type, summary, description]
              additionalProperties: false
              properties:
                project_key: { type: string }
                issue_type: { type: string }
                summary: { type: string, minLength: 1, maxLength: 255 }
                description: { type: string, minLength: 1, maxLength: 4000, pattern: "^[^\\n]*$" }
    gates:
      - id: breach-recomputed
        message: breached must follow the rule applied to metric_raw and the input threshold.
        predicate:
          "===":
            - var: output.breached
            - if:
                - "==": [{ var: inputs.breach_when }, above]
                - ">": [{ "+": [{ var: steps.query.metric_raw }] }, { var: inputs.threshold }]
                - "<": [{ "+": [{ var: steps.query.metric_raw }] }, { var: inputs.threshold }]
      - id: issue-only-on-breach
        message: create must be set when breached and null when not.
        predicate:
          "===": [{ var: output.breached }, { "!=": [{ var: output.create }, null] }]
      - id: issue-fields
        message: >
          The planned issue must use the input project key and issue type and the summary
          "<metric_name> breached: <metric_raw>".
        predicate:
          or:
            - "==": [{ var: output.create }, null]
            - and:
                - "===": [{ var: output.create.project_key }, { var: inputs.jira_project }]
                - "===": [{ var: output.create.issue_type }, { var: inputs.jira_issue_type }]
                - "===": [{ var: output.create.summary }, { cat: [{ var: inputs.metric_name }, " breached: ", { var: steps.query.metric_raw }] }]
      # The accumulator stays the description while every non-null row value appears in it, and becomes "" at the first that does not.
      - id: description-quotes-numbers
        message: >
          The description must start "<metric_name> (<metric_column>) returned <metric_raw>,
          <breach_when> the threshold <threshold>. " and quote the statement handle and every non-null
          value of the returned row exactly as returned.
        predicate:
          or:
            - "==": [{ var: output.create }, null]
            - and:
                - "===":
                    - substr: [{ var: output.create.description }, 0, { length: &opening { cat: [{ var: inputs.metric_name }, " (", { var: inputs.metric_column }, ") returned ", { var: steps.query.metric_raw }, ", ", { var: inputs.breach_when }, " the threshold ", { var: inputs.threshold }, ". "] } }]
                    - *opening
                - in: [{ var: steps.query.statement_handle }, { var: output.create.description }]
                - "===":
                    - reduce:
                        - var: steps.query.row
                        - if:
                            - or: [{ "===": [{ var: current }, null] }, { in: [{ var: current }, { var: accumulator }] }]
                            - var: accumulator
                            - ""
                        - var: output.create.description
                    - var: output.create.description
    retries: 2

  - id: execute
    tools: [createJiraIssue]
    instructions: |
      The planned write is:

      {{steps.plan.create}}

      If it is null, call no tool and submit jira_key null.

      Otherwise call createJiraIssue exactly once with body
      {"fields": {"project": {"key": project_key}, "issuetype": {"name": issue_type}, "summary": summary,
      "labels": ["stepgate-draft"], "description": {"type": "doc", "version": 1, "content": [
      {"type": "paragraph", "content": [{"type": "text", "text": description}]},
      {"type": "codeBlock", "content": [{"type": "text", "text": SQL}]}]}}}
      using the planned values unchanged, where SQL is the text between the markers below copied
      character for character:

      ----- SQL START -----
      {{inputs.sql}}
      ----- SQL END -----

      Then submit jira_key, the key createJiraIssue returned. Never call the tool a second time, even if
      a gate rejects your submission.
    produces:
      type: object
      required: [jira_key]
      additionalProperties: false
      properties:
        jira_key: { type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]+-[0-9]+$" }
    gates:
      - id: one-write-only-on-breach
        message: Call createJiraIssue exactly once, successfully, when breached, and not at all otherwise.
        predicate:
          and:
            - "==": [{ length: { var: calls } }, { if: [{ var: steps.plan.breached }, 1, 0] }]
            - none: [{ var: calls }, { var: is_error }]
      - id: body-as-planned
        message: >
          The issue must have exactly the planned project key, issue type, summary and description, the
          label stepgate-draft, and the input sql character for character in its code block.
        predicate:
          or:
            - "!": { var: steps.plan.breached }
            - and:
                - "===": [{ var: calls.0.arguments.body.fields.project.key }, { var: steps.plan.create.project_key }]
                - "===": [{ var: calls.0.arguments.body.fields.issuetype.name }, { var: steps.plan.create.issue_type }]
                - "===": [{ var: calls.0.arguments.body.fields.summary }, { var: steps.plan.create.summary }]
                - "===": [{ cat: [{ var: calls.0.arguments.body.fields.labels }] }, stepgate-draft]
                - "===": [{ var: calls.0.arguments.body.fields.description.content.0.content.0.text }, { var: steps.plan.create.description }]
                - "===": [{ var: calls.0.arguments.body.fields.description.content.1.content.0.text }, { var: inputs.sql }]
      - id: key-from-result
        message: jira_key must be the key createJiraIssue returned, or null when nothing was created.
        predicate:
          "===":
            - var: output.jira_key
            - if: [{ var: steps.plan.breached }, { var: calls.0.result.key }, null]
    retries: 2

  - id: report
    instructions: |
      Write the result of the metric check.

      Metric: {{inputs.metric_name}} (column {{inputs.metric_column}})
      Value returned: {{steps.query.metric_raw}}
      Threshold: {{inputs.threshold}}, breached when {{inputs.breach_when}}
      Breached: {{steps.plan.breached}}
      Jira issue created: {{steps.execute.jira_key}}
      Snowflake statement handle: {{steps.query.statement_handle}}

      SQL that was run:
      ----- SQL START -----
      {{inputs.sql}}
      ----- SQL END -----

      Submit sql (the SQL above character for character), metric_raw, threshold, breached and jira_key
      copied from above (jira_key null if none was created), and summary: a short Markdown report
      stating the value, the threshold and whether it was breached. If breached, name the Jira issue
      key and say it is labelled stepgate-draft for review. If not, say that no Jira issue was created.
      Include the SQL in a fenced code block. Mention no {{inputs.jira_project}} issue key other than the
      one created.
    produces:
      type: object
      required: [sql, metric_raw, threshold, breached, jira_key, summary]
      additionalProperties: false
      properties:
        sql: { type: string }
        metric_raw: { type: string }
        threshold: { type: number }
        breached: { type: boolean }
        jira_key: { type: [string, "null"] }
        summary: { type: string, minLength: 1, maxLength: 16000 }
    gates:
      - id: values-echoed
        message: sql, metric_raw, threshold, breached and jira_key must be copied exactly from the run.
        predicate:
          and:
            - "===": [{ var: output.sql }, { var: inputs.sql }]
            - "===": [{ var: output.metric_raw }, { var: steps.query.metric_raw }]
            - "===": [{ var: output.threshold }, { var: inputs.threshold }]
            - "===": [{ var: output.breached }, { var: steps.plan.breached }]
            - "===": [{ var: output.jira_key }, { var: steps.execute.jira_key }]
      - id: summary-states-result
        message: >
          The summary must quote metric_raw and the SQL exactly, and name the created Jira key and no
          other key in the project, or name none when nothing was created.
        predicate:
          and:
            - in: [{ var: steps.query.metric_raw }, { var: output.summary }]
            - in: [{ var: inputs.sql }, { var: output.summary }]
            - "===":
                - cat: [{ match_all: [{ var: output.summary }, { cat: ["\\b", { var: inputs.jira_project }, "-[0-9]+\\b"] }] }]
                - if:
                    - var: steps.execute.jira_key
                    - cat: [{ match_all: [{ var: output.summary }, { cat: ["\\b", { var: steps.execute.jira_key }, "\\b"] }] }]
                    - ""
            - if:
                - var: steps.execute.jira_key
                - ">": [{ length: { match_all: [{ var: output.summary }, { cat: ["\\b", { var: steps.execute.jira_key }, "\\b"] }] } }, 0]
                - true
    retries: 2
