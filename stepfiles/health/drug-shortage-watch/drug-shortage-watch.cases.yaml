                disclaimer: Do not rely on openFDA to make decisions regarding medical care.
                  While we make every effort to ensure that data is accurate,
                  you should assume all results are unvalidated. We may limit or
                  otherwise restrict your access to the API in line with our
                  Terms of Service.
                terms: https://open.fda.gov/terms/
                license: https://open.fda.gov/license/
                last_updated: 2026-09-26
              results:
                - term: Current
                  count: 87
                - term: To Be Discontinued
                  count: 2
            is_error: false
          - tool: countShortagesByStatus
            arguments:
              search: generic_name:"methotrexate"
