# A run of drug-shortage-watch against the live APIs on 2026-09-27, recorded with --record-cases, for `stepgate --test drug-shortage-watch`.
# Each step's first attempt was a deliberately wrong submission; the gates it breaks are expected to fail.
cases:
  - name: a recorded run rejects each wrong submission and accepts the corrected one
    inputs:
      formulary:
        - lidocaine
        - methotrexate
        - sodium chloride
        - albuterol
        - amoxicillin
    steps:
      - step: status
        calls:
          - tool: countShortagesByStatus
            arguments:
              search: generic_name:"lidocaine"
            result:
