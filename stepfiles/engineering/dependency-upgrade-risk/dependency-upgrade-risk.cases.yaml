          summary: express vulnerable to XSS via response.redirect()
          details: '### Impact


            In express <4.20.0, passing untrusted user input - even after sanitizing it - to `response.redirect()` may execute untrusted code


            ### Patches


            this issue is patched in express 4.20.0


            ### Workarounds


            users are encouraged to upgrade to the patched version of express, but otherwise can workaround this issue by making sure any untrusted inputs are safe, ideally by validating them against an
            explicit allowlist


            ### Details


            successful exploitation of this vector requires the following:


            1. The attacker MUST control the input to response.redirect()

            1. express MUST NOT redirect before the template appears

            1. the browser MUST NOT complete redirection before:

            1. the user MUST click on the link in the template

            '
