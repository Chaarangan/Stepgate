# yaml-language-server: $schema=../../../server/schema/stepfile.schema.json
stepgate: "1"
id: disaster-declaration-brief
title: Federal disaster declarations brief for a US state
description: >
  Lists every federal disaster declaration OpenFEMA records for a US state and
  date range, summarises them by incident type and assistance program, and
  writes a brief that cites each declaration by its FEMA disaster number.

inputs:
  type: object
  required: [state, start_date, end_date]
  properties:
    state: { type: string, pattern: "^[A-Z]{2}$", description: "Two-letter USPS state or territory code, for example TX" }
    start_date: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "First declaration date to include, YYYY-MM-DD" }
    end_date: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "Last declaration date to include, YYYY-MM-DD" }

tools:
  openfema:
    openapi:
      server: https://www.fema.gov/api/open/v1
      document:
        openapi: 3.1.0
        info: { title: OpenFEMA FEMA Web Disaster Declarations (trimmed), version: "1" }
        paths:
          # OpenFEMA only honours the OData names with the "$" prefix, which model
          # APIs reject as tool argument names, so the query is fixed in the path
          # template and the model fills plain path parameters.
          "/FemaWebDisasterDeclarations?$filter=stateCode eq '{state}' and declarationDate ge '{start_date}' and declarationDate le '{end_date}T23:59:59.999Z'&$select=disasterNumber,declarationDate,disasterName,declarationType,incidentType,ihProgramDeclared,iaProgramDeclared,paProgramDeclared,hmProgramDeclared&$orderby=declarationDate,disasterNumber&$top=50&$skip={skip}&$inlinecount=allpages":
            get:
              operationId: listDeclarations
              summary: >
                One page of up to 50 FEMA disaster declarations for a state, declared
                between start_date and end_date inclusive, oldest first.
                metadata.count is the total across all pages; raise skip by 50 to
                fetch the next page.
              parameters:
                - { name: state, in: path, required: true, schema: { type: string, pattern: "^[A-Z]{2}$" } }
                - { name: start_date, in: path, required: true, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" } }
                - { name: end_date, in: path, required: true, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" } }
                - { name: skip, in: path, required: true, schema: { type: integer, minimum: 0, multipleOf: 50 } }
    exposes: [listDeclarations]

steps:
  - id: declarations
    tools: [listDeclarations]
    instructions: |
      List the federal disaster declarations for {{inputs.state}} declared
      from {{inputs.start_date}} to {{inputs.end_date}}. Call
      listDeclarations with state {{inputs.state}}, start_date
      {{inputs.start_date}}, end_date {{inputs.end_date}} and skip 0. If
      metadata.count is above 50, call again with skip 50, 100 and so on
      until every declaration is fetched. Use the same state and dates on
      every call.

      Submit total_count as metadata.count, and one entry per declaration
      with values copied exactly from the API: disaster_number
      (disasterNumber), declaration_date (the first ten characters of
      declarationDate, YYYY-MM-DD), title (disasterName), declaration_type
      (declarationType), incident_type (incidentType), and the four program
      flags ih_program, ia_program, pa_program and hm_program
      (ihProgramDeclared, iaProgramDeclared, paProgramDeclared,
      hmProgramDeclared). Include every declaration once. Add none.
    produces:
      type: object
      required: [total_count, declarations]
      properties:
        total_count: { type: integer, minimum: 0 }
        declarations:
          type: array
          items:
            type: object
            required: [disaster_number, declaration_date, title, declaration_type, incident_type, ih_program, ia_program, pa_program, hm_program]
            properties:
              disaster_number: { type: integer }
              declaration_date: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
              title: { type: string }
              declaration_type: { type: string }
              incident_type: { type: string }
              ih_program: { type: boolean }
              ia_program: { type: boolean }
              pa_program: { type: boolean }
              hm_program: { type: boolean }
    gates:
      - id: date-range-valid
        message: The input start_date must not be after end_date.
        predicate:
          "<=": [{ var: inputs.start_date }, { var: inputs.end_date }]
      - id: queried-the-inputs
        message: >
          Call listDeclarations at least once, successfully, and only with the
          input state, start_date and end_date.
        predicate:
          and:
            - ">":
                - length:
                    filter:
                      - { var: calls }
                      - and: [{ "==": [{ var: tool }, listDeclarations] }, { "!": { var: is_error } }]
                - 0
            - subset:
                - map:
                    - filter: [{ var: calls }, { "==": [{ var: tool }, listDeclarations] }]
                    - [{ var: arguments.state }, { var: arguments.start_date }, { var: arguments.end_date }]
                - - [{ var: inputs.state }, { var: inputs.start_date }, { var: inputs.end_date }]
      - id: declarations-from-api
        message: >
          Every declaration (number, date, title, type, incident type and the
          four program flags) must be a row a listDeclarations call returned,
          copied exactly, with declaration_date as the first ten characters of
          declarationDate.
        predicate:
          subset:
            - map:
                - { var: output.declarations }
                - [{ var: disaster_number }, { var: declaration_date }, { var: title }, { var: declaration_type }, { var: incident_type }, { var: ih_program }, { var: ia_program }, { var: pa_program }, { var: hm_program }]
            - flatten:
                map:
                  - filter: [{ var: calls }, { "==": [{ var: tool }, listDeclarations] }]
                  - map:
                      - { var: result.FemaWebDisasterDeclarations }
                      - [{ var: disasterNumber }, { substr: [{ var: declarationDate }, 0, 10] }, { var: disasterName }, { var: declarationType }, { var: incidentType }, { var: ihProgramDeclared }, { var: iaProgramDeclared }, { var: paProgramDeclared }, { var: hmProgramDeclared }]
      - id: total-from-api
        message: total_count must be metadata.count from a successful listDeclarations call.
        predicate:
          in:
            - { var: output.total_count }
            - map:
                - filter:
                    - { var: calls }
                    - and: [{ "==": [{ var: tool }, listDeclarations] }, { "!": { var: is_error } }]
                - { var: result.metadata.count }
      # With rows proven real, equal counts of distinct numbers means none was skipped.
      - id: every-declaration-once
        message: List every declaration exactly once; the number of distinct disaster numbers must equal total_count.
        predicate:
          and:
            - "==": [{ length: { var: output.declarations } }, { var: output.total_count }]
            - "==":
                - { length: { unique: { map: [{ var: output.declarations }, { var: disaster_number }] } } }
                - { var: output.total_count }
    retries: 2

  - id: summary
    instructions: |
      Declarations for {{inputs.state}}, {{inputs.start_date}} to {{inputs.end_date}}:
      {{steps.declarations.declarations}}

      Group them by incident_type: one group per distinct incident_type,
      spelled exactly as above, with count and the disaster_numbers in that
      group. Every declaration belongs to exactly one group.

      For each assistance program, list the disaster_numbers whose flag is
      true, and the count: individual_and_households (ih_program),
      individual_assistance (ia_program), public_assistance (pa_program) and
      hazard_mitigation (hm_program). Use an empty list and 0 where none.
    produces:
      type: object
      required: [by_incident_type, programs]
      properties:
        by_incident_type:
          type: array
          items:
            type: object
            required: [incident_type, count, disaster_numbers]
            properties:
              incident_type: { type: string }
              count: { type: integer, minimum: 1 }
              disaster_numbers: { type: array, minItems: 1, items: { type: integer } }
        programs:
          type: object
          required: [individual_and_households, individual_assistance, public_assistance, hazard_mitigation]
          properties:
            individual_and_households: { $ref: "#/$defs/program" }
            individual_assistance: { $ref: "#/$defs/program" }
            public_assistance: { $ref: "#/$defs/program" }
            hazard_mitigation: { $ref: "#/$defs/program" }
    gates:
      - id: groups-cover-every-declaration-once
        message: Every disaster number must appear in exactly one incident-type group, and no other number may appear.
        predicate:
          and:
            - "==":
                - { length: { flatten: { map: [{ var: output.by_incident_type }, { var: disaster_numbers }] } } }
                - { length: { var: steps.declarations.declarations } }
            - "==":
                - { length: { unique: { flatten: { map: [{ var: output.by_incident_type }, { var: disaster_numbers }] } } } }
                - { length: { var: steps.declarations.declarations } }
            - subset:
                - { flatten: { map: [{ var: output.by_incident_type }, { var: disaster_numbers }] } }
                - { map: [{ var: steps.declarations.declarations }, { var: disaster_number }] }
      - id: group-counts-match
        message: Each group's count must equal the number of disaster_numbers it lists, and incident types must not repeat.
        predicate:
          and:
            - none: [{ var: output.by_incident_type }, { "!=": [{ var: count }, { length: { var: disaster_numbers } }] }]
            - "==":
                - { length: { unique: { map: [{ var: output.by_incident_type }, { var: incident_type }] } } }
                - { length: { var: output.by_incident_type } }
      # The inner reduce starts from [incident_type], so each member can be paired
      # with its group's type despite JSONLogic scoping; the bare type is also allowed.
      - id: groups-match-incident-types
        message: Each disaster number must sit in the group named by its own incident_type from the declarations step.
        predicate:
          subset:
            - flatten:
                map:
                  - { var: output.by_incident_type }
                  - reduce:
                      - { var: disaster_numbers }
                      - merge: [{ var: accumulator }, [{ cat: [{ var: accumulator.0 }, "#", { var: current }] }]]
                      - [{ var: incident_type }]
            - merge:
                - map: [{ var: steps.declarations.declarations }, { cat: [{ var: incident_type }, "#", { var: disaster_number }] }]
                - map: [{ var: steps.declarations.declarations }, { var: incident_type }]
      - id: programs-match-flags
        message: Each program must list exactly the disaster numbers whose flag is true, and count them.
        predicate:
          and:
            - subset: [{ var: output.programs.individual_and_households.disaster_numbers }, { map: [{ filter: [{ var: steps.declarations.declarations }, { var: ih_program }] }, { var: disaster_number }] }]
            - subset: [{ map: [{ filter: [{ var: steps.declarations.declarations }, { var: ih_program }] }, { var: disaster_number }] }, { var: output.programs.individual_and_households.disaster_numbers }]
            - "==": [{ var: output.programs.individual_and_households.count }, { length: { filter: [{ var: steps.declarations.declarations }, { var: ih_program }] } }]
            - subset: [{ var: output.programs.individual_assistance.disaster_numbers }, { map: [{ filter: [{ var: steps.declarations.declarations }, { var: ia_program }] }, { var: disaster_number }] }]
            - subset: [{ map: [{ filter: [{ var: steps.declarations.declarations }, { var: ia_program }] }, { var: disaster_number }] }, { var: output.programs.individual_assistance.disaster_numbers }]
            - "==": [{ var: output.programs.individual_assistance.count }, { length: { filter: [{ var: steps.declarations.declarations }, { var: ia_program }] } }]
            - subset: [{ var: output.programs.public_assistance.disaster_numbers }, { map: [{ filter: [{ var: steps.declarations.declarations }, { var: pa_program }] }, { var: disaster_number }] }]
            - subset: [{ map: [{ filter: [{ var: steps.declarations.declarations }, { var: pa_program }] }, { var: disaster_number }] }, { var: output.programs.public_assistance.disaster_numbers }]
            - "==": [{ var: output.programs.public_assistance.count }, { length: { filter: [{ var: steps.declarations.declarations }, { var: pa_program }] } }]
            - subset: [{ var: output.programs.hazard_mitigation.disaster_numbers }, { map: [{ filter: [{ var: steps.declarations.declarations }, { var: hm_program }] }, { var: disaster_number }] }]
            - subset: [{ map: [{ filter: [{ var: steps.declarations.declarations }, { var: hm_program }] }, { var: disaster_number }] }, { var: output.programs.hazard_mitigation.disaster_numbers }]
            - "==": [{ var: output.programs.hazard_mitigation.count }, { length: { filter: [{ var: steps.declarations.declarations }, { var: hm_program }] } }]
    retries: 2

  - id: brief
    instructions: |
      Declarations for {{inputs.state}}, {{inputs.start_date}} to {{inputs.end_date}}:
      {{steps.declarations.declarations}}

      By incident type: {{steps.summary.by_incident_type}}
      By program: {{steps.summary.programs}}

      Write a Markdown brief with the sections "## Overview", "## By incident
      type", "## By program" and "## Declarations", in that order.
      - Overview: the state, the date range, the total of
        {{steps.declarations.total_count}} declarations, and the main pattern.
      - By incident type: one line per group, starting with the type in bold
        and its count, as "- **Fire**: 3", followed by its citations.
      - By program: one line per program, as "- **Individuals and Households**: N",
        "- **Individual Assistance**: N", "- **Public Assistance**: N" and
        "- **Hazard Mitigation**: N".
      - Declarations: one line per declaration with its date, title and type.
      Cite a declaration only as [FEMA-<disaster_number>], for example
      [FEMA-4781]. Cite every declaration at least once, and no number that
      is not in the list. Bold nothing else that is followed by a colon and a
      number. If there are no declarations, say so in each section.
    produces:
      type: object
      required: [markdown]
      properties:
        markdown: { type: string, maxLength: 16000 }
    gates:
      - id: sections-in-order
        schema:
          properties:
            markdown:
              pattern: "## Overview[\\s\\S]*## By incident type[\\s\\S]*## By program[\\s\\S]*## Declarations"
      - id: citations-real-and-complete
        message: Cite every declaration as [FEMA-<number>] at least once, and cite no number the declarations step did not list.
        predicate:
          and:
            - subset:
                - { match_all: [{ var: output.markdown }, "\\[FEMA-(\\d+)\\]"] }
                - { map: [{ var: steps.declarations.declarations }, { cat: ["", { var: disaster_number }] }] }
            - subset:
                - { map: [{ var: steps.declarations.declarations }, { cat: ["", { var: disaster_number }] }] }
                - { match_all: [{ var: output.markdown }, "\\[FEMA-(\\d+)\\]"] }
      - id: counts-match-summary
        message: >
          Every "**Label**: N" line must state a count from the summary step,
          one per incident type and one per program, with the labels
          Individuals and Households, Individual Assistance, Public Assistance
          and Hazard Mitigation.
        predicate:
          and:
            - subset:
                - &stated { match_all: [{ var: output.markdown }, "\\*\\*([^*\\n]+\\*\\*: \\d+)"] }
                - &expected
                  merge:
                    - map: [{ var: steps.summary.by_incident_type }, { cat: [{ var: incident_type }, "**: ", { var: count }] }]
                    - - { cat: ["Individuals and Households**: ", { var: steps.summary.programs.individual_and_households.count }] }
                      - { cat: ["Individual Assistance**: ", { var: steps.summary.programs.individual_assistance.count }] }
                      - { cat: ["Public Assistance**: ", { var: steps.summary.programs.public_assistance.count }] }
                      - { cat: ["Hazard Mitigation**: ", { var: steps.summary.programs.hazard_mitigation.count }] }
            - subset: [*expected, *stated]
    retries: 2

$defs:
  program:
    type: object
    required: [count, disaster_numbers]
    properties:
      count: { type: integer, minimum: 0 }
      disaster_numbers: { type: array, items: { type: integer } }
