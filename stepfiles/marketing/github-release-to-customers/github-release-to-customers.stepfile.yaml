# yaml-language-server: $schema=../../../server/schema/stepfile.schema.json
stepgate: "1"
id: github-release-to-customers
title: Customer release notes from a GitHub release, addressed to HubSpot contacts
description: >
  Collects the pull requests merged between two GitHub releases, writes customer-facing release notes
  that cite them by number, finds the HubSpot contacts matching a property filter, and returns a
  ready-to-send email to the operator with the notes and the recipient list. Sends nothing.

inputs:
  type: object
  required: [owner, repo, tag, previous_tag, contact_property, contact_value, operator_email]
  additionalProperties: false
  properties:
    owner: { type: string, pattern: "^[A-Za-z0-9-]{1,39}$", description: GitHub user or organisation }
    repo: { type: string, pattern: "^[A-Za-z0-9._-]{1,100}$", description: Repository name without .git }
    tag: { type: string, minLength: 1, maxLength: 255, description: The release tag to announce, for example v2.100.0 }
    previous_tag: { type: string, minLength: 1, maxLength: 255, description: The tag of the release before it }
    contact_property:
      type: string
      pattern: "^[a-z0-9_]{1,100}$"
      description: Internal name of the HubSpot contact property to filter on, for example lifecyclestage
    contact_value: { type: string, minLength: 1, maxLength: 200, description: The value it must equal, for example customer }
    operator_email: { type: string, format: email, description: Who the prepared email is addressed to }

credentials:
  github:
    kind: bearer
    hosts: [api.github.com]
    description: >
      A GitHub fine-grained personal access token with read-only Contents and Pull requests access to
      the repository (or a classic token; public repositories need no scope). Never writes.
  hubspot:
    kind: bearer
    hosts: [api.hubapi.com]
    description: >
      A HubSpot private app access token with the crm.objects.contacts.read scope. Reads contact ids,
      emails and names. Never writes.

tools:
  github:
    openapi:
      server: https://api.github.com
      document:
        openapi: 3.1.0
        info: { title: GitHub REST API (trimmed), version: "2026-03-10" }
        components:
          securitySchemes:
            bearerAuth: { type: http, scheme: bearer }
          parameters:
            accept:
              name: Accept
              in: header
              schema: { enum: [application/vnd.github+json] }
            apiVersion:
              name: X-GitHub-Api-Version
              in: header
              schema: { enum: ["2026-03-10"] }
        security: [{ bearerAuth: [] }]
        paths:
          /repos/{owner}/{repo}/releases/tags/{tag}:
            get:
              operationId: getReleaseByTag
              summary: >
                Get a published release by its tag. Returns tag_name, name, html_url and created_at, which
                is the date of the commit the release was made from (UTC, YYYY-MM-DDTHH:MM:SSZ), not when
                it was published. 404 means no published release has that tag.
              parameters:
                - $ref: "#/components/parameters/accept"
                - $ref: "#/components/parameters/apiVersion"
                - { name: owner, in: path, required: true, schema: { type: string } }
                - { name: repo, in: path, required: true, schema: { type: string } }
                - { name: tag, in: path, required: true, schema: { type: string } }
              responses:
                "200": { description: The release }
          /search/issues:
            get:
              operationId: searchPullRequests
              summary: >
                Search pull requests. total_count is the number of matches and items holds one page; in
                each item number, title and pull_request.merged_at come before the long body text.
              parameters:
                - $ref: "#/components/parameters/accept"
                - $ref: "#/components/parameters/apiVersion"
                - { name: q, in: query, required: true, schema: { type: string } }
                - { name: per_page, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 10 } }
                - { name: page, in: query, required: true, schema: { type: integer, minimum: 1 } }
              responses:
                "200": { description: "total_count, incomplete_results and items" }
    credential: github
    exposes: [getReleaseByTag, searchPullRequests]

  hubspot:
    openapi:
      server: https://api.hubapi.com
      document:
        openapi: 3.1.0
        info: { title: HubSpot CRM objects API, contacts search (trimmed), version: "2026-09" }
        components:
          securitySchemes:
            bearerAuth: { type: http, scheme: bearer }
        security: [{ bearerAuth: [] }]
        paths:
          /crm/objects/2026-09/{objectType}/search:
            post:
              operationId: searchContacts
              summary: >
                Search HubSpot contacts with one filter. Returns total (all matches), results (id and
                the requested properties per contact) and, when more pages exist, paging.next.after to
                pass as after on the next call.
              parameters:
                - name: objectType
                  in: path
                  required: true
                  schema: { enum: [contacts] }
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required: [filterGroups, properties, limit]
                      additionalProperties: false
                      properties:
                        filterGroups:
                          type: array
                          minItems: 1
                          maxItems: 1
                          items:
                            type: object
                            required: [filters]
                            additionalProperties: false
                            properties:
                              filters:
                                type: array
                                minItems: 1
                                maxItems: 1
                                items:
                                  type: object
                                  required: [propertyName, operator, value]
                                  additionalProperties: false
                                  properties:
                                    propertyName: { type: string }
                                    operator: { enum: [EQ] }
                                    value: { type: string }
                        properties:
                          type: array
                          items: { enum: [email, firstname, lastname] }
                        limit: { type: integer, minimum: 1, maximum: 50 }
                        after: { type: string, description: paging.next.after from the previous page }
              responses:
                "200": { description: "total, results and paging" }
    credential: hubspot
    exposes: [searchContacts]

steps:
  - id: releases
    tools: [getReleaseByTag]
    instructions: |
      Fetch two releases of GitHub repository {{inputs.owner}}/{{inputs.repo}} with getReleaseByTag:
      tag "{{inputs.tag}}" and tag "{{inputs.previous_tag}}".

      Submit, copied from the responses: name, html_url and created_at of the release being announced,
      and previous_created_at, the created_at of the previous one.

      Then compute the merge window, in the same YYYY-MM-DDTHH:MM:SSZ format:
      - window_start: previous_created_at plus 2 seconds;
      - window_end: created_at plus 1 second.
      GitHub records a pull request's merge about a second after its merge commit, so this window holds
      the pull request whose merge commit is the new release's tag, and not the previous release's one.
    produces:
      type: object
      required: [name, html_url, created_at, previous_created_at, window_start, window_end]
      additionalProperties: false
      properties:
        name: { type: [string, "null"] }
        html_url: { type: string }
        created_at: { $ref: "#/$defs/utc" }
        previous_created_at: { $ref: "#/$defs/utc" }
        window_start: { $ref: "#/$defs/utc" }
        window_end: { $ref: "#/$defs/utc" }
    gates:
      # cat renders null as "", so a release without a name matches a null name in the output.
      - id: releases-from-github
        message: >
          name, html_url and created_at must be copied from getReleaseByTag for the given tag, and
          previous_created_at from getReleaseByTag for previous_tag, both in the given repository.
        predicate:
          and:
            - in:
                - cat: [{ lower: { var: inputs.owner } }, "/", { lower: { var: inputs.repo } }, "|", { var: inputs.tag }, "|", { var: output.name }, "|", { var: output.html_url }, "|", { var: output.created_at }]
                - map:
                    - filter: [{ var: calls }, { and: [{ "==": [{ var: tool }, getReleaseByTag] }, { "!": { var: is_error } }] }]
                    - cat: [{ lower: { var: arguments.owner } }, "/", { lower: { var: arguments.repo } }, "|", { var: result.tag_name }, "|", { var: result.name }, "|", { var: result.html_url }, "|", { var: result.created_at }]
            - in:
                - cat: [{ lower: { var: inputs.owner } }, "/", { lower: { var: inputs.repo } }, "|", { var: inputs.previous_tag }, "|", { var: output.previous_created_at }]
                - map:
                    - filter: [{ var: calls }, { and: [{ "==": [{ var: tool }, getReleaseByTag] }, { "!": { var: is_error } }] }]
                    - cat: [{ lower: { var: arguments.owner } }, "/", { lower: { var: arguments.repo } }, "|", { var: result.tag_name }, "|", { var: result.created_at }]
      - id: previous-is-older
        message: The previous release must have been made from an older commit than the announced one.
        predicate:
          "<": [{ var: output.previous_created_at }, { var: output.created_at }]
      # Seconds via a days-from-civil formula (years 1970 to 2099); map converts each pair, reduce subtracts.
      - id: window-shifted
        message: window_start must be previous_created_at plus 2 seconds, and window_end created_at plus 1 second.
        predicate:
          and:
            - "==":
                - reduce:
                    - map:
                        - [{ var: output.previous_created_at }, { var: output.window_start }]
                        - &epoch-seconds
                          "+":
                            - "*":
                                - "+":
                                    - "*": [365, &march-year { "-": [{ "+": [{ substr: [&iso { var: "" }, 0, 4] }] }, { if: [{ "<=": [&month { "+": [{ substr: [*iso, 5, 2] }] }, 2] }, 1, 0] }] }]
                                    - "/": [{ "-": [*march-year, { "%": [*march-year, 4] }] }, 4]
                                    - "*": [-1, { "/": [{ "-": [*march-year, { "%": [*march-year, 100] }] }, 100] }]
                                    - "/": [{ "-": [*march-year, { "%": [*march-year, 400] }] }, 400]
                                    - "/": [{ "-": [&month-days { "+": [{ "*": [153, { "%": [{ "+": [*month, 9] }, 12] }] }, 2] }, { "%": [*month-days, 5] }] }, 5]
                                    - "+": [{ substr: [*iso, 8, 2] }]
                                - 86400
                            - "*": [{ "+": [{ substr: [*iso, 11, 2] }] }, 3600]
                            - "*": [{ "+": [{ substr: [*iso, 14, 2] }] }, 60]
                            - "+": [{ substr: [*iso, 17, 2] }]
                    - "-": [{ var: current }, { var: accumulator }]
                    - 0
                - 2
            - "==":
                - reduce:
                    - map: [[{ var: output.created_at }, { var: output.window_end }], *epoch-seconds]
                    - "-": [{ var: current }, { var: accumulator }]
                    - 0
                - 1
    retries: 2

  - id: pulls
    tools: [searchPullRequests]
    instructions: |
      List the pull requests merged into {{inputs.owner}}/{{inputs.repo}} for release {{inputs.tag}}.

      Call searchPullRequests with q exactly
      "repo:{{inputs.owner}}/{{inputs.repo}} is:pr is:merged merged:{{steps.releases.window_start}}..{{steps.releases.window_end}}"
      and per_page 3, paging until you have read every item up to total_count. If a result is cut short
      before you can read an item's number, title and pull_request.merged_at, fetch that item alone with
      per_page 1 and page equal to its position in the full list.

      Submit every pull request once with number, title and merged_at (pull_request.merged_at), copied
      exactly.
    produces:
      type: object
      required: [pulls]
      additionalProperties: false
      properties:
        pulls:
          type: array
          items:
            type: object
            required: [number, title, merged_at]
            additionalProperties: false
            properties:
              number: { type: integer, minimum: 1 }
              title: { type: string }
              merged_at: { $ref: "#/$defs/utc" }
    gates:
      - id: search-matches-window
        message: >
          Every searchPullRequests call must use q exactly as instructed, and every item it returned must
          belong to this repository.
        predicate:
          and:
            - subset:
                - map: [{ filter: [{ var: calls }, { "==": [{ var: tool }, searchPullRequests] }] }, { var: arguments.q }]
                - - cat: ["repo:", { var: inputs.owner }, "/", { var: inputs.repo }, " is:pr is:merged merged:", { var: steps.releases.window_start }, "..", { var: steps.releases.window_end }]
            - subset:
                - flatten:
                    map:
                      - filter: [{ var: calls }, { and: [{ "==": [{ var: tool }, searchPullRequests] }, { "!": { var: is_error } }] }]
                      - map: [{ var: result.items }, { lower: { var: repository_url } }]
                - - lower: { cat: ["https://api.github.com/repos/", { var: inputs.owner }, "/", { var: inputs.repo }] }
      - id: pulls-from-github
        message: >
          Every pull request must be one searchPullRequests returned, with number, title and merged_at
          (pull_request.merged_at) copied exactly.
        predicate:
          subset:
            - map: [{ var: output.pulls }, { cat: [{ var: number }, "|", { var: title }, "|", { var: merged_at }] }]
            - flatten:
                map:
                  - filter: [{ var: calls }, { and: [{ "==": [{ var: tool }, searchPullRequests] }, { "!": { var: is_error } }] }]
                  - map: [{ var: result.items }, { cat: [{ var: number }, "|", { var: title }, "|", { var: pull_request.merged_at }] }]
      - id: pulls-complete
        message: >
          List every pull request the search matched, each once: the count must equal total_count, and
          the search must not report incomplete_results.
        predicate:
          and:
            - "==": [{ length: { unique: { map: [{ var: output.pulls }, { var: number }] } } }, { length: { var: output.pulls } }]
            - in:
                - length: { var: output.pulls }
                - map:
                    - filter: [{ var: calls }, { and: [{ "==": [{ var: tool }, searchPullRequests] }, { "!": { var: is_error } }] }]
                    - var: result.total_count
            - subset:
                - map:
                    - filter: [{ var: calls }, { and: [{ "==": [{ var: tool }, searchPullRequests] }, { "!": { var: is_error } }] }]
                    - cat: [{ var: result.total_count }, "|", { var: result.incomplete_results }]
                - - cat: [{ length: { var: output.pulls } }, "|false"]
      # The reduces start from the window's own ends, so they return the earliest and latest merge listed.
      - id: pulls-inside-window
        message: Every pull request must have been merged inside the release window.
        predicate:
          and:
            - ">=":
                - reduce: [{ var: output.pulls }, { if: [{ "<": [{ var: current.merged_at }, { var: accumulator }] }, { var: current.merged_at }, { var: accumulator }] }, { var: steps.releases.window_end }]
                - var: steps.releases.window_start
            - "<=":
                - reduce: [{ var: output.pulls }, { if: [{ ">": [{ var: current.merged_at }, { var: accumulator }] }, { var: current.merged_at }, { var: accumulator }] }, { var: steps.releases.window_start }]
                - var: steps.releases.window_end
    retries: 2

  - id: notes
    instructions: |
      Release {{inputs.tag}} of {{inputs.owner}}/{{inputs.repo}} ({{steps.releases.html_url}}) contains
      these merged pull requests:

      {{steps.pulls.pulls}}

      Sort every pull request into exactly one list:
      - items: changes a customer would notice (features, fixes, behaviour changes). Give number and
        title copied exactly, and customer_text: one plain sentence for customers, without internal jargon;
      - excluded: internal work such as dependency bumps, CI, tests and refactoring, with number and a
        short reason.

      Then write notes_markdown: customer-facing release notes for {{inputs.tag}} in Markdown, one bullet
      per item that ends with its pull request as (#number). Mention the tag. Do not cite excluded pull
      requests or any number not in items.
    produces:
      type: object
      required: [items, excluded, notes_markdown]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required: [number, title, customer_text]
            additionalProperties: false
            properties:
              number: { type: integer }
              title: { type: string }
              customer_text: { type: string, minLength: 1, maxLength: 400 }
        excluded:
          type: array
          items:
            type: object
            required: [number, reason]
            additionalProperties: false
            properties:
              number: { type: integer }
              reason: { type: string, maxLength: 200 }
        notes_markdown: { type: string, minLength: 1, maxLength: 12000 }
    gates:
      - id: every-pull-sorted-once
        message: Every pull request must appear exactly once, in items or in excluded, and no other number may.
        predicate:
          and:
            - "==":
                - length: { unique: { merge: [{ map: [{ var: output.items }, { var: number }] }, { map: [{ var: output.excluded }, { var: number }] }] } }
                - length: { var: steps.pulls.pulls }
            - "==":
                - length: { merge: [{ map: [{ var: output.items }, { var: number }] }, { map: [{ var: output.excluded }, { var: number }] }] }
                - length: { var: steps.pulls.pulls }
            - subset:
                - merge: [{ map: [{ var: output.items }, { var: number }] }, { map: [{ var: output.excluded }, { var: number }] }]
                - map: [{ var: steps.pulls.pulls }, { var: number }]
      - id: items-from-github
        message: Each item's title must be the pull request's title from GitHub, copied exactly.
        predicate:
          subset:
            - map: [{ var: output.items }, { cat: [{ var: number }, "|", { var: title }] }]
            - map: [{ var: steps.pulls.pulls }, { cat: [{ var: number }, "|", { var: title }] }]
      - id: notes-cite-items
        message: >
          notes_markdown must mention the tag, cite every item as #number, and cite no other pull request
          number.
        predicate:
          and:
            - in: [{ var: inputs.tag }, { var: output.notes_markdown }]
            - "!=":
                - reduce:
                    - var: output.items
                    - if: [{ in: [{ cat: ["#", { var: current.number }] }, { var: accumulator }] }, { var: accumulator }, ""]
                    - var: output.notes_markdown
                - ""
            - subset:
                - match_all: [{ var: output.notes_markdown }, "#([0-9]+)"]
                - map: [{ var: output.items }, { cat: [{ var: number }] }]
    retries: 2

  - id: audience
    tools: [searchContacts]
    instructions: |
      Find the HubSpot contacts whose property "{{inputs.contact_property}}" equals
      "{{inputs.contact_value}}".

      Call searchContacts with one filter group holding one filter: propertyName
      "{{inputs.contact_property}}", operator "EQ", value "{{inputs.contact_value}}"; properties
      ["email", "firstname", "lastname"]; limit 50. While the response has paging.next.after, call again
      with the same body plus after set to that value.

      Submit contacts: every result that has an email, with id, email, firstname and lastname copied
      exactly (null where HubSpot returned none), and without_email: the ids of results with no email.
    produces:
      type: object
      required: [contacts, without_email]
      additionalProperties: false
      properties:
        contacts:
          type: array
          maxItems: 200
          items:
            type: object
            required: [id, email, firstname, lastname]
            additionalProperties: false
            properties:
              id: { type: string }
              email: { type: string }
              firstname: { type: [string, "null"] }
              lastname: { type: [string, "null"] }
        without_email: { type: array, items: { type: string } }
    gates:
      - id: filter-as-given
        message: >
          Every searchContacts call must use exactly one filter: the given property, operator EQ and the
          given value.
        predicate:
          subset:
            - map:
                - filter: [{ var: calls }, { "==": [{ var: tool }, searchContacts] }]
                - cat:
                    - { length: { var: arguments.body.filterGroups } }
                    - "|"
                    - { length: { var: arguments.body.filterGroups.0.filters } }
                    - "|"
                    - { var: arguments.body.filterGroups.0.filters.0.propertyName }
                    - "|"
                    - { var: arguments.body.filterGroups.0.filters.0.operator }
                    - "|"
                    - { var: arguments.body.filterGroups.0.filters.0.value }
            - - cat: ["1|1|", { var: inputs.contact_property }, "|EQ|", { var: inputs.contact_value }]
      # Emails are compared lowercased; cat renders a null name as "", on both sides alike.
      - id: contacts-from-hubspot
        message: >
          Every contact must be a searchContacts result with its id, email, firstname and lastname copied
          exactly, and every id in without_email must be a result that has no email.
        predicate:
          and:
            - subset:
                - map: [{ var: output.contacts }, { cat: [{ var: id }, "|", { lower: { var: email } }, "|", { var: firstname }, "|", { var: lastname }] }]
                - flatten:
                    map:
                      - filter: [{ var: calls }, { and: [{ "==": [{ var: tool }, searchContacts] }, { "!": { var: is_error } }] }]
                      - map: [{ var: result.results }, { cat: [{ var: id }, "|", { lower: { var: properties.email } }, "|", { var: properties.firstname }, "|", { var: properties.lastname }] }]
            - subset:
                - var: output.without_email
                - flatten:
                    map:
                      - filter: [{ var: calls }, { and: [{ "==": [{ var: tool }, searchContacts] }, { "!": { var: is_error } }] }]
                      - map: [{ filter: [{ var: result.results }, { "!": { var: properties.email } }] }, { var: id }]
      - id: every-contact-accounted
        message: >
          Every contact HubSpot matched must appear once, in contacts or in without_email: together they
          must number exactly the search's total.
        predicate:
          and:
            - "==":
                - length: { unique: { merge: [{ map: [{ var: output.contacts }, { var: id }] }, { var: output.without_email }] } }
                - "+": [{ length: { var: output.contacts } }, { length: { var: output.without_email } }]
            - in:
                - "+": [{ length: { var: output.contacts } }, { length: { var: output.without_email } }]
                - map:
                    - filter: [{ var: calls }, { and: [{ "==": [{ var: tool }, searchContacts] }, { "!": { var: is_error } }] }]
                    - var: result.total
    retries: 2

  - id: email
    instructions: |
      Prepare the announcement email for release {{inputs.tag}}. It goes to the operator,
      {{inputs.operator_email}}, who will review it and send it to customers; you send nothing.

      Customer-facing release notes:
      {{steps.notes.notes_markdown}}

      Contacts to reach:
      {{steps.audience.contacts}}

      Submit:
      - to: "{{inputs.operator_email}}";
      - subject: a short subject that names {{inputs.tag}};
      - recipients: the email address of every contact above, each once;
      - body: plain text with a one-line note to the operator, the release notes (keep every (#number)
        citation), and then a "Recipients" section listing every recipient email address, one per line.
        Cite no pull request number that is not in the release notes.
    produces:
      type: object
      required: [to, subject, recipients, body]
      additionalProperties: false
      properties:
        to: { type: string }
        subject: { type: string, minLength: 1, maxLength: 200 }
        recipients: { type: array, maxItems: 200, items: { type: string } }
        body: { type: string, minLength: 1, maxLength: 30000 }
    gates:
      - id: addressed-to-operator
        message: to must be the operator's address as given.
        predicate:
          "==": [{ lower: { var: output.to } }, { lower: { var: inputs.operator_email } }]
      - id: recipients-are-the-audience
        message: recipients must be exactly the email addresses of the HubSpot contacts, each once.
        predicate:
          and:
            - "==": [{ length: { unique: { map: [{ var: output.recipients }, { lower: { var: "" } }] } } }, { length: { var: output.recipients } }]
            - "==": [{ length: { var: output.recipients } }, { length: { var: steps.audience.contacts } }]
            - subset:
                - map: [{ var: output.recipients }, { lower: { var: "" } }]
                - map: [{ var: steps.audience.contacts }, { lower: { var: email } }]
      - id: body-carries-notes-and-list
        message: >
          subject and body must name the tag; body must cite every release-note item as #number, no other
          pull request number, and list every recipient address.
        predicate:
          and:
            - in: [{ var: inputs.tag }, { var: output.subject }]
            - in: [{ var: inputs.tag }, { var: output.body }]
            - "!=":
                - reduce:
                    - var: steps.notes.items
                    - if: [{ in: [{ cat: ["#", { var: current.number }] }, { var: accumulator }] }, { var: accumulator }, ""]
                    - var: output.body
                - ""
            - subset:
                - match_all: [{ var: output.body }, "#([0-9]+)"]
                - map: [{ var: steps.notes.items }, { cat: [{ var: number }] }]
            - "!=":
                - reduce:
                    - var: output.recipients
                    - if: [{ in: [{ var: current }, { var: accumulator }] }, { var: accumulator }, ""]
                    - var: output.body
                - ""
    retries: 2

$defs:
  utc: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$" }
