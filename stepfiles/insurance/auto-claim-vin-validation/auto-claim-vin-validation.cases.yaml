                - Manufacturer: Southeast Toyota Distributors, LLC
                  NHTSACampaignNumber: 13V014000
                  parkIt: false
                  parkOutSide: false
                  overTheAirUpdate: false
                  ReportReceivedDate: 16/01/2013
                  Component: AIR BAGS:FRONTAL:SENSOR/CONTROL MODULE-INACTIVE
                  Summary: "Southeast Toyota Distributors, LLC (SET) is recalling certain models
                    interspersed through model years 2009 through 2013 as
                    follows: model year 2009-2012 Tacoma, 4Runner, Camry, Camry
                    Hybrid, Prius, and RAV4; model year 2009-2010 Avalon, FJ
                    Cruiser, and Highlander Hybrid; model year 2010-2013 model
                    year Corolla, Sienna and Tundra; model year 2009-2013
                    Highlander and Venza; model year 2012 Prius V; and model
                    year 2010-2012 Sequoia.  During modification by SET to
                    include accessories such as leather seat covers, seat
                    heaters or headrest DVD systems, these vehicles may not have
                    had the passenger seat occupant sensing system calibration
                    tested.  Without passing the calibration test, the occupant
                    sensing system may not operate as designed."
                  Consequence: If the front passenger seat occupant sensing system is out of
                    calibration, the front passenger airbags may not deploy or
                    they may deploy inappropriately for the passenger's size and
                    position.  This could increase the risk of personal injury
                    during the event of a vehicle crash necessitating airbag
                    deployment.
                  Remedy: Southeast Toyota will notify owners, and dealers will test the
                    sensitivity of the occupant detection sensors, and
                    recalibrate them as necessary.  The recall began on March
                    21, 2013.  Owners may contact Southeast Toyota at
                    1-800-301-6859.
                  Notes: Owners may also contact the National Highway Traffic Safety
                    Administration Vehicle Safety Hotline at 1-888-327-4236 (TTY
                    1-800-424-9153), or go to www.safercar.gov.
                  ModelYear: "2009"
                  Make: TOYOTA
                  Model: PRIUS
                - Manufacturer: Toyota Motor Engineering & Manufacturing
                  NHTSACampaignNumber: 12V537000
                  parkIt: false
                  parkOutSide: false
                  overTheAirUpdate: false
                  ReportReceivedDate: 14/11/2012
                  Component: STEERING
                  Summary: Toyota is recalling certain model year 2004-2009 Prius vehicles
                    manufactured August 5, 2003, through March 30, 2009.  The
                    affected vehicles have a steering intermediate extension
                    shaft assembly built with metal splines that complete the
                    connection from the steering wheel to the steering
                    gear.  These splines may have been manufactured with an
                    insufficient hardness.
                  Consequence: Over time, the splines may wear and eventually fail resulting in a
                    loss of steering ability, increasing the risk of a vehicle
                    crash.
                  Remedy: Toyota will notify owners, and dealers will inspect the extension shaft
                    and replace it if it is one with insufficient hardness, free
                    of charge.  The recall began during December 2012.  Owners
                    may contact their Toyota dealer or the Toyota Customer
                    Experience Center at 1-800-331-4331.
                  Notes: Owners may also contact the National Highway Traffic Safety
                    Administration Vehicle Safety Hotline at 1-888-327-4236 (TTY
                    1-800-424-9153), or go to www.safercar.gov.
                  ModelYear: "2009"
                  Make: TOYOTA
                  Model: PRIUS
                - Manufacturer: Toyota Motor Engineering & Manufacturing
                  NHTSACampaignNumber: 12V536000
                  parkIt: false
                  parkOutSide: false
                  overTheAirUpdate: false
                  ReportReceivedDate: 14/11/2012
                  Component: ENGINE AND ENGINE COOLING
                  Summary: Toyota is recalling certain model year 2004-2009 Prius vehicles
                    manufactured August 6, 2003, through March 30, 2009 and
                    FCHV-adv vehicles manufactured December 12, 2008, through
                    September 13, 2011.  During manufacturing, a scratch may
                    have occurred inside of the electrically driven water pump
                    at the coil wire. The coil wire may corrode at the scratched
                    portion.
                  Consequence: The corroded coil wire may break and the water pump could
                    stop.  The corroded coil wire could cause a short circuit
                    between coil wires and a possible open fuse, creating a
                    stall-like condition of the hybrid system while the vehicle
                    is being driven.  This may increase the risk of a vehicle
                    crash.
                  Remedy: Toyota will notify its owners, and dealers will replace the electric
                    water pump, free of charge.  The recall began on January 17,
                    2013.  Owners may contact their Toyota dealer or the Toyota
                    Customer Experience Center at 1-800-331-4331.
                  Notes: Owners may also contact the National Highway Traffic Safety
                    Administration Vehicle Safety Hotline at 1-888-327-4236 (TTY
                    1-800-424-9153), or go to www.safercar.gov.
                  ModelYear: "2009"
                  Make: TOYOTA
                  Model: PRIUS
                - Manufacturer: TOYOTA MOTOR NORTH AMERICA, INC.
                  NHTSACampaignNumber: 09V388000
                  parkIt: false
                  parkOutSide: false
                  overTheAirUpdate: false
                  ReportReceivedDate: 05/10/2009
                  Component: VEHICLE SPEED CONTROL:ACCELERATOR PEDAL
                  Summary: TOYOTA IS RECALLING CERTAIN MODEL YEAR 2004-2010 PASSENGER
                    VEHICLES.  THE ACCELERATOR PEDAL CAN GET STUCK IN THE WIDE
                    OPEN POSITION DUE TO ITS BEING TRAPPED BY AN UNSECURED OR
                    INCOMPATIBLE DRIVER'S FLOOR MAT.
                  Consequence: A STUCK OPEN ACCELERATOR PEDAL MAY RESULT IN VERY HIGH VEHICLE
                    SPEEDS AND MAKE IT DIFFICULT TO STOP THE VEHICLE, WHICH
                    COULD CAUSE A CRASH, SERIOUS INJURY OR DEATH.
                  Remedy: TOYOTA FILED AN AMENDED DEFECT REPORT ON NOVEMBER 25, 2009, STATING THAT
                    DEALERS WILL MODIFY THE ACCELERATOR PEDAL AND, ON CERTAIN
                    VEHICLES, ALTER THE SHAPE OF THE FLOOR SURFACE UNDER THE
                    PEDAL.  THESE CHANGES ADDRESS THE RISK OF PEDAL ENTRAPMENT
                    DUE TO INTERFERENCE WITH THE FLOOR MAT.  REDESIGNED
                    ACCELERATOR PEDALS WILL BECOME AVAILABLE BEGINNING IN APRIL
                    2010 AND DEALERS WILL REPLACE ANY MODIFIED PEDAL WITH THE
                    NEW PEDAL IF DESIRED.  ALSO, DEALERS WILL REPLACE ANY
                    GENUINE TOYOTA OR LEXUS ALL-WEATHER FLOOR MATS WITH
                    REDESIGNED ALL-WEATHER MATS, OR REPURCHASE THE PREVIOUS MATS
                    FROM OWNERS WHO DO NOT WANT THE NEW ONES.  ADDITIONALLY,
                    SOFTWARE MODIFICATIONS WILL BE INSTALLED ON CAMRY, AVALON
                    AND LEXUS ES 350, IS 350 AND IS 250 MODELS THAT WILL ENSURE
                    THAT THE BRAKE OVERRIDES THE ACCELERATOR IN THE EVENT BOTH
                    BRAKE AND ACCELERATOR PEDALS ARE APPLIED.  TOYOTA WILL BEGIN
                    MAILING LETTERS TO OWNERS ON DECEMBER 31, 2009.  OWNERS MAY
                    CONTACT TOYOTA AT 1-800-331-4331, LEXUS AT 1-800-255-3987.
                  Notes: TOYOTA RECALL NO. 90L/90LG.  OWNERS MAY ALSO CONTACT THE NATIONAL HIGHWAY
                    TRAFFIC SAFETY ADMINISTRATION'S VEHICLE SAFETY HOTLINE AT
                    1-888-327-4236 (TTY 1-800-424-9153), OR GO TO <A
