# yaml-language-server: $schema=../../../server/schema/stepfile.schema.json
stepgate: "1"
id: book-list-verification
title: Verify a reading list against Open Library
description: >
  Confirms that every book on a reading list exists in Open Library under the
  stated author, and flags books that do not exist or belong to someone else.

inputs:
  type: object
  required: [books]
  properties:
    books:
      type: array
      description: The books to check, each with its title and the author the list names.
      minItems: 1
      maxItems: 30
      items:
        type: object
        required: [title, author]
        additionalProperties: false
        properties:
          title: { type: string, minLength: 1 }
          author: { type: string, minLength: 1 }

tools:
  # Two tools over one endpoint so gates can tell a search filtered by the
  # stated author, which is the attribution check, from a title-only search.
  openlibrary-by-author:
    openapi:
      server: https://openlibrary.org
      document:
        openapi: 3.1.0
        info: { title: Open Library search, by title and author, version: "1" }
        paths:
          /search.json:
            get:
              operationId: searchByTitleAndAuthor
              summary: >
                Search Open Library works matching both a title and an author
                name. docs is empty when no work matches both.
              parameters:
                - name: title
                  in: query
                  required: true
                  schema: { type: string, minLength: 1 }
                - name: author
                  in: query
                  required: true
                  schema: { type: string, minLength: 1 }
                - name: limit
                  in: query
                  required: true
                  description: Number of results, 1 to 5.
                  schema: { type: integer, minimum: 1, maximum: 5 }
                - name: fields
                  in: query
                  required: true
                  description: The fields to return; only this value is accepted.
                  schema: { type: string, enum: ["key,title,author_name,first_publish_year"] }
              responses:
                "200": { description: Search results }
    exposes: [searchByTitleAndAuthor]
  openlibrary-by-title:
    openapi:
      server: https://openlibrary.org
      document:
        openapi: 3.1.0
        info: { title: Open Library search, by title, version: "1" }
        paths:
          /search.json:
            get:
              operationId: searchByTitle
              summary: Search Open Library works by title alone, whoever wrote them.
              parameters:
                - name: title
                  in: query
                  required: true
                  schema: { type: string, minLength: 1 }
                - name: limit
                  in: query
                  required: true
                  description: Number of results, 1 to 5.
                  schema: { type: integer, minimum: 1, maximum: 5 }
                - name: fields
                  in: query
                  required: true
                  description: The fields to return; only this value is accepted.
                  schema: { type: string, enum: ["key,title,author_name,first_publish_year"] }
              responses:
                "200": { description: Search results }
    exposes: [searchByTitle]

steps:
  - id: search
    tools: [searchByTitleAndAuthor]
    instructions: |
      Here is a reading list:

      {{inputs.books}}

      Number the books B-01, B-02 and so on, in the order given. For every
      book, call searchByTitleAndAuthor once, with title and author copied
      exactly as given and limit 5. Make one call at a time.

      For each book submit its id, title and author unchanged, and match: the
      returned doc that is this book, as { key, title, author_name } copied
      exactly (author_name is null if the doc has none). It is the same
      title, allowing for case, punctuation and a subtitle. A doc with a
      different title by the same author is not a match, nor is an omnibus or
      box set. If no doc is this book, set match to null.
    produces:
      type: object
      required: [books]
      properties:
        books:
          type: array
          items:
            type: object
            required: [id, title, author, match]
            additionalProperties: false
            properties:
              id: { type: string, pattern: "^B-[0-9]{2,}$" }
              title: { type: string }
              author: { type: string }
              match: { anyOf: [{ $ref: "#/$defs/doc" }, { type: "null" }] }
    let:
      books: { map: [{ var: output.books }, { object: [[book, [{ var: title }, { var: author }]], [match, { var: match }]] }] }
      searched:
        map:
          - filter: [{ var: calls }, { and: [{ "==": [{ var: tool }, searchByTitleAndAuthor] }, { "!": { var: is_error } }] }]
          - object:
              - [book, [{ var: arguments.title }, { var: arguments.author }]]
              - [docs, { map: [{ var: result.docs }, &doc { object: [[key, { var: key }], [title, { var: title }], [author_name, { var: author_name }]] }] }]
    gates:
      - id: every-book-once
        message: Submit every input book exactly once, with title and author unchanged and a unique id.
        predicate:
          and:
            - "==":
                - { length: { var: output.books } }
                - { length: { var: inputs.books } }
            - "==":
                - { length: { unique: { map: [{ var: output.books }, { var: id }] } } }
                - { length: { var: output.books } }
            - subset:
                - map: [{ var: inputs.books }, [{ var: title }, { var: author }]]
                - map: [{ var: output.books }, [{ var: title }, { var: author }]]
      - id: match-from-own-search
        message: >
          Every book needs a successful searchByTitleAndAuthor call with its
          exact title and author, and match must be null or one of that call's
          docs, copied exactly. These books break it:
        predicate:
          none:
            - join: [{ var: let.books }, { var: let.searched }, book, book]
            - or:
                - "==": [{ var: right }, null]
                - and: [{ var: left.match }, { "!": { subset: [[{ var: left.match }], { var: right.docs }] } }]
    retries: 2

  - id: crosscheck
    tools: [searchByTitle]
    instructions: |
      These books were searched under their stated author:

      {{steps.search.books}}

      For every book whose match is null, and only those, call searchByTitle
      with the title copied exactly and limit 5, to learn whether the book
      exists under a different author. If every book has a match, make no
      calls and submit an empty checks list.

      For each book checked submit its id, title and author unchanged, and
      found: the returned doc that is this book (same title, allowing for
      case, punctuation and a subtitle), as { key, title, author_name } copied
      exactly, or null if none is. A found doc must not list the stated
      author, since that search already failed.
    produces:
      type: object
      required: [checks]
      properties:
        checks:
          type: array
          items:
            type: object
            required: [id, title, author, found]
            additionalProperties: false
            properties:
              id: { type: string }
              title: { type: string }
              author: { type: string }
              found: { anyOf: [{ $ref: "#/$defs/doc" }, { type: "null" }] }
    let:
      unmatched: { map: [{ filter: [{ var: steps.search.books }, { "!": { var: match } }] }, [{ var: id }, { var: title }, { var: author }]] }
      searched:
        map:
          - filter: [{ var: calls }, { and: [{ "==": [{ var: tool }, searchByTitle] }, { "!": { var: is_error } }] }]
          - object: [[title, { var: arguments.title }], [docs, { map: [{ var: result.docs }, *doc] }]]
    gates:
      - id: every-unmatched-book-once
        message: Check exactly the books whose match is null, once each, with id, title and author unchanged.
        predicate:
          and:
            - "==": [{ length: { var: output.checks } }, { length: { var: let.unmatched } }]
            - subset: [{ var: let.unmatched }, { map: [{ var: output.checks }, [{ var: id }, { var: title }, { var: author }]] }]
      - id: found-from-own-search-by-another-author
        message: >
          Every checked book needs a successful searchByTitle call with its
          exact title, and found must be null or one of that call's docs,
          copied exactly, whose author_name does not list the stated author.
          These books break it:
        predicate:
          none:
            - join: [{ var: output.checks }, { var: let.searched }, title, title]
            - or:
                - "==": [{ var: right }, null]
                - and:
                    - { var: left.found }
                    - or:
                        - "!": { subset: [[{ var: left.found }], { var: right.docs }] }
                        - in: [{ var: left.author }, { var: left.found.author_name }]
    retries: 2

  - id: classify
    do:
      output:
        verdicts:
          map:
            - join: [{ var: steps.search.books }, { var: steps.crosscheck.checks }, id, id]
            - object:
                - [id, { var: left.id }]
                - [title, { var: left.title }]
                - [author, { var: left.author }]
                - [verdict, { if: [{ var: left.match }, verified, { var: right.found }, wrong_author, not_found] }]
                - [work_key, { if: [{ var: left.match }, { var: left.match.key }, { var: right.found.key }] }]
                - [open_library_authors, { if: [{ var: left.match }, { var: left.match.author_name }, { var: right.found.author_name }] }]
        confirmed:
          map:
            - filter: [{ var: steps.search.books }, { var: match }]
            - object: [[title, { var: title }], [author, { var: author }], [work_key, { var: match.key }]]
        counts:
          verified: { length: { filter: [{ var: steps.search.books }, { var: match }] } }
          wrong_author: { length: { filter: [{ var: steps.crosscheck.checks }, { var: found }] } }
          not_found: { length: { filter: [{ var: steps.crosscheck.checks }, { "!": { var: found } }] } }
    produces:
      type: object
      required: [verdicts, confirmed, counts]
      properties:
        verdicts:
          type: array
          items:
            type: object
            required: [id, title, author, verdict, work_key, open_library_authors]
            additionalProperties: false
            properties:
              id: { type: string }
              title: { type: string }
              author: { type: string }
              verdict: { enum: [verified, wrong_author, not_found] }
              work_key: { type: [string, "null"] }
              open_library_authors: { type: [array, "null"], items: { type: string } }
        confirmed:
          type: array
          items:
            type: object
            required: [title, author, work_key]
            additionalProperties: false
            properties:
              title: { type: string }
              author: { type: string }
              work_key: { type: string }
        counts:
          type: object
          required: [verified, wrong_author, not_found]
          additionalProperties: false
          properties:
            verified: { type: integer, minimum: 0 }
            wrong_author: { type: integer, minimum: 0 }
            not_found: { type: integer, minimum: 0 }

  - id: publish
    instructions: |
      Verdicts for the reading list:

      {{steps.classify.verdicts}}

      verified means Open Library has the book under the stated author,
      wrong_author that it has it only under someone else, and not_found that
      neither search found it, so the book may not exist.

      Write a Markdown summary with the sections "## Confirmed" and
      "## Problems", in that order. Name every book by title with its id in
      parentheses, for example (B-03). For a wrong_author book name the
      author Open Library gives; for a verified or wrong_author book give its
      link as https://openlibrary.org followed by its work_key. Mention no
      work key that is not in the verdicts.
    produces:
      type: object
      required: [summary]
      properties:
        summary: { type: string, maxLength: 12000 }
    gates:
      - id: sections-in-order
        schema:
          properties:
            summary: { pattern: "## Confirmed[\\s\\S]*## Problems" }
      - id: summary-covers-every-book
        message: "The summary must mention every book id, for example (B-01); these are missing:"
        predicate:
          subset:
            - { map: [{ var: steps.classify.verdicts }, { var: id }] }
            - { match_all: [{ var: output.summary }, "B-[0-9]{2,}"] }
      - id: summary-keys-are-real
        message: "Every Open Library work key in the summary must be a work_key from the verdicts; these are not:"
        predicate:
          subset:
            - { match_all: [{ var: output.summary }, "/works/OL[0-9]+W"] }
            - { map: [{ var: steps.classify.verdicts }, { var: work_key }] }
    retries: 2

$defs:
  doc:
    type: object
    required: [key, title, author_name]
    additionalProperties: false
    properties:
      key: { type: string, pattern: "^/works/OL[0-9]+W$" }
      title: { type: string }
      author_name: { type: [array, "null"], items: { type: string } }
