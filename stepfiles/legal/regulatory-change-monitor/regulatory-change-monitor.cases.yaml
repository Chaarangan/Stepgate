            result:
              abstract: This amendment adopts miscellaneous amendments to the required IFR
                (instrument flight rules) altitudes and changeover points for
                certain Federal airways, jet routes, or direct routes for which
                a minimum or maximum en route authorized IFR altitude is
                prescribed. This regulatory action is needed because of changes
                occurring in the National Airspace System. These changes are
                designed to provide for the safe and efficient use of the
                navigable airspace under instrument conditions in the affected
                areas.
