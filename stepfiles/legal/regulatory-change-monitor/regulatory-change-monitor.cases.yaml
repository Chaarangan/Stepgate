            result:
              abstract: 'This action extends the comment period for the NPRM titled
                "Designation--Restrict the Operation of Unmanned Aircraft in
                Close Proximity to a Fixed Site Facility" that was published in
                the Federal Register on May 6, 2026, to allow commenters
                additional time to analyze the proposed rule and prepare a
                response. In the NPRM, FAA proposed a process for operators and
                proprietors of certain fixed site facilities to request an
                unmanned aircraft flight restriction (UAFR); criteria to
                demonstrate the UAFR is necessary for: aviation safety,
                protection of people and property on the ground, national
                security, or homeland security; and identified the types of
                operations allowed in the UAFR.'
