          - tool: getDocuments
            arguments:
              document_number: 2026-08943
            result:
              abstract: "This action would implement section 2209, of the FAA Extension,
                Safety and Security Act of 2016, by establishing a process for
                operators and proprietors of certain fixed site facilities to
                request and maintain an unmanned aircraft flight restriction.
                The proposal also establishes requirements for applicants to
                demonstrate the unmanned aircraft flight restriction is
                necessary for: aviation safety, protection of people and
                property on the ground, national security, or homeland security.
                Lastly, the proposal identifies the types of operations that are
                allowed in the unmanned aircraft flight restriction UAFR."
              action: Notice of proposed rulemaking (NPRM).
