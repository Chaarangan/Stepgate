# yaml-language-server: $schema=../../../server/schema/stepfile.schema.json
stepgate: "1"
id: event-weather-contingency
title: Weather go, contingency or postpone call for an outdoor event
description: >
  Finds the event location with Open-Meteo geocoding, fetches the daily
  forecast for the event date, applies fixed go, contingency and postpone
  thresholds, and writes a contingency plan that quotes the forecast it rests on.

inputs:
  type: object
  required: [place, country_code, date]
  properties:
    place: { type: string, minLength: 2, description: "Town or city name, for example Edinburgh" }
    country_code: { type: string, pattern: "^[A-Z]{2}$", description: "ISO 3166-1 alpha-2 country code of the place, for example GB" }
    date: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "Event date in the place's local time, YYYY-MM-DD, at most 15 days ahead" }

tools:
  geocoding:
    openapi:
      server: https://geocoding-api.open-meteo.com/v1
      document:
        openapi: 3.1.0
        info: { title: Open-Meteo Geocoding API (trimmed), version: "1" }
        paths:
          /search:
            get:
              operationId: searchPlace
              summary: Search places by name. Returns up to count matches with id, name, latitude, longitude, country_code, country and admin1.
              parameters:
                - { name: name, in: query, required: true, schema: { type: string, minLength: 2 } }
                - { name: count, in: query, schema: { type: integer, minimum: 1, maximum: 10 } }
                - { name: language, in: query, schema: { type: string, enum: [en] } }
                - { name: countryCode, in: query, schema: { type: string, pattern: "^[A-Z]{2}$" } }
    exposes: [searchPlace]
  forecast:
    openapi:
      server: https://api.open-meteo.com/v1
      document:
        openapi: 3.1.0
        info: { title: Open-Meteo Forecast API (trimmed), version: "1" }
        paths:
          /forecast:
            get:
              operationId: getForecast
              summary: Daily forecast for one point. Values come back as parallel arrays under daily, one entry per date in daily.time; units are °C, mm, % and km/h.
              parameters:
                - { name: latitude, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
                - { name: longitude, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
                - name: daily
                  in: query
                  required: true
                  schema:
                    type: string
                    enum: ["weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max"]
                - { name: timezone, in: query, required: true, schema: { type: string, enum: [auto] } }
                - { name: start_date, in: query, required: true, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" } }
                - { name: end_date, in: query, required: true, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" } }
    exposes: [getForecast]

steps:
  # The geocoder's first match in the input country is taken as the place.
  - id: locate
    do:
      calls:
        - id: search
          operation: searchPlace
          arguments: { name: { var: inputs.place }, count: 5, language: en, countryCode: { var: inputs.country_code } }
      output:
        geocoding_id: { var: responses.search.results.0.id }
        name: { var: responses.search.results.0.name }
        latitude: { var: responses.search.results.0.latitude }
        longitude: { var: responses.search.results.0.longitude }
        country_code: { var: responses.search.results.0.country_code }
        country: { var: responses.search.results.0.country }
        admin1: { var: responses.search.results.0.admin1 }
    produces:
      type: object
      required: [geocoding_id, name, latitude, longitude, country_code, country, admin1]
      properties:
        geocoding_id: { type: integer }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        country_code: { type: string }
        country: { type: [string, "null"] }
        admin1: { type: [string, "null"] }
    gates:
      - id: country-respected
        message: The geocoder's first match must be in the input country_code.
        predicate:
          "==": [{ var: output.country_code }, { var: inputs.country_code }]

  - id: forecast
    do:
      calls:
        - id: daily
          operation: getForecast
          arguments:
            latitude: { var: steps.locate.latitude }
            longitude: { var: steps.locate.longitude }
            start_date: { var: inputs.date }
            end_date: { var: inputs.date }
      output:
        forecast_date: { var: responses.daily.daily.time.0 }
        weather_code: { var: responses.daily.daily.weather_code.0 }
        temperature_max_c: { var: responses.daily.daily.temperature_2m_max.0 }
        temperature_min_c: { var: responses.daily.daily.temperature_2m_min.0 }
        precipitation_sum_mm: { var: responses.daily.daily.precipitation_sum.0 }
        precipitation_probability_max_pct: { var: responses.daily.daily.precipitation_probability_max.0 }
        wind_speed_max_kmh: { var: responses.daily.daily.wind_speed_10m_max.0 }
        wind_gusts_max_kmh: { var: responses.daily.daily.wind_gusts_10m_max.0 }
    produces:
      type: object
      required: [forecast_date, weather_code, temperature_max_c, temperature_min_c, precipitation_sum_mm, precipitation_probability_max_pct, wind_speed_max_kmh, wind_gusts_max_kmh]
      properties:
        forecast_date: { type: string }
        weather_code: { type: integer }
        temperature_max_c: { type: number }
        temperature_min_c: { type: number }
        precipitation_sum_mm: { type: number, minimum: 0 }
        precipitation_probability_max_pct: { type: number, minimum: 0, maximum: 100 }
        wind_speed_max_kmh: { type: number, minimum: 0 }
        wind_gusts_max_kmh: { type: number, minimum: 0 }
    gates:
      - id: date-is-event-date
        message: The forecast returned must be for the event date from the inputs.
        predicate:
          "==": [{ var: output.forecast_date }, { var: inputs.date }]

  - id: decide
    do:
      output:
        triggered:
          merge:
            - if: [&postpone-thunderstorm { in: [{ var: steps.forecast.weather_code }, [95, 96, 99]] }, [postpone-thunderstorm], []]
            - if: [&postpone-gusts { ">=": [{ var: steps.forecast.wind_gusts_max_kmh }, 65] }, [postpone-gusts], []]
            - if: [&postpone-heavy-rain { ">=": [{ var: steps.forecast.precipitation_sum_mm }, 15] }, [postpone-heavy-rain], []]
            - if: [&postpone-extreme-heat { ">=": [{ var: steps.forecast.temperature_max_c }, 38] }, [postpone-extreme-heat], []]
            - if: [&contingency-rain-chance { ">=": [{ var: steps.forecast.precipitation_probability_max_pct }, 40] }, [contingency-rain-chance], []]
            - if: [&contingency-rain { ">=": [{ var: steps.forecast.precipitation_sum_mm }, 2] }, [contingency-rain], []]
            - if: [&contingency-gusts { ">=": [{ var: steps.forecast.wind_gusts_max_kmh }, 40] }, [contingency-gusts], []]
            - if: [&contingency-wind { ">=": [{ var: steps.forecast.wind_speed_max_kmh }, 30] }, [contingency-wind], []]
            - if: [&contingency-heat { ">=": [{ var: steps.forecast.temperature_max_c }, 32] }, [contingency-heat], []]
            - if: [&contingency-cold { "<=": [{ var: steps.forecast.temperature_min_c }, 5] }, [contingency-cold], []]
        decision:
          if:
            - or: [*postpone-thunderstorm, *postpone-gusts, *postpone-heavy-rain, *postpone-extreme-heat]
            - postpone
            - or: [*contingency-rain-chance, *contingency-rain, *contingency-gusts, *contingency-wind, *contingency-heat, *contingency-cold]
            - contingency
            - go
    produces:
      type: object
      required: [decision, triggered]
      properties:
        decision: { enum: [go, contingency, postpone] }
        triggered:
          type: array
          uniqueItems: true
          items:
            enum: [postpone-thunderstorm, postpone-gusts, postpone-heavy-rain, postpone-extreme-heat, contingency-rain-chance, contingency-rain, contingency-gusts, contingency-wind, contingency-heat, contingency-cold]

  - id: plan
    instructions: |
      Write the contingency plan for an outdoor event at {{steps.locate.name}}
      ({{steps.locate.country}}) on {{inputs.date}}.

      Forecast: {{steps.forecast}}
      Decision: {{steps.decide.decision}}
      Triggered rules: {{steps.decide.triggered}}

      Submit markdown with the sections "## Decision", "## Forecast",
      "## Thresholds triggered" and "## Plan", in that order.
      - Decision: state the decision in bold, as **go**, **contingency** or
        **postpone**. Bold no other decision word anywhere.
      - Forecast: quote every value exactly as given, followed by its unit:
        "WMO code <weather_code>", "<temperature_max_c> °C",
        "<temperature_min_c> °C", "<precipitation_sum_mm> mm",
        "<precipitation_probability_max_pct> %", "<wind_speed_max_kmh> km/h"
        and "<wind_gusts_max_kmh> km/h". Say the source is the Open-Meteo forecast.
      - Thresholds triggered: each triggered rule id in backticks, for
        example `contingency-rain`, with the value that tripped it. Write
        "None" if the list is empty. Put no other rule id in backticks.
      - Plan: concrete actions for the organiser that fit the decision (for
        contingency: covered areas, wind-safe structures, heat or cold
        measures as the triggered rules require; for postpone: who to notify
        and when to re-check; for go: final checks). No new forecast figures.
    produces:
      type: object
      required: [decision, markdown]
      properties:
        decision: { enum: [go, contingency, postpone] }
        markdown: { type: string, maxLength: 6000 }
    derive:
      decision: { var: steps.decide.decision }
    let:
      bolded: { match_all: [{ var: output.markdown }, "\\*\\*(go|contingency|postpone)\\*\\*"] }
      cited: { match_all: [{ var: output.markdown }, "`((?:postpone|contingency)-[a-z-]+)`"] }
    gates:
      - id: sections-in-order
        schema:
          properties:
            markdown:
              pattern: "## Decision[\\s\\S]*## Forecast[\\s\\S]*## Thresholds triggered[\\s\\S]*## Plan"
      - id: decision-bolded
        message: The markdown must bold the decide step's decision and no other decision word.
        predicate:
          and:
            - ">": [{ length: { var: let.bolded } }, 0]
            - subset: [{ var: let.bolded }, [{ var: steps.decide.decision }]]
      - id: forecast-quoted
        message: >
          The markdown must quote every forecast value exactly as the forecast
          step recorded it, with its unit: "WMO code N", "N °C" (max and min),
          "N mm", "N %" and "N km/h" (wind and gusts).
        predicate:
          and:
            - in: [{ cat: ["WMO code ", { var: steps.forecast.weather_code }] }, { var: output.markdown }]
            - in: [{ cat: [{ var: steps.forecast.temperature_max_c }, " °C"] }, { var: output.markdown }]
            - in: [{ cat: [{ var: steps.forecast.temperature_min_c }, " °C"] }, { var: output.markdown }]
            - in: [{ cat: [{ var: steps.forecast.precipitation_sum_mm }, " mm"] }, { var: output.markdown }]
            - in: [{ cat: [{ var: steps.forecast.precipitation_probability_max_pct }, " %"] }, { var: output.markdown }]
            - in: [{ cat: [{ var: steps.forecast.wind_speed_max_kmh }, " km/h"] }, { var: output.markdown }]
            - in: [{ cat: [{ var: steps.forecast.wind_gusts_max_kmh }, " km/h"] }, { var: output.markdown }]
      - id: thresholds-cited
        message: The backticked rule ids in the markdown must be exactly the rules the decide step triggered.
        predicate:
          and:
            - subset: [{ var: let.cited }, { var: steps.decide.triggered }]
            - subset: [{ var: steps.decide.triggered }, { var: let.cited }]
    retries: 2
