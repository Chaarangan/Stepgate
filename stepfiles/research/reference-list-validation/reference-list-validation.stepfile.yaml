# yaml-language-server: $schema=../../../server/schema/stepfile.schema.json
stepgate: "1"
id: reference-list-validation
title: Validate a reference list against Crossref
description: >
  Resolves every reference in a list to a real Crossref DOI record and flags
  references that are fabricated, carry the wrong DOI, or misstate the author
  or year.

inputs:
  type: object
  required: [references]
  properties:
    references:
      type: array
      description: One formatted reference per entry, in any citation style.
      minItems: 1
      maxItems: 25
      items: { type: string, minLength: 10 }

tools:
  # Two tools over the same endpoint so gates can tell a DOI lookup from a
  # bibliographic search. The single-work endpoint /works/{doi} is avoided
  # because it cannot trim its response and returns about 40,000 characters.
  crossref-doi:
    openapi:
      server: https://api.crossref.org
      document:
        openapi: 3.1.0
        info: { title: Crossref REST API, DOI lookup, version: "1" }
        paths:
          /works:
            get:
              operationId: lookupDoi
              summary: >
                Look up one DOI in Crossref. message.items holds the record, or
                is empty with total-results 0 when Crossref has no such DOI.
              parameters:
                - name: filter
                  in: query
                  required: true
                  description: "The string doi: followed by exactly one DOI, for example doi:10.1038/nature14539"
                  schema: { type: string, pattern: "^doi:10\\.[0-9]{4,9}/[^,\\s]+$" }
                - name: select
                  in: query
                  required: true
                  description: The fields to return; only this value is accepted.
                  schema: { type: string, enum: ["DOI,title,author,issued,container-title"] }
              responses:
                "200": { description: A Crossref work list }
    exposes: [lookupDoi]
  crossref-search:
    openapi:
      server: https://api.crossref.org
      document:
        openapi: 3.1.0
        info: { title: Crossref REST API, work search, version: "1" }
        paths:
          /works:
            get:
              operationId: searchWorks
              summary: >
                Search Crossref works by free text and return the best matches
                first in message.items.
              parameters:
                - name: query
                  in: query
                  required: true
                  description: Free-text search terms, for example a title followed by the first author's family name.
                  schema: { type: string, minLength: 3 }
                - name: rows
                  in: query
                  required: true
                  description: Number of results, 1 to 5.
                  schema: { type: integer, minimum: 1, maximum: 5 }
                - name: select
                  in: query
                  required: true
                  description: The fields to return; only this value is accepted.
                  schema: { type: string, enum: ["DOI,title,author,issued,container-title"] }
              responses:
                "200": { description: A Crossref work list }
    exposes: [searchWorks]

steps:
  - id: parse
    instructions: |
      Here is a list of references:

      {{inputs.references}}

      Parse every reference into structured fields. Number them R-01, R-02
      and so on, in the order given. For each one submit:

      - raw: the reference text exactly as given, character for character.
      - title: the work's title, copied verbatim from raw (same case and
        punctuation, without surrounding quotes).
      - first_author: the first author's family name, copied verbatim from raw.
      - year: the publication year as an integer, or null if raw has none.
      - doi: the DOI starting with "10.", copied verbatim from raw without any
        https://doi.org/ prefix, or null if raw cites no DOI.

      Do not correct anything you believe is wrong; record what the reference
      says.
    produces:
      type: object
      required: [references]
      properties:
        references:
          type: array
          items: { $ref: "#/$defs/cited" }
    gates:
      - id: every-reference-once
        message: Submit one parsed entry per input reference, with raw equal to the input text exactly.
        predicate:
          and:
            - "==":
                - { length: { var: output.references } }
                - { length: { var: inputs.references } }
            - subset:
                - { var: inputs.references }
                - { map: [{ var: output.references }, { var: raw }] }
            - subset:
                - { map: [{ var: output.references }, { var: raw }] }
                - { var: inputs.references }
      - id: ids-unique
        message: Every reference id must appear once.
        predicate:
          "==":
            - { length: { unique: { map: [{ var: output.references }, { var: id }] } } }
            - { length: { var: output.references } }
      - id: fields-come-from-raw
        message: title, first_author, year and doi must each appear verbatim in that reference's raw text.
        predicate:
          "==":
            - length:
                filter:
                  - { var: output.references }
                  - "!":
                      and:
                        - in: [{ var: title }, { var: raw }]
                        - in: [{ var: first_author }, { var: raw }]
                        - or:
                            - "==": [{ var: doi }, null]
                            - in: [{ var: doi }, { var: raw }]
                        - or:
                            - "==": [{ var: year }, null]
                            - in: [{ cat: [{ var: year }] }, { var: raw }]
            - 0
    retries: 2

  # Crossref echoes a search's terms and returns DOIs in lowercase, so each
  # reference is paired with its own search and lookup by those keys.
  - id: lookup
    do:
      calls:
        - id: dois
          operation: lookupDoi
          each: { unique: { map: [{ filter: [{ var: steps.parse.references }, { var: doi }] }, { lower: { var: doi } }] } }
          # A bare filter key would read as the filter operator, so object builds it.
          arguments: { object: [[filter, { cat: ["doi:", { var: item }] }]] }
        - id: searches
          operation: searchWorks
          each: { var: steps.parse.references }
          arguments: { query: { cat: [{ var: item.title }, " ", { var: item.first_author }] }, rows: 3 }
      output:
        references:
          map:
            - join:
                - map:
                    - join:
                        - map:
                            - { var: steps.parse.references }
                            - object:
                                - [id, { var: id }]
                                - [raw, { var: raw }]
                                - [title, { var: title }]
                                - [first_author, { var: first_author }]
                                - [year, { var: year }]
                                - [doi, { var: doi }]
                                - [search_terms, { cat: [{ var: title }, " ", { var: first_author }] }]
                        - map:
                            - { var: responses.searches }
                            - object: [[search_terms, { var: message.query.search-terms }], [candidates, { map: [{ var: message.items }, &record { object: [[doi, { var: DOI }], [title, { var: title.0 }], [first_author, { var: author.0.family }], [year, { var: "issued.date-parts.0.0" }]] }] }]]
                        - search_terms
                        - search_terms
                    - object: [[ref, { var: left }], [candidates, { var: right.candidates }], [doi_key, { lower: { var: left.doi } }]]
                - flatten: { map: [{ var: responses.dois }, { map: [{ var: message.items }, *record] }] }
                - doi_key
                - doi
            - object:
                - [id, { var: left.ref.id }]
                - [raw, { var: left.ref.raw }]
                - [title, { var: left.ref.title }]
                - [first_author, { var: left.ref.first_author }]
                - [year, { var: left.ref.year }]
                - [doi, { var: left.ref.doi }]
                - [search_terms, { var: left.ref.search_terms }]
                - [candidates, { var: left.candidates }]
                - [doi_record, { var: right }]
    produces:
      type: object
      required: [references]
      properties:
        references:
          type: array
          items: { $ref: "#/$defs/evidence" }

  - id: resolve
    instructions: |
      Each reference below has its parsed fields, doi_record (the Crossref
      record for its cited DOI, or null when it cites none or Crossref has no
      such DOI) and candidates (a Crossref search by its title and first
      author):

      {{steps.lookup.references}}

      For every reference, submit its id and matched: the record from
      doi_record or candidates that is this work, copied exactly, or null if
      none is. It is this work when it has the same title, allowing for case,
      punctuation and a subtitle; the cited DOI, author or year may be wrong,
      which is what this check reports. Give a short note on why you chose
      that record or none.
    produces:
      type: object
      required: [matches, references]
      properties:
        matches:
          type: array
          items:
            type: object
            required: [id, matched, note]
            additionalProperties: false
            properties:
              id: { type: string }
              matched: { anyOf: [{ $ref: "#/$defs/record" }, { type: "null" }] }
              note: { type: string, minLength: 5 }
        references:
          type: array
          items:
            allOf:
              - { $ref: "#/$defs/evidence" }
              - type: object
                required: [verdict, matched, note]
                properties:
                  verdict: { enum: [verified, wrong_doi, metadata_mismatch, not_found] }
                  matched: { anyOf: [{ $ref: "#/$defs/record" }, { type: "null" }] }
                  note: { type: [string, "null"] }
    # Pairs from the evidence side, so a missing id derives a row the gates then reject.
    derive:
      references:
        map:
          - join: [{ var: steps.lookup.references }, { var: output.matches }, id, id]
          - object:
              - [id, { var: left.id }]
              - [raw, { var: left.raw }]
              - [title, { var: left.title }]
              - [first_author, { var: left.first_author }]
              - [year, { var: left.year }]
              - [doi, { var: left.doi }]
              - [search_terms, { var: left.search_terms }]
              - [candidates, { var: left.candidates }]
              - [doi_record, { var: left.doi_record }]
              - [matched, { var: right.matched }]
              - [note, { var: right.note }]
              - - verdict
                - if:
                    - "!": { var: right.matched }
                    - not_found
                    - and: [{ var: left.doi }, { "!==": [{ var: right.matched.doi }, { var: left.doi_record.doi }] }]
                    - wrong_doi
                    - and:
                        - or:
                            - "==": [{ var: left.year }, null]
                            - "<=": [{ "-": [{ var: left.year }, 1] }, { var: right.matched.year }, { "+": [{ var: left.year }, 1] }]
                        - in: [{ var: right.matched.first_author }, { var: left.raw }]
                    - verified
                    - metadata_mismatch
    gates:
      - id: every-reference-once
        message: Submit every reference id exactly once.
        predicate:
          and:
            - "==": [{ length: { var: output.matches } }, { length: { var: steps.lookup.references } }]
            - subset: [{ map: [{ var: steps.lookup.references }, { var: id }] }, { map: [{ var: output.matches }, { var: id }] }]
      - id: matched-is-evidence
        message: "matched must be null or one of that reference's own candidates or its doi_record, copied exactly; these are not:"
        predicate:
          none:
            - join: [{ var: output.matches }, { var: steps.lookup.references }, id, id]
            - and:
                - { var: left.matched }
                - "!": { subset: [[{ var: left.matched }], { merge: [{ var: right.candidates }, [{ var: right.doi_record }]] }] }
    retries: 2

  - id: tally
    do:
      output:
        counts:
          verified: { length: { filter: [{ var: steps.resolve.references }, { "==": [{ var: verdict }, verified] }] } }
          wrong_doi: { length: { filter: [{ var: steps.resolve.references }, { "==": [{ var: verdict }, wrong_doi] }] } }
          metadata_mismatch: { length: { filter: [{ var: steps.resolve.references }, { "==": [{ var: verdict }, metadata_mismatch] }] } }
          not_found: { length: { filter: [{ var: steps.resolve.references }, { "==": [{ var: verdict }, not_found] }] } }
        flagged:
          map:
            - filter: [{ var: steps.resolve.references }, { "!=": [{ var: verdict }, verified] }]
            - object: [[id, { var: id }], [verdict, { var: verdict }], [correct_doi, { var: matched.doi }]]
    produces:
      type: object
      required: [counts, flagged]
      properties:
        counts:
          type: object
          required: [verified, wrong_doi, metadata_mismatch, not_found]
          additionalProperties: false
          properties:
            verified: { type: integer, minimum: 0 }
            wrong_doi: { type: integer, minimum: 0 }
            metadata_mismatch: { type: integer, minimum: 0 }
            not_found: { type: integer, minimum: 0 }
        flagged:
          type: array
          items:
            type: object
            required: [id, verdict, correct_doi]
            additionalProperties: false
            properties:
              id: { type: string }
              verdict: { enum: [wrong_doi, metadata_mismatch, not_found] }
              correct_doi: { type: [string, "null"] }

  - id: report
    instructions: |
      Checked references:

      {{steps.resolve.references}}

      Counts per verdict: {{steps.tally.counts}}

      Write a Markdown summary with the sections "## Summary", "## Flagged
      references" and "## Verified references", in that order. Summary gives
      the counts. Flagged references lists every reference whose verdict is
      not verified, by id (for example R-03), with its verdict, its note and,
      where matched is not null, the correct DOI. Verified references lists
      every verified id with its DOI. Mention every reference id at least
      once. Write every DOI in backticks, for example `10.1038/nature14539`,
      and write no DOI that is not in the checked references.
    produces:
      type: object
      required: [summary]
      properties:
        summary: { type: string, maxLength: 12000 }
    gates:
      - id: sections-in-order
        schema:
          properties:
            summary:
              pattern: "## Summary[\\s\\S]*## Flagged references[\\s\\S]*## Verified references"
      - id: summary-covers-every-reference
        message: "The summary must mention every reference id; these are missing:"
        predicate:
          subset:
            - { map: [{ var: steps.resolve.references }, { var: id }] }
            - { match_all: [{ var: output.summary }, "R-[0-9]{2,}"] }
      - id: summary-dois-are-real
        message: "Every DOI in the summary must be written in backticks and be a cited DOI or a matched Crossref DOI; these are not:"
        predicate:
          subset:
            - { match_all: [{ var: output.summary }, "`(10\\.[0-9]{4,9}/[^`\\s]+)`"] }
            - merge:
                - { map: [{ var: steps.resolve.references }, { var: matched.doi }] }
                - { map: [{ var: steps.resolve.references }, { var: doi }] }
    retries: 2

$defs:
  cited:
    type: object
    required: [id, raw, title, first_author, year, doi]
    properties:
      id: { type: string, pattern: "^R-[0-9]{2,}$" }
      raw: { type: string }
      title: { type: string, minLength: 1 }
      first_author: { type: string, minLength: 1 }
      year: { type: [integer, "null"] }
      doi: { type: [string, "null"], pattern: "^10\\.[0-9]{4,9}/[^,\\s]+$" }
  evidence:
    allOf:
      - { $ref: "#/$defs/cited" }
      - type: object
        required: [search_terms, candidates, doi_record]
        properties:
          search_terms: { type: string }
          candidates: { type: array, maxItems: 5, items: { $ref: "#/$defs/record" } }
          doi_record: { anyOf: [{ $ref: "#/$defs/record" }, { type: "null" }] }
  record:
    type: object
    required: [doi, title, first_author, year]
    additionalProperties: false
    properties:
      doi: { type: string }
      title: { type: [string, "null"] }
      first_author: { type: [string, "null"] }
      year: { type: [integer, "null"] }
